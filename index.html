<script>
const DATA = [{"id": 76, "public_title": "全國知名柑橘產地嘗試轉作國產酪梨，能否成為氣候變遷解方？", "public_summary": "面對持續高溫，果樹產地短期以遮蔭資材因應，中長期則有產地嘗試「樹種轉換」為耐熱作物，但轉作須承擔收益不穩定風險。", "public_article": "從柑橘補充作物到國產酪梨產地\r\n松山市近20年試種經驗顯示，樹種轉換既是氣候調適，也是一場長期產業選擇\r\n\r\n面對高溫加劇，果樹產區常以遮陰、灌溉或生物刺激素等方式降低短期傷害；若從更長時間尺度來看，當原有作物愈來愈難維持品質與產量，改種較適應未來氣候的樹種，也逐漸成為可能選項。不過，多年生果樹從定植到穩定生產需要數年，品種、低溫、土壤與市場條件只要有一項不合適，都可能使轉換成本難以回收。\r\n\r\n日本愛媛縣松山市約在2007年前後開始尋找柑橘以外的補充作物，並於2009年由市立農業指導中心生產酪梨苗木，提供市內農民栽植。這項工作最初並非以氣候變遷為出發點，而是回應伊予柑與溫州蜜柑價格低迷、農家收入來源過度集中的問題。近20年後，當西日本各地開始思考暖化下的樹種調整，松山市累積的經驗也成為觀察果樹轉換風險的重要案例。\r\n\r\n【起點不是暖化，而是柑橘收益下滑】\r\n\r\n松山市屬瀨戶內海式氣候，氣候溫暖、降雨較少，山區又分布排水良好的花崗岩風化土，因此長期以柑橘為主要產業。全市約有1,600個農業經營體以柑橘為主，占農業經營體約55%；2023年農業產值超過130億日圓，其中果樹占一半以上，「紅まどんな」、「せとか」與「甘平」等高級柑橘也已形成品牌。\r\n\r\n不過，約在2007年前後，伊予柑與溫州蜜柑同時面臨供給過剩與消費減少，部分農家只靠柑橘已難以維持收入。松山市當時並未立即要求農民全面更新果園，而是先尋找能補充所得的品項，陸續嘗試露天蔬菜、七草、萊姆與酪梨，最後持續發展的主要是萊姆與酪梨。\r\n\r\n酪梨之所以進入候選名單，是因為市內原本就有人零星栽植，而且結實情況不差。地方政府據此邀請農民共同試作，再由農業指導中心建立育苗與技術輔導機制。這種由既有地方經驗出發、先小規模測試的方式，也降低了直接引進陌生作物的風險。\r\n\r\n【市立農業指導中心成為技術累積的核心】\r\n\r\n松山市農業指導中心由市政府設立，兼具地方試驗與技術推廣功能。相較於服務範圍較大的縣級試驗場，市立單位能把研究焦點集中在當地土壤、氣候、品牌與後繼者培育等問題。\r\n\r\n農業指導中心自2009年起生產酪梨苗木，並以有償方式提供市內農民。這個做法看似只是供應種苗，實際上也建立了較一致的品種來源與技術追蹤基礎。當農民陸續遇到寒害、落果、病害與低產問題時，地方政府可以把個別經驗整理成共同課題，再與生產者一起調整修剪、施肥與開花期管理。\r\n\r\n多年生果樹的技術往往無法在單一季節內完成驗證。從苗木存活、樹冠形成、首次結果到進入穩定產期，每一階段都可能出現不同問題。松山市能持續近20年，關鍵不只在於選對作物，也在於有一個地方技術單位長期保存失敗與成功經驗。\r\n\r\n【氣候變暖，不代表熱帶果樹就能穩定生產】\r\n\r\n松山市目前酪梨栽培面積約15公頃，年產量約7至8公噸。雖然氣候相對溫暖，最大的生產風險仍然是低溫。酪梨屬亞熱帶至熱帶果樹，遇到持續低溫與寒風時，幼苗容易受害，嚴重時連栽植10年的大樹也可能枯死。松山市冬季部分年份仍會降至零下4至5°C，海岸地區受害較輕，內陸田區則可能因冷空氣滯留而出現較大損失。意即，年平均氣溫上升不能直接等同於所有熱帶作物都更適合栽培。暖化同時伴隨氣候波動，冬季短時間急遽降溫、寒風及極端事件仍可能發生。對多年生果樹而言，只要一次嚴重寒害造成樹體死亡，前幾年的投入便可能歸零。\r\n\r\n因此，評估樹種轉換時，不能只看夏季最高溫或年平均溫度，最低溫、低溫持續時間、冷空氣流動與坡向同樣重要。\r\n\r\n【比寒害更難處理的是產量不穩】\r\n\r\n松山市的酪梨生產目前仍未達到柑橘的單位面積產量。柑橘每10公畝有機會收穫3至4公噸，酪梨即使是較高產的生產者，現階段約為400公斤，部分年份甚至幾乎沒有收成。酪梨對開花期環境、樹體養分與水分狀態相當敏感。當著果量超過植株負荷，或溫度、授粉及營養條件不適合時，植株可能大量落果。這也使單看果實單價，容易高估實際收益。\r\n\r\n目前當地持續研究修剪時期與強度、肥料成分與施用時間，以及開花期的管理方式。這些工作代表酪梨產地化尚未進入完全成熟階段，而是仍在建立「如何穩定結果」的基本栽培體系。\r\n\r\n部分農民因寒害、病害或產量不足退出，也有人在苗木枯死後重新栽植。這些不同反應，往往與經營目標有關。原本只想把酪梨作為柑橘補充品項的農家，承擔風險的方式，和準備以酪梨作為主要收入來源的經營者並不相同。\r\n\r\n【高單價提供誘因，但產地不能只靠稀缺性】\r\n\r\n日本市場上的酪梨以進口品為主，國產酪梨具有新鮮、在地與稀少等優勢。若能穩定供應，較高單價確實可能彌補目前偏低的產量，也讓部分農民願意持續投入。松山市目前以「松山酪梨」推動品牌化，農業指導中心負責栽培技術，農林水產振興部門則處理銷售與宣傳。這種技術與市場同步推進的安排，有助於避免只擴大種植，卻沒有建立規格、通路與消費辨識。\r\n\r\n不過，國產稀缺性不會自動形成穩定產業。若產量過少、供貨年份不固定，通路難以建立長期採購；若不同農戶的成熟度、品質與品種差異過大，也不利於共同品牌經營。\r\n\r\n目前松山市栽培「Bacon」、「Fuerte」、「Pinkerton」與「Hass」等4個品種。多品種可分散低溫、開花與採收期風險，但也會增加栽培管理、成熟判斷與市場溝通的複雜度。後續產地能否擴大，除了提高總產量，也要逐步建立品種配置、採收標準與品質分級。\r\n\r\n【樹種轉換需要先回答場地是否適合】\r\n\r\n松山市的經驗顯示，酪梨產地化首先是一項立地評估問題。最低氣溫、土壤排水、日照、風勢與地形，都會影響苗木存活與後續結果。排水尤其重要。松山市部分山坡地分布顆粒較粗的真砂土，原本有利於柑橘生產，也能降低酪梨根部長期積水的風險。但即使同一行政區內，海岸、山坡與內陸低地的微氣候仍可能差異很大，不能以城市平均氣象資料直接判斷個別果園。\r\n\r\n品種選擇也需配合田區條件。有些品種耐寒性較佳，有些則具有較高市場辨識或不同成熟期。若只依市場最常見品種種植，卻未考量冬季低溫與授粉組合，可能在樹體長大後才發現環境不合。\r\n\r\n因此，樹種轉換較適合先從少量田區與多品種試種開始，連續觀察冬季存活、開花、結果、病害與品質，再決定是否擴大，而不是因暖化趨勢便一次替換整片果園。\r\n\r\n【多年空窗期是農家最現實的風險】\r\n\r\n果樹轉換和一年生作物不同。舊樹移除後，新樹要經過數年才能形成可觀產量，期間仍需投入苗木、整地、防風、防寒、修剪與肥培成本。若新作物最後無法穩定結果，農家承擔的不只是當年損失，而是多年收入空窗。松山市最初把酪梨定位為補充品項，而非全面取代柑橘，某種程度上也分散了這項風險。農民可以保留原有柑橘收入，在部分田區累積酪梨經驗，再依成效調整投入程度。\r\n\r\n這種漸進模式比直接宣告「轉作」更符合多年生果樹的實際條件。對地方政府而言，補助苗木只是起點，更重要的是協助農家度過未結果期、建立技術支援、處理寒害後重建，以及評估新作物能否形成市場。\r\n\r\n【氣候調適往往從既有經營問題開始】\r\n\r\n松山市的酪梨計畫並非因氣候變遷政策而啟動，而是從柑橘價格低迷與農家所得問題出發。只是隨著氣溫上升，原本的補充品項又具有新的氣候調適意義。顯示產業調適不一定從氣候模型開始，也可能從市場、勞力與農家收益等既有問題逐步發展。若新作物同時具備較高溫適應性與市場潛力，便可能成為未來產區調整的一部分。\r\n\r\n但這不表示酪梨就是柑橘產區的標準答案。松山市近20年的經驗仍顯示，寒害、落果、低產與技術未成熟等問題尚未完全解決。氣候變暖可能擴大部分作物的適生範圍，也會帶來新的極端事件與病蟲害風險。\r\n\r\n【產地化的目標不是種得出，而是農民能穩定獲利】\r\n\r\n松山市目前希望先將年產量由7至8公噸提高到10公噸以上，長期目標則是建立農民能穩定獲利的國產酪梨產地。這個目標比擴大種植面積更重要。果樹產地是否成立，不能只看苗木數量或參與農戶，而要看成園率、單位面積產量、年際穩定度、商品率、銷售價格與農家實際所得。\r\n\r\n松山市的案例說明，樹種轉換需要市場動機、地方技術單位與生產者長期合作，也要接受多年試錯。對其他正在尋找氣候調適作物的果樹產區而言，最值得參考的或許不是「改種酪梨」，而是先從場地調查、小規模試種與收入風險分散開始，再逐步判斷新樹種是否真正適合成為產業。", "public_article_format": "text", "public_date": "2026-07-25", "published_date": "2026-06-29", "public_image_url": "https://i.ibb.co/ycnwc5f2/Chat-GPT-Image-2026-7-25-02-32-43.png", "topic": "B_氣候韌性與農業風險管理", "country": "日本", "language": "日文", "source_org": "マイナビ農業", "title_original": "全国有数の柑橘産地が挑む、国産アボカドへの樹種転換。気候変動の処方箋となるか", "url": "https://agri.mynavi.jp/2026_06_29_534707/"}, {"id": 114, "public_title": "氣候智慧農業能否擴散，農民之間的信任是關鍵", "public_summary": "Bioversity International與國際熱帶農業中心研究團隊在《Agricultural Systems》發表研究指出，氣候智慧農業創新技術能否從農民間擴散普及，不只取決於技術本身特性，更取決於農民間的信任、互助關係與社會資本。", "public_article": "面對氣候變異加劇與極端事件增加，農業研究持續開發耐旱、節水、土壤管理與氣候風險調適等技術。然而，技術完成後，如何讓農民理解、調整並持續採用，仍是農業推廣的重要課題。生物多樣性國際聯盟與國際熱帶農業中心、哥本哈根大學及蓋茲基金會的研究團隊，分析瓜地馬拉與宏都拉斯514位小農的資料，探討信任、互助與知識分享如何影響氣候智慧農業的擴散。\r\n\r\n研究發現，創新能否進入農村社群，除了技術本身是否有效，也受到農民之間的信任、日常互動與互助關係影響。相較於直接觀察技術採用率，研究團隊更關注一個較早出現的現象：農民是否開始分享經驗、討論問題，並依自身條件調整新作法。\r\n\r\n【技術有效，不代表會自然擴散】\r\n\r\n農業創新的成效，通常在大量農民採用後才接受評估。但技術從示範場域走向更多農戶，中間還經過資訊傳遞、觀察、討論、試做與調整等階段。農民可能先從鄰近農戶得知一項新作法，再觀察對方的田間表現，詢問投入成本與管理細節，最後依自身土地、作物與資源條件調整。這些互動發生時，技術尚未形成大規模採用，卻已進入社群的學習與判斷過程。\r\n\r\n研究團隊因此提出，知識分享可視為創新負責任擴散的早期訊號。當農民開始交換經驗，代表新技術已從單向宣導，進入社群內部的理解、討論與調整。\r\n\r\n這項觀點也提醒，技術擴散不宜只以參訓人數、示範面積或採用戶數衡量。農民是否願意談論、分享及回應他人問題，同樣反映創新能否持續發展。\r\n\r\n【農民之間的信任，比對組織的信任更有影響】\r\n\r\n研究結果顯示，農民愈信任社區內其他農民，愈願意分享氣候智慧農業的知識與經驗。農民之間的關係愈緊密，資訊也較容易在社群內流動。這些關係降低嘗試新技術時的不確定性。農民可以從熟悉的人取得實際經驗，了解某項措施需要多少投入、遇到哪些問題，以及結果是否符合期待。\r\n\r\n相較之下，農民對組織的信任，對知識分享的影響較小。這不表示政府、研究機構或發展組織沒有作用，而是顯示正式推廣單位提供資訊後，農民是否願意採信與轉傳，仍高度依賴社群內部關係。對推廣計畫而言，找出社區中具影響力、願意分享且受到信任的農民，可能比單純增加宣導次數更有效。\r\n\r\n【信任不足時，互助能維持知識流動】\r\n\r\n研究也發現，在農民彼此信任程度較低的社區，互助關係格外重要。如農民願意提供操作指導、共同解決問題或交換田間經驗，即使社群原有信任不強，知識仍有機會持續流動。這類實際協助能降低採用門檻，也讓農民在嘗試新作法時不必獨自承擔所有風險。\r\n互助可能包含共同觀察示範田、借用設備、協助判斷病蟲害、比較不同處理結果，或在作物遭遇乾旱時共同調整管理方式。因此，推廣計畫若只傳遞技術內容，卻沒有建立後續協作與支持安排，農民可能知道一項技術，卻仍缺乏實際試用的條件。\r\n\r\n【知識分享不是單向傳遞】\r\n\r\n研究中的知識分享並非單純把技術手冊交給農民，也不限於講師向學員說明操作步驟。農民在交流過程中，會把技術與自身經驗相互比較，再依土地規模、勞力、資金、氣候及市場條件調整。不同農戶也可能針對相同技術，發展出不同使用方式。這顯示知識擴散是一個社會與在地調整的過程。技術內容在社群中流動時，會接受質疑、驗證與修正。這類互動有助於發現原始設計未考量的限制，也能避免推廣單位把單一作法直接套用到條件差異很大的農場。\r\n\r\n【採用與分享之間具有正向關聯】\r\n\r\n研究團隊也發現，採用氣候智慧農業作法的農民，較常分享相關知識。這顯示實際採用與知識交流彼此連動。農民親自使用一項技術後，較能說明成本、操作方式與成效，也較容易回應其他農民的疑問。當這些經驗進入社群討論，其他農戶便能據此判斷是否適合嘗試。不過，這項關聯並不能直接證明知識分享必然促成採用，也可能是採用後增加了分享意願。研究的重點在於，兩者關係密切，推廣計畫應同時觀察農民的實際行動與社群交流。\r\n\r\n【推廣工作應把社會關係納入設計】\r\n\r\n對政府、研究機構與發展組織而言，這項研究指出，創新擴散不能只靠技術訓練、示範場域或補助。計畫設計還需考量農民之間如何互動、誰是主要資訊來源，以及社區內是否存在互助網絡。具體作法可能包括培養農民講師、安排同儕交流、支持共同試驗，或建立小型學習群組。推廣人員也可觀察哪些農民經常接受他人詢問、哪些人願意公開失敗經驗，以及哪些社群成員能跨越不同群體分享資訊。這些角色未必是職務上的領導者，卻可能是實際影響技術擴散的關鍵節點。\r\n\r\n許多農業計畫習慣在期末統計採用戶數、面積與產量變化，但技術擴散通常需要較長時間。若只看最終採用，可能難以及早判斷推廣策略是否有效。研究團隊建議，可把知識分享納入前期評估，包括農民是否主動詢問、是否與鄰近農戶討論、是否分享試作結果，以及是否依自身條件調整技術。這些指標能協助計畫團隊了解，技術是否已進入社群學習過程。即使正式採用比例仍低，也能判斷哪些作法開始受到關注，哪些資訊仍未獲得信任。\r\n\r\n【負責任擴散需要保留調整空間】\r\n\r\n研究採用「負責任擴散」的觀點，強調創新擴大時需回應在地條件，也要留意可能產生的負面影響。一項技術在示範場表現良好，進入不同地區後，可能受到土地權屬、性別分工、勞力需求、資金與市場等因素限制。若推廣速度過快，弱勢農戶也可能因無力投入而遭到排除。農民之間的知識分享能提早揭露這些問題。當使用者公開討論操作困難、成本負擔與環境差異，計畫團隊便有機會在擴大前調整設計。因此，社群交流既是傳播管道，也是技術接受檢驗與修正的過程。\r\n\r\n這項研究分析瓜地馬拉與宏都拉斯參與氣候智慧村計畫的小農，結果反映特定社區與計畫環境，不能直接推論所有地區都具有相同關係。研究補充了農業創新推廣中容易忽略的一環，即技術完成研發後，還需要有人願意說明、示範、回應疑問，並協助他人調整。農民通常不會只依據單一研究報告決定採用新作法。他們也會參考鄰近農戶的結果、評估風險，並確認遇到問題時是否有人可以協助。因此，推動氣候智慧農業時，除了提升技術品質，也要建立讓知識能持續流動的社群條件。信任、互助與同儕學習若能納入推廣設計，創新才較有機會適應在地需求，並逐步擴大。\r\n\r\n", "public_article_format": "text", "public_date": "2026-07-25", "published_date": "2026-07-24", "public_image_url": "https://i.ibb.co/4ZbmLqn4/Chat-GPT-Image-2026-7-25-01-11-52.png", "topic": "B_氣候韌性與農業風險管理", "country": "國際", "language": "英文", "source_org": "Phys.org 農業", "title_original": "Trust among farmers is key to scaling climate-smart innovations", "url": "https://phys.org/news/2026-07-farmers-key-scaling-climate-smart.html"}, {"id": 115, "public_title": "科羅拉多州立大學研究：土壤有機碳可提升產量，但極端乾旱下幫助有限", "public_summary": "科羅拉多州立大學研究發表於《Global Change Biology》，發現土壤有機碳對作物產量的助益在「中等水分供應」條件下最明顯，極端乾旱時效果有限，修正了「土壤有機碳在乾旱時特別有幫助」的普遍認知。", "public_article": "土壤有機碳能提高產量，但無法抵銷極端乾旱\r\n美國研究顯示，增產效益在中等水分條件下最明顯，也有助穩定年際產量\r\n\r\n增加土壤有機碳，常被視為提升農地保水與氣候韌性的做法。許多推廣論述進一步主張，土壤有機碳在乾旱年份尤其重要，能協助作物維持產量。不過，美國科羅拉多州立大學研究團隊分析玉米、大豆與春小麥資料後發現，這項效益並不會隨乾旱加劇而持續增加。研究結果顯示，土壤有機碳確實能提高整體產量，也能降低不同年份間的產量波動，但其效益在水分供應適中的條件下最為明顯。當乾旱嚴重到土壤幾乎沒有可利用水分時，即使土壤具備較高保水能力，也無法為作物提供實際幫助。\r\n\r\n\r\n【土壤有機碳能保水，但前提是土壤裡要有水】\r\n\r\n土壤有機碳可改善土壤結構，增加孔隙與保水能力，也能提高養分保持與微生物活動。這些特性有助於作物在降雨不穩定或短期缺水時，取得較穩定的水分與養分。不過，保水能力並不等於可以在沒有水的情況下產生水分。當降雨過少、土壤含水量降至極低時，土壤即使能多保留一些水，實際可供根系吸收的水量仍可能不足。\r\n\r\nNathan Mueller指出，植物要從土壤有機碳增加中獲得效益，土壤裡必須先有一定水分。當水分供應極度受限時，土壤有機碳無法突破作物的基本水分需求。這也解釋為何研究沒有觀察到「愈乾旱，土壤有機碳愈有幫助」的線性關係。\r\n\r\n【最大效益出現在中等水分條件】\r\n\r\n研究團隊發現，土壤有機碳對作物產量的正面影響，在水分條件適中時最明顯。這類年份既不是完全理想，也不是極端乾旱，土壤仍保有足夠水分，但作物可能面臨間歇性缺水或較高蒸散需求。在這種情況下，較高的土壤有機碳能延緩土壤乾燥，使根系在降雨間隔期間仍可取得水分，也能降低短期水分波動對生長的影響。相較之下，水分非常充足時，土壤保水能力帶來的額外效益較小；極端乾旱時，則因水分總量不足，土壤有機碳的保水優勢難以轉化為產量。因此，土壤有機碳的價值並不只體現在災害年份，而是更常在一般偏乾或水分供應不穩定的年份累積。\r\n\r\n【不必等到極端乾旱，增產效益就會出現】\r\n\r\nAlison King指出，農業推廣中常說土壤有機碳「特別能幫助作物度過乾旱」，但這串推論過去較少接受完整檢驗。這次研究確認，土壤有機碳在乾旱條件下仍有正面作用，但最大效益並非出現在最嚴重的乾旱，而是在接近正常或中度缺水的生長條件。換言之，土壤有機碳管理的主要價值，可能不是在最糟年份「救回全部產量」，而是在多數年份提高生產效率並減少波動。\r\n\r\n【研究涵蓋玉米、大豆與春小麥】\r\n\r\n研究團隊選擇玉米、大豆與春小麥，這三類作物在美國主要依賴自然降雨生產，栽培範圍涵蓋多種土壤與氣候條件。研究人員整合美國農業部數十年的縣級產量紀錄，再搭配每日土壤水分與大氣水分需求資料，建立模型分析不同天候下的產量敏感度，以及土壤有機碳如何改變這些反應。大氣水分需求反映空氣從土壤與植物帶走水分的能力。當溫度高、空氣乾燥或風速較強時，作物蒸散壓力會提高，即使土壤仍有水分，植株也可能更快進入缺水狀態。透過同時分析土壤水分與大氣需求，研究團隊得以區分「土壤裡有多少水」與「作物失水速度有多快」兩種影響。\r\n\r\n【土壤有機碳也能降低年際產量波動】\r\n\r\n除了提高平均產量，研究也發現，土壤有機碳較高的地區，作物產量在不同年份之間相對穩定。\r\n\r\n農業生產面臨的風險不只來自平均產量偏低，也包括年度差異過大。即使多年平均產量相近，若某些年份大幅減產，仍會影響現金流、契作履約與農場經營安全。土壤有機碳提高保水與保肥能力後，可在降雨時間不均、短期乾旱或高蒸散條件下，提供一定緩衝。這些作用未必能防止極端災害，但有助於減少一般年份中的生長波動。研究團隊指出，這是首度在美國全國尺度量化土壤有機碳對作物產量韌性的潛在貢獻。\r\n\r\n\r\n【土壤有機碳的效益需要長期累積】\r\n\r\n提高土壤有機碳通常需要持續投入，包括作物殘體還田、覆蓋作物、減少土壤擾動、施用有機資材及增加根系生物量等。實際累積速度會受到氣候、土壤質地、耕作制度與有機質分解影響。這些措施的效益也不只表現在產量。土壤有機碳增加後，可能同時改善團粒結構、入滲、保肥力與微生物活動，並降低沖蝕風險。不過，不同田區的起始條件與管理成本差異很大。某些土壤較容易累積有機碳，另一些高溫、排水良好或長期密集耕作的田區，則可能需要更長時間才能觀察變化。\r\n\r\n對農民而言，較適合的評估方式不是期待短期內抵銷一次極端乾旱，而是觀察多年產量穩定性、土壤水分變化與投入效益是否逐步改善。\r\n\r\n", "public_article_format": "text", "public_date": "2026-07-25", "published_date": "2026-07-23", "public_image_url": "https://i.ibb.co/ZtXGn1M/Chat-GPT-Image-2026-7-25-01-56-38.png", "topic": "B_氣候韌性與農業風險管理", "country": "國際", "language": "英文", "source_org": "Phys.org 農業", "title_original": "Soil organic carbon increases crop yield but can't help with extreme drought", "url": "https://phys.org/news/2026-07-soil-carbon-crop-yield-extreme.html"}, {"id": 117, "public_title": "韓國全南大學開發AI系統，大幅提升果園地圖測繪與建模精準度", "public_summary": "韓國全南大學團隊針對商業果園規模大、樹木密集、結構複雜的挑戰，結合無人機空拍與地面機器人光達技術，開發新AI系統，改善精準農業所需的果園3D建模與地圖測繪精準度。", "public_article": "空拍與地面機器人如何共同建立果園數位模型\r\nAI整合無人機影像與LiDAR資料，降低林冠遮蔽及長距離定位誤差\r\n\r\n精準農業要進一步導入果實產量估算、局部噴藥、樹體表型調查與自動採收，首先需要一張能準確反映果園空間與樹體結構的數位地圖。問題在於，商業果園面積大、果樹排列密集，枝葉也會遮蔽樹幹及地面，使單一感測方式很難同時掌握全區位置與樹體細節。\r\n\r\n韓國全南大學研究團隊開發一套跨感測資料融合系統，將低空無人機拍攝的遙測影像，與地面機器人蒐集的光達及慣性量測資料整合。無人機先提供果園的整體地理位置，地面機器人再補充林冠下方與單株樹體的立體結構，人工智慧則負責辨認兩類資料中的相同樹列、林冠形狀與開放空間，將細部量測準確放回整座果園地圖。研究以蘋果園進行測試，地面機器人行駛約1.3公里後，定位誤差仍能控制在數公分尺度，並較傳統方法有效抑制長距離移動所累積的偏移。\r\n\r\n【空拍掌握全區位置，卻看不到林冠下方】\r\n\r\n無人機搭配全球導航衛星系統，可以快速拍攝大面積果園，並將多張影像拼接成具有地理座標的正射影像。從空中可辨識果園邊界、樹列配置與林冠覆蓋，也適合建立全區基礎地圖。不過，果樹枝葉密集時，空拍影像主要記錄林冠上方，樹幹、枝條、地面及樹列間通道容易受到遮蔽。若要量測樹高、冠層結構，或引導機器人在樹列間行駛，僅靠空中影像仍然不足。季節也會改變影像外觀。開花、著果、枝葉繁茂與落葉後的果園，在色彩與紋理上差異很大，使依賴外觀特徵的定位方法容易失準。\r\n\r\n【地面光達能看見樹體細節，長距離移動卻會逐漸偏移】\r\n\r\n搭載光達與慣性量測單元的地面機器人，可在行進過程中發射雷射並量測回波，建立樹幹、枝葉、地面及通道的三維點雲。相較於空拍影像，這類資料更適合呈現單株果樹結構與林冠下方環境。機器人通常會依據連續量測結果推估自身位置，稱為光達—慣性里程計。短距離內可保持相當高的精度，但每一次推算都可能產生些微誤差，行駛距離愈長，偏移便會逐步累積。果園林冠也會削弱衛星訊號，使地面機器人無法持續依賴全球導航衛星系統修正位置。當樹列外觀高度重複時，機器人還可能把相似位置互相混淆，導致整體地圖扭曲或錯位。\r\n\r\n【AI辨認不同感測資料中的相同結構】\r\n\r\n研究團隊的做法，是讓無人機地圖成為地理位置基準，再利用深度學習尋找空拍影像與地面光達資料之間的對應關係。團隊先由無人機依規劃航線拍攝蘋果園，製作高解析度正射影像，並將影像切分為不同區塊。地面機器人則在相同區域行駛，蒐集光達點雲與慣性資料。\r\n\r\n三維點雲接著轉換成由上往下觀看的二維鳥瞰圖，保留林冠高度、表面反射及局部結構密度等資訊。雖然空拍影像與光達鳥瞰圖的外觀不同，兩者仍會呈現相同的樹列方向、林冠分布及通道位置。AI模型透過雙分支架構，分別提取空拍影像與光達鳥瞰圖的特徵，再以跨注意力機制比較兩類資料，找出同一區域中的對應結構。後續再進行多尺度位置修正，逐步縮小兩張圖之間的偏差。\r\n\r\n找到對應位置後，系統會利用空拍地圖修正地面機器人的移動軌跡，再將校正結果納入位姿圖估計。這項方法不是只修正單一時間點，而是同時考量機器人移動前後的位置關係，使整段路徑保持一致。完成融合後，果園數位模型可同時包含兩種資訊：一是由無人機提供的全區地理位置與林冠分布，二是由地面光達取得的樹體高度、結構密度及樹列細節。\r\n\r\n這種分工能補足兩類感測方法的限制。空拍影像缺乏林冠下方資訊，但位置範圍完整；地面機器人能取得高解析度三維資料，卻容易在長距離移動後發生漂移。將兩者結合後，細部資料便能準確放回整體果園空間。\r\n\r\n【季節變化下仍能維持定位穩定】\r\n\r\n果園影像會隨季節改變，傳統影像配對方法若過度依賴顏色與紋理，容易因葉量、光線及地表狀態不同而失效。研究團隊的模型較重視樹列配置、林冠輪廓與空間結構，因此面對季節差異時仍能維持配對能力。測試結果顯示，系統在約1.3公里的行駛範圍內，定位精度可達數公分尺度，長距離偏移也明顯低於傳統方法。\r\n\r\n不過，研究結果來自特定蘋果園。不同果樹種類、整枝方式、坡度、樹列間距與林冠密度，都可能影響模型判讀。若果園缺乏規則樹列，或枝葉嚴重交錯，仍需進一步驗證。\r\n\r\n【數位果園模型可支援哪些作業】\r\n\r\n準確的果園地圖並非單純用於視覺呈現，而是農業機器人執行工作的空間基礎。機器人需要知道樹列、通道與障礙物的位置，才能規劃巡檢、割草、運輸、噴藥與採收路徑。若定位持續漂移，設備可能重複作業、遺漏區域，甚至接近樹幹或撞擊設施。融合後的數位模型也可用來量測樹高、冠層體積及結構差異，再搭配影像或其他感測資料，分析樹勢與健康狀態。若能持續更新，便可比較不同季節與年度的變化，作為修剪、施肥、病害監測與產量估算的參考。\r\n\r\n研究團隊將這種持續更新的架構稱為果園的「動態數位模型」。它不只是一次性的測繪成果，而是隨著植株生長、季節變化與田間作業持續修正的資料基礎。\r\n\r\n這套系統已考量在嵌入式設備上運行，意味未來可能直接部署於農業機器人，而不必將所有資料送回高效能電腦處理。若能即時修正定位，機器人便能在行進中持續對照全區地圖。不過，實際導入仍涉及無人機測繪、光達設備、資料處理與模型維護成本。果園也需要建立可重複使用的基礎地圖，並在植株與地形明顯改變後重新更新。\r\n\r\n此外，數公分定位精度不代表機器人已能自動完成所有農務。噴藥還需辨識目標位置與風場，採收需要判斷果實成熟度及遮蔽，運輸則要處理人員、機具與臨時障礙。地圖提供的是共同空間基礎，後續仍需結合不同作業模組。\r\n", "public_article_format": "text", "public_date": "2026-07-25", "published_date": "2026-07-22", "public_image_url": "https://i.ibb.co/6cNFrrhw/Chat-GPT-Image-2026-7-25-02-10-14.png", "topic": "A_智慧農業與資料治理", "country": "國際", "language": "英文", "source_org": "Phys.org 農業", "title_original": "Researchers develop new AI system for highly accurate mapping and modeling of orchards", "url": "https://phys.org/news/2026-07-ai-highly-accurate-orchards.html"}, {"id": 122, "public_title": "英國基因編輯新創Phytoform攜手主要種子公司，以AI設計玉米株型", "public_summary": "英國基因編輯新創Phytoform與美國Beck's Hybrids、國際育種公司RAGT合作，運用AI平台CRE.AI.TIVE改善玉米整體株型結構以提升產量。研究顯示全球均溫每升高1°C，玉米產量約減少7.4%。", "public_article": "AI結合基因編輯，調整玉米整株架構\r\nPhytoform與兩家種子公司合作，從既有優良種原中微調基因表現\r\n\r\n玉米產量不只取決於單一性狀，也受到株高、葉片角度、穗位、根系、莖稈強度與養分分配等整株架構影響。當氣候升溫、病害壓力增加，生產成本也持續上升，如何讓植株更有效利用光照、氮肥與生長空間，已成為育種的重要課題。英國基因編輯新創公司Phytoform近期與美國家族型種子公司Beck’s Hybrids及國際育種公司RAGT合作，運用AI與基因編輯技術改善玉米整株架構。合作內容尚未公開具體性狀，但目標是調整植株在結構層面的生長方式，提高可收穫產量與生產效率。\r\n\r\n這項合作並非另行建立全新品種，而是從種子公司既有的優良種原出發，找出可微調的DNA序列，再將編輯材料導回原有育種體系。AI負責縮小候選範圍，真正的效果仍需透過生物試驗與田間驗證確認。\r\n\r\n【整株架構會影響作物如何利用環境資源】\r\n\r\n玉米植株的外觀與結構，會直接影響田間生產表現。葉片角度決定不同株層能取得多少光線，穗位與株高影響倒伏及機械收穫，根系與莖稈則關係到水分、養分吸收與植株支撐能力。當種植密度提高時，植株彼此競爭光照、水分與氮素。若葉片過度水平展開，上層可能截留大部分光線，使下層葉片利用效率下降；若株型更緊湊，則可能提高單位面積的種植密度與冠層受光效率。\r\n氣候逆境也會放大架構差異。高溫與乾旱可能改變生長速度、授粉及籽粒充實，強風與暴雨則增加倒伏風險。整株架構育種的目的，是讓不同器官之間形成較合適的配置，而不是只追求單一部位變大或生長更快。\r\n\r\n【Phytoform利用AI尋找可微調的DNA序列】\r\n\r\nPhytoform開發的CRE.AI.TIVE平台，以機器學習分析植物DNA序列，尋找少量改變後可能產生有利性狀的位置。這種方法不是把外來基因導入植物，也不以完全刪除基因為主要方向，而是調整植物原有基因的活性。公司會設計短小的DNA序列變化，使目標基因的表現時間、位置或強度更符合育種需求。以玉米整株架構為例，平台可能先找出與葉片角度、莖稈生長、穗位或養分分配相關的基因，再分析哪些調控序列適合微調。這些候選位置進入基因編輯與植株試驗後，才能確認是否真的改變架構，以及是否伴隨其他生育影響。\r\n\r\nAI的功能主要是協助排序與預測，減少需要逐一測試的候選序列數量。它不能直接跳過育種與田間試驗。\r\n\r\n【技術用來加速育種，不取代育種公司】\r\n\r\n這項合作結合三方不同能力。Phytoform提供AI與基因編輯平台，Beck’s與RAGT則提供玉米育種經驗、專有種原、商業市場資訊及部分開發資源。兩家種子公司原本就擁有育種材料與品系，也熟悉不同區域的生產需求。Phytoform的角色，是協助針對特定問題設計DNA微調方案，再由育種公司將驗證後的材料導入既有品種。\r\n\r\n\r\n【AI預測必須回到真實植株驗證】\r\n\r\nPhytoform共同創辦人William Pelton指出，農業領域經常把AI描述成可以快速找到答案的工具，但目前仍無法把模型輸出直接移到田間，便期待第一次就成功。DNA序列的作用會受到遺傳背景影響。同一項編輯放入不同玉米品系後，可能出現不同程度的表現，甚至產生未預期的生長變化。溫室中的株型改善，也不代表在高溫、密植、缺氮或病害壓力下仍能維持優勢。\r\n\r\n合作計畫因此會把重點放在真實材料驗證。候選編輯完成後，需要觀察植株架構、產量構成、倒伏、成熟期與環境適應性，再判斷是否適合導入商業育種。驗證完成後，Phytoform會把編輯材料交給Beck’s與RAGT，讓兩家公司放入各自的育種種原中，進一步測試與推向市場。\r\n\r\n【從既有優良種原微調，可降低育種轉換成本】\r\n\r\n傳統導入新性狀時，育種人員常需將目標基因從供體材料轉入商業品系，再經過多代回交，盡量保留原有優良特性。若供體材料與商業品系差異較大，過程可能耗時多年。Phytoform的做法是直接在既有優良種原中調整原生基因表現，理論上可減少重新整合大段外來遺傳材料的需求。\r\n\r\n這對種子公司具有實際吸引力。已在市場上表現良好的品種，通常累積了產量、成熟期、品質與區域適應性等多項優勢。若能只修改少數DNA序列，加入所需架構性狀，便可能保留大部分原有特徵。不過，所謂「小幅修改」不代表影響一定很小。植物基因彼此連動，任何性狀都可能涉及多重生理途徑，仍需完整檢查農藝與品質表現。\r\n\r\n\r\n【合作將優先面向主要玉米市場】\r\n\r\n這項合作預計先鎖定美國、南美洲，並可能延伸至歐洲。Beck’s主要服務美國中西部玉米帶，RAGT則在約50個國家經營育種與種子業務。不同市場對玉米架構的需求並不相同。美國大面積機械化生產重視密植、倒伏、成熟一致性與機收效率；南美洲部分地區則需面對高溫、病害與不同播種季節；歐洲市場又有不同氣候、法規與品種需求。同一項編輯性狀是否能跨區使用，需視環境與種原背景而定。合作方可能需要在不同育種材料中重新驗證，才能確認其適用範圍。\r\n\r\nPhytoform將CRE.AI.TIVE定位為不受特定作物限制的平台。公司除玉米外，也曾投入番茄性狀開發，並與Corteva合作研究玉米病害抗性。從技術原理來看，只要具備基因體資料與可操作的編輯系統，平台便可能延伸至其他作物。然而，不同植物的基因調控、再生難度與育種週期差異很大。\r\n\r\n玉米、番茄與多年生果樹，即使使用相同的AI分析概念，實際驗證速度與商業化路徑仍會不同。部分作物容易完成組織培養與再生，另一些作物則可能在基因編輯後花費多年才能進入產量評估。因此，「跨作物」較準確的意義，是分析方法具有延伸可能，而不是同一套候選序列可以直接套用到所有植物。\r\n\r\n", "public_article_format": "text", "public_date": "2026-07-25", "published_date": "2026-07-20", "public_image_url": "https://i.ibb.co/27WvjDFP/Chat-GPT-Image-2026-7-25-02-24-30.png", "topic": "A_智慧農業與資料治理", "country": "國際", "language": "英文", "source_org": "AgFunder News", "title_original": "Phytoform partners with major seed breeders to bring AI-powered plant design to corn crops", "url": "https://agfundernews.com/phytoform-partners-with-major-seed-breeders-to-bring-ai-powered-plant-design-to-corn-crops"}, {"id": 127, "public_title": "番茄見好就收，茄子撐到底：日本農家夏季蔬菜的抗暑管理術", "public_summary": "農家專欄作者分享番茄與茄子因應日本酷暑的不同管理策略：番茄原生南美高地、不耐高溫多濕，30°C以上易授粉不良，以遮光網與有機覆蓋降溫為主；茄子原生印度熱帶、較耐濕熱，靠充分灌溉與覆蓋維持生長。", "public_article": "遮陰、覆蓋、灌溉與分批更新，協助夏季蔬菜度過高溫與乾旱\r\n\r\n（本文翻譯自日本網頁，作物皆為日本產期）\r\n\r\n盛夏氣溫快速升高，戶外農作時間也隨之縮短。清晨日出前後較適合巡田、採收與澆水，上午8時以後，日照與熱負荷明顯增加，長時間作業容易造成身體負擔。夏季管理除了照顧作物，也要先調整工作時段，避免在高溫時段作業。\r\n\r\n7月是番茄、茄子、小黃瓜等夏季蔬菜的採收高峰，秋葵與埃及國王菜（相似麻芛）則逐漸進入旺盛生長期。不過，不同作物對高溫與乾旱的反應差異很大。有些作物需要遮陰、覆蓋與補水，有些適合提早結束採收，另行安排下一批作物。夏季管理的重點，在於判斷作物是否還具有恢復與持續生產的能力，再決定維持、更新或轉作。\r\n\r\n【番茄以遮陰與有機覆蓋降低高溫傷害】\r\n\r\n番茄原生於南美洲安地斯山區，適合生長的溫度約為15至25°C。當氣溫長時間超過30°C，花粉活性下降，容易出現授粉不良與著果率降低。此時即使植株已經結果，後續果實發育仍有賴葉片與根系維持正常功能。\r\n\r\n露天番茄可利用遮光網減弱強光，株基部則鋪設稻草、稻殼或割草，降低地溫並減少土壤水分散失。若設置避雨設施，宜保留側面通風，避免熱氣累積；遮光網可鋪設於棚頂外側，兼顧避雨與降溫。\r\n\r\n乾旱期間也要留意水分供應。土壤過乾時，根系吸收養分的能力下降，果實容易因鈣吸收不足出現尻腐病。這類生理障礙常見於高溫季節，管理上不能只補充肥料，也要維持穩定土壤水分。\r\n\r\n若遮陰、覆蓋與灌溉後，植株仍因高溫持續衰弱，便可評估提前結束栽培。與其勉強延長採收，不如整理田區，準備下一期作物。希望延長番茄收穫期時，也可依春季氣溫提早定植，使主要採收期避開8月最炎熱時段。\r\n\r\n【茄子耐熱性較高，但水分不足會快速衰弱】\r\n\r\n茄子的原生地位於印度東部熱帶地區，對高溫與濕潤環境的適應能力高於番茄。不過，近年夏季高溫仍可能使茄子開花與著果受阻。茄子需水量較高，生產者常以「茄子靠水長大」形容其生育特性，水分與肥力不足都會影響果實生長。\r\n\r\n株基部鋪設厚層稻草或割草，可降低地溫、維持土壤濕度，也有抑制雜草的作用。連續數日未降雨時，澆水不宜只濕潤表土，每株可視土壤與植株大小補充約2至5公升水，使水分進入根系主要分布區。部分因乾旱而衰弱的植株，在充分灌溉後仍能恢復生長。\r\n\r\n茄子生長期間也容易因側芽增加而使枝葉過密。修剪時不必拘泥單一整枝形式，可優先移除交錯、重疊與阻礙通風的枝條，讓樹冠內部保持適度採光與空氣流動。\r\n\r\n只要植株根系與主要枝條仍健康，即使盛夏一度停止著果，入秋後仍可能重新開花結果。另一種做法是在6月下旬至7月下旬另行定植一批茄苗，讓較年輕的植株承接秋季生產，避免長期維持已衰弱的老株。\r\n\r\n【小黃瓜與南瓜類適合分批更新】\r\n\r\n小黃瓜、櫛瓜與南瓜等瓜類作物多屬短期集中生產。植株連續結果約一個月後，容易因養分消耗、枝葉老化與病害累積而衰弱，白粉病等問題也會增加。\r\n\r\n小黃瓜若管理良好，採收期可能延續2至3個月，但若7月下旬前仍能播種，通常另行建立新株，比勉強延長老株壽命更容易維持果實品質。早春定植的植株進入7月後逐漸衰弱，新一批植株則可承接秋季採收。\r\n\r\n南瓜若在7月下旬前完成定植，約可於10月前後採收。這類延後栽培的南瓜耐貯藏，常成為秋冬市場供應來源。透過分批播種與定植，可以把夏季採收延伸至秋季，也能降低單一批次遭受高溫、病害或颱風影響的風險。\r\n\r\n【秋葵與埃及國王菜在高溫下生長旺盛】\r\n\r\n相較於番茄、茄子與小黃瓜，秋葵和埃及國王菜較能適應高溫。兩者均源自非洲地區，氣溫超過30°C後，通常會加速生長。\r\n\r\n秋葵開花後約4至5日即可採收。若栽培株數較多，盛產期幾乎需要每日採收。果莢採下後，可剪除其下方老葉，減少枝葉擁擠並改善通風。管理良好時，植株高度可能接近2公尺，採收期可延續至10月前後。\r\n\r\n埃及國王菜則以摘取枝梢的方式採收。摘心後，側芽會持續萌發，進一步增加收量。夏季管理以採收與水分補充為主；若葉片縮小或捲曲，通常代表土壤水分不足。秋葵若出現彎曲果或表面瘤狀突起，也可能與水分或肥力不足有關。\r\n\r\n【耐旱與需水作物應分開管理】\r\n\r\n玉米、毛豆與西瓜進入盛夏後，多數已接近採收尾聲，管理工作相對減少。甘藷耐高溫與乾旱，夏季通常能維持旺盛生長，短期內不需頻繁澆水。\r\n\r\n里芋與薑則相反。兩者對乾旱較敏感，土壤缺水會直接影響根莖膨大與最終產量。管理上應鋪設稻草或割草，並在降雨不足時持續灌溉。\r\n\r\n即使都屬於夏季作物，水分需求仍有明顯差異。若以同一套灌溉方式管理整片菜園，容易造成耐旱作物過濕，需水作物又得不到足夠水分。因此，夏季灌溉宜依作物種類、土壤質地與植株生育階段分區調整。\r\n\r\n【有機覆蓋是多數夏季作物的基礎措施】\r\n\r\n高溫期間，多數蔬菜都能從有機覆蓋中受益。稻草、稻殼與割草能遮蔽土壤表面，降低地溫與蒸發，也能讓雨水與灌溉水逐步滲入土壤。相較於塑膠布，有機覆蓋的透氣與透水性較佳，夏季較不容易造成土壤熱量累積。\r\n\r\n覆蓋材料應鋪設足夠厚度，過薄時容易迅速乾燥或遭風吹散。使用割草時，也要避免混入已結籽的雜草，減少後續雜草問題。\r\n\r\n有機覆蓋不能完全取代灌溉，但能延長土壤保水時間，使澆水效果維持更久。當植株剛出現高溫與乾旱壓力時，覆蓋配合充分補水，通常比單純增加施肥更有效。\r\n\r\n【夏季管理也要同步準備秋作】\r\n\r\n夏季蔬菜進入衰退期後，是否繼續投入管理，需要衡量植株健康、後續著果能力與工作成本。若植株已嚴重老化、病害增加或高溫下難以恢復，及早清園可避免持續占用土地與勞力。\r\n\r\n8月起可陸續準備甘藍、青花菜等秋季蔬菜育苗。此時白天氣溫仍高，育苗場所需要遮陰、通風與穩定水分，也要避免幼苗徒長或遭受高溫傷害。\r\n\r\n夏季菜園管理的目標，並非讓每一株蔬菜無限延長採收期，而是讓作物在適合的季節發揮生產力，再透過分批栽培與更新維持供應。當高溫超過作物承受範圍，適時結束、更新或轉換作物，往往比持續搶救更符合生產效益。\r\n\r\n最後仍要回到人員安全。清晨完成採收、澆水與必要管理，中午前減少戶外作業，並補充水分與休息。作物可以重新播種，農務工作也能調整時程，高溫下不應以延長工作時間換取有限的管理效果。\r\n", "public_article_format": "text", "public_date": "2026-07-25", "published_date": "2026-07-24", "public_image_url": "https://i.ibb.co/VYqtZv3g/Chat-GPT-Image-2026-7-25-01-21-37.png", "topic": "C_IPM植物健康與農藥減量", "country": "日本", "language": "日文", "source_org": "マイナビ農業", "title_original": "トマトは見切り、ナスは粘る。猛暑を乗り切る夏野菜の管理術【DIY的半農生活Vol.54】", "url": "https://agri.mynavi.jp/2026_07_25_552413/"}, {"id": 129, "public_title": "愛知製鋼推出提升鐵營養吸收的生物刺激素產品，因應氣候變遷嚴苛環境", "public_summary": "愛知製鋼推出「鐵力あぐり」「鐵力あくあ」等生物刺激素產品，宣稱可提升作物對鐵營養的吸收效率，作為因應氣候變遷下嚴苛栽培環境的對策（本文擷取不完整，僅能依標題與局部內容整理，細節待回查原文）。", "public_article": "從特殊鋼到田間管理：鋼鐵業如何跨入植物鐵營養研究\r\n土壤裡有鐵，不代表作物吸得到；環境逆境也會改變根系取得鐵的能力\r\n\r\n鋼鐵業與農業看似距離很遠，兩者卻因「鐵」產生交集。日本愛知製鋼原本從事特殊鋼與熱處理技術研究，約在2000年前後，研發人員將特殊製程產生的二價鐵材料施入土壤，意外觀察到植物生長改善。這項發現促使公司進一步研究不同形態的鐵如何影響植物吸收，並逐步跨入農業資材與植物營養領域。\r\n\r\n這個案例有趣之處，不只在於鋼鐵企業跨界投入農業，也重新說明了鐵與田間管理的關係。土壤通常不缺鐵，但鐵的化學形態、土壤酸鹼值、根系活性及溫度、日照等環境條件，都會影響植物能否使用。缺鐵不一定代表施肥量不足，也可能是根部在逆境下失去正常吸收能力。\r\n\r\n【農業應用來自一項原本缺乏用途的鋼鐵材料】\r\n\r\n愛知製鋼是豐田集團旗下的特殊鋼製造商。公司研究特殊熱處理技術時，產生了一種以氧化亞鐵為主的材料。這項材料起初未被視為具有明確的產業用途，但研發人員嘗試施入土壤後，發現部分植物的生長狀況有所改善。後續研究方向也由材料本身，逐漸轉向植物如何取得鐵。公司於2003年開始將相關材料商品化，2007年進一步投入農業領域，並發展固體與液體型的鐵資材。\r\n\r\n這段歷程反映跨領域創新的常見路徑。鋼鐵業原有的材料製程與氧化還原知識，轉換到農業後，研究問題不再是如何製造鋼材，而是不同鐵形態進入土壤後，能否提高植物的利用效率。\r\n\r\n【土壤含鐵豐富，植物仍可能缺鐵】\r\n\r\n鐵是植物生長所需的微量元素，參與葉綠素形成、光合作用、呼吸與多種酵素反應。需求量雖然不如氮、磷、鉀，但供應不足時，仍會影響葉片生長與能量代謝。多數旱地土壤中並不缺乏鐵，問題在於鐵經氧化後，多以較難溶解的三價鐵存在。多數非禾本科作物需要利用根部的鐵還原酵素，先將三價鐵還原為二價鐵，才能經由根系吸收。\r\n\r\n因此，土壤檢測顯示總鐵含量充足，不代表作物一定不會缺鐵。當土壤pH值偏高、根系活性下降或水分與通氣狀況不佳時，鐵可能留在土壤中，卻無法有效進入植株。愛知製鋼的相關研究即以這個問題為基礎：一方面提供植物較容易吸收的二價鐵或有機酸鐵錯合物，另一方面觀察這些材料是否能協助根部維持鐵還原與吸收功能。\r\n\r\n【低溫、低日照與著果負擔，都可能降低鐵吸收】\r\n\r\n公司投入農業市場後，曾從各地生產者回饋中發現，相關鐵資材在梅雨、低溫及日照不足期間，較容易觀察到生育差異。這些現象使研究團隊開始把鐵營養與環境逆境連結起來。後續分析指出，低溫與低日照可能降低根部鐵還原酵素活性。此時即使土壤有鐵，植物也未必能順利轉換及吸收，形成由環境壓力引起的鐵營養不足。\r\n\r\n果菜類大量開花結果時，也可能面臨相似問題。著果後，果實成為主要養分需求端，植株需要維持較高的光合作用與代謝能力。若根系吸收跟不上需求，葉片外觀可能仍維持綠色，植株內部卻已出現「潛在性缺鐵」，進而表現為生長趨緩、著果疲乏或產量下降。這也說明鐵管理不能只在葉片黃化後才開始。作物生育階段、根系狀況與環境條件，同樣是判斷鐵營養的重要依據。\r\n\r\n【鐵資材的效果仍要回到田間條件判斷】\r\n\r\n鐵進入土壤後，會受到酸鹼值、水分、氧化還原狀態、有機質及其他元素影響。不同土壤與栽培方式下，同一種鐵材料的效果可能差異很大。酸性土壤中的鐵通常較容易溶解，但濃度過高也可能產生毒害；石灰質或鹼性土壤則容易讓鐵形成難溶化合物，造成植株缺鐵。土壤長期積水時，鐵的還原狀態也會改變，排水恢復後又可能重新氧化。\r\n\r\n根系健康同樣重要。若土壤壓實、缺氧、鹽分過高，或根部已受病害影響，即使補充可利用的鐵，植株仍可能無法正常吸收。因此，鐵資材不能脫離灌溉、排水、土壤pH值、根圈環境與肥培管理單獨判斷。\r\n\r\n田間若出現新葉黃化、生長停滯或著果後快速衰弱，也不能直接認定是缺鐵。氮、鎂、錳等元素不足、根系受損、病害與積水，都可能出現類似症狀。較適合的做法，是搭配土壤與植體分析，確認缺鐵原因，再決定是否調整鐵源或其他栽培條件。\r\n\r\n【高溫下的缺鐵，成為新的研究方向】\r\n\r\n鐵吸收問題過去多與低溫、低日照或鹼性土壤連結，近年則開始關注高溫造成的鐵營養失衡。部分作物在高溫下會出現葉片白化，顯示鐵的吸收、運輸或植體內部調控可能受到影響。\r\n\r\n愛知製鋼與日本理化學研究所合作，研究禾本科植物用來取得鐵的「麥根酸」及其在高溫環境下的生理作用。相較於多數雙子葉植物先將三價鐵還原為二價鐵，水稻、小麥等禾本科植物會由根部分泌麥根酸類物質，與土壤中的三價鐵結合，再將鐵錯合物吸收進入根部。這套機制顯示，不同作物對鐵的取得方式並不相同。番茄與水稻即使同樣出現缺鐵症狀，背後涉及的根系反應與適用管理方式也可能不同。\r\n\r\n高溫如何改變麥根酸分泌、鐵運輸及葉片白化，目前仍是研究中的問題。這類研究若能進一步連結田間溫度、根圈環境與產量表現，將有助於釐清高溫年份的鐵管理需求。\r\n\r\n【鋼鐵業帶入的是材料能力，也需要農業驗證】\r\n\r\n跨領域企業投入農業，通常能帶入原有產業累積的技術。愛知製鋼具備鐵材料、熱處理與化學形態控制經驗，因此能從材料端設計不同的鐵源，並分析其溶解、錯合與氧化還原特性。不過，農業應用不能只靠材料性能判斷。作物反應受到品種、氣候、土壤、施肥、灌溉與生育階段共同影響，實驗室中較容易吸收的鐵源，進入不同田區後未必會產生一致結果。\r\n\r\n因此，這類跨界技術能否成立，仍要經過農業試驗場所、研究機構與生產現場的反覆驗證。除了觀察葉色與生長，也應比較產量、品質、施用成本及既有管理方式，才能確認其實際價值。\r\n\r\n此案例帶出的核心觀念，是植物鐵營養不能只用「土裡有多少鐵」來判斷。鐵的化學形態、根系酵素活性、作物種類與環境逆境，共同決定植物最後能取得多少鐵。因此，鐵管理可以分成幾個層次：土壤是否含有足夠鐵、鐵是否處於可利用形態、根系是否有能力吸收，以及植株在特定生育階段的需求是否突然增加。\r\n\r\n愛知製鋼從特殊鋼材料跨入農業，讓原本屬於材料科學的二價鐵、氧化還原與錯合反應，轉化成植物營養與田間管理問題。這項跨界嘗試最值得觀察的，不是單一產品能否解決所有逆境，而是材料技術如何與土壤、根系及作物生理知識結合，進一步補充氣候變遷下的養分管理工具。\r\n", "public_article_format": "text", "public_date": "2026-07-25", "published_date": "2026-07-23", "public_image_url": "https://i.ibb.co/mrhk6vGt/Chat-GPT-Image-2026-7-25-02-05-05.png", "topic": "C_IPM植物健康與農藥減量", "country": "日本", "language": "日文", "source_org": "JAcom 農業協同組合新聞", "title_original": "鉄栄養の吸収機能を高める「鉄力あぐり」「鉄力あくあ」 気候変動下の過酷な環境に挑む愛知製鋼【バイオスティミュラントの最前線】 バイオスティミュラントの最前線", "url": "https://www.jacom.or.jp/articles/0wx47yBqXpxVvbNV5sn_6"}, {"id": 136, "public_title": "因應水稻高溫障礙的7種對策：從品種、作期、水分與施肥降低白未熟粒與胴裂米", "public_summary": "文章說明水稻抽穗後20天登熟期是高溫障礙關鍵期，日均溫超過27°C易產生白未熟粒；近30年猛暑日天數較過去增加約3.9倍。提出7項對策，包括改種耐熱品種（新之助一等米比率達95.3%對比越光僅4.9%）、調整插秧期錯開高溫期等。", "public_article": "降低稻米高溫障礙風險\r\n掌握抽穗後20天，從品種、作期、水分與施肥降低白未熟粒與胴裂米\r\n\r\n（原文翻譯自日文網站，文中作物產期、溫度等描述為日本脈絡）\r\n\r\n夏季高溫會影響稻米充實，使外觀品質與收量下降。其中最需要注意的是抽穗後約20天的登熟期。稻穀在這段時間累積澱粉，對日夜溫度、水分與植株營養狀態特別敏感，也是高溫障礙管理的關鍵階段。\r\n\r\n當日間最高溫達32°C以上、夜間最低溫達23至24°C以上時，高溫風險明顯提高；抽穗後20天的日平均溫度若超過27°C，也較容易形成白未熟粒。夜溫偏高時，水稻呼吸消耗增加，白天製造的養分難以充分轉移至稻穀，因此高溫管理不能只看白天，也要留意夜間溫度。\r\n\r\n近年日本猛暑日明顯增加，原本可穩定栽培的品種也更常面臨品質下降。高溫管理已從特殊年份的應變措施，逐漸成為稻作生產的固定課題。\r\n\r\n【高溫障礙主要造成白未熟粒與胴裂米】\r\n\r\n白未熟粒是高溫年最常見的品質問題。登熟期間若溫度過高，澱粉無法緊密累積，米粒內部產生空隙，光線經過時便呈現白濁。白未熟粒增加後，稻米外觀品質與等級可能下降，也會直接影響售價。\r\n\r\n胴裂米則是米粒內部出現裂紋。外觀看起來可能仍然完整，但精米或加工時容易破碎。抽穗後10天內若持續出現32°C以上高溫，胴裂風險會提高；收穫前太早排乾田水，也可能使稻株與土壤快速乾燥，增加米粒裂開的機率。\r\n\r\n這兩類問題都與登熟期管理有關。高溫無法完全避免，但品種、作期、水分、施肥與收穫前管理，會影響稻株能否維持正常充實。\r\n\r\n【優先評估高溫耐受品種】\r\n\r\n改用品質較能承受高溫的品種，是降低高溫障礙的直接方法。日本新潟縣2023年資料顯示，高溫年份中，「越光米」一等米比例為4.9%，高溫耐受品種「新之助」則達95.3%，顯示品種間的差異可能相當明顯。\r\n\r\n日本各地推廣的高溫耐受品種不同。東日本常見「つや姫」、「新之助」、「サキホコレ」及「にじのきらめき」；西日本則有「にこまる」、「きぬむすめ」與「つやきらり」等。品種轉換也不宜一次涵蓋所有田區。較穩妥的做法，是先選擇少數田區試種，比較產量、品質、成熟期、病害與市場接受度，再決定是否擴大。\r\n\r\n【調整作期，避開最熱的登熟階段】\r\n\r\n移動插秧期可以調整抽穗與登熟時間，減少抽穗後20天與高溫高峰重疊。例如延後插秧，可能使登熟期避開8月最炎熱時段。不過，作期往後移也可能遇到秋季低溫、日照減少、颱風或收穫期降雨。不同地區、品種與灌溉條件適合的作期不一，不能只依單一日期調整。實務上可參考當地農業試驗改良單位、氣象資料與歷年抽穗紀錄，評估高溫風險和晚熟風險，再決定插秧與抽穗配置。\r\n\r\n【水分管理是登熟期的核心措施】\r\n\r\n水田中的水能降低土溫，也能緩和稻株周圍的高溫。常見方法包括流動灌溉、較深水位管理及夜間灌溉。流動灌溉持續導入較低溫的新水，有助於降低田間水溫；深水管理則提高水層厚度，日本實務常以約6至8公分作為參考。夜間灌溉利用較涼的時段補水，可抑制夜間高溫，減少稻株呼吸消耗，讓白天累積的養分較能保留下來。這些方法的成效受到水源、水溫、灌排條件與田區位置限制。水量不足、上下游輪灌或田區分散時，不一定能長時間流動灌溉。每日調整水位也會增加巡田負擔，因此仍需依供水條件選擇可執行的方式。\r\n\r\n【避免登熟後期肥力過早下降】\r\n\r\n高溫期間若葉色快速轉淡、氮素供應不足，稻株維持光合作用與籽粒充實的能力會下降，白未熟粒與胴裂米也可能增加。可利用葉色板或SPAD計判斷植株營養狀態。以日本新潟縣資料為例，若預估抽穗期SPAD值會低於33，可評估在抽穗期前後補充每10公畝約1公斤氮素。不過，這是特定地區與栽培體系的參考值，實際施肥仍需依品種、土壤、基肥量與當地建議調整。\r\n\r\n高溫年不宜一概追求低氮。肥料過量會增加倒伏與延遲成熟風險，肥力過早耗盡也會降低登熟能力。管理重點在於依葉色與植株狀態補充，而不是固定增加施肥量。\r\n\r\n【土壤保水與保肥能力需要長期累積】\r\n\r\n稻草、堆肥等有機質回田，有助於改善土壤保水與保肥能力，使水分供應較穩定。矽質肥料也常用於改善稻株強度與生育表現。土壤改良不會在單一季節立即解決高溫問題，但長期維持有機質與土壤結構，可增加水田面對乾旱、間歇供水與高溫時的緩衝能力。投入有機資材前，仍要考量分解速度、養分釋放、病蟲害與作業成本，並配合土壤檢測調整。\r\n\r\n【收穫前不要過早排乾】\r\n\r\n為了方便收割機進田，農民有時會提早排乾田水。但抽穗後過早停止水分供應，可能使稻株快速乾燥，增加胴裂米與充實不良。建議至少維持至抽穗後25天的飽水管理；若之後仍持續高溫，可採短暫灌水，使土壤保持濕潤，避免根域突然乾燥。\r\n\r\n實際排水時間仍需配合土壤排水速度、收穫機具、降雨預報與成熟度判斷。黏質田與砂質田的乾燥速度不同，不能只依固定天數決定。\r\n\r\n【巡田重點應放在葉色、水位與稻株狀態】\r\n\r\n高溫期間需要持續觀察葉色、水位、水溫、植株生育與病蟲害。當葉色快速變淡、水位下降或田土出現乾裂時，應及早調整，而非等到米粒品質問題出現後才處理。不過，炎熱時段頻繁巡田會增加熱傷害風險，田區分散時也耗費大量移動時間。水位感測器、遠端給水與異常通知等設備，可減少不必要的巡視頻率，讓人員優先處理真正需要調整的田區。\r\n\r\n自動化的價值在於降低巡田與夜間操作負擔，但不能完全取代現場判斷。感測器位置、通訊穩定度、給排水能力及設備維護，都會影響實際效果。\r\n\r\n【自動水管理可降低夜間操作負擔】\r\n\r\n近年日本開始導入可遠端控制給水與停水的自動水管理設備，並搭配水位、水溫感測器與排程設定。農民可透過手機或電腦設定夜間灌溉時段，也能接收異常通知，減少深夜前往田區操作的需求。以「水まわりくん」多功能自動給水設備為例，業者公布的實證案例顯示，水管理時間減少約70%，用水量減少約20%。\r\n\r\n【高溫管理需要多項措施配合】\r\n\r\n稻米高溫障礙集中發生於抽穗後約20天，但風險早在品種選擇、插秧期與土壤管理階段便已形成。登熟期則需維持適當水分與葉色，避免過早排乾，並依田區狀態及時調整。單一措施很難完全抵銷持續高溫。高溫耐受品種、作期安排、水分管理、肥培調整與田間監測若能相互配合，較有機會降低白未熟粒與胴裂米。\r\n\r\n", "public_article_format": "text", "public_date": "2026-07-25", "published_date": "2026-07-22", "public_image_url": "https://i.ibb.co/dJD2p7ry/Chat-GPT-Image-2026-7-25-01-35-00.png", "topic": "A_智慧農業與資料治理", "country": "日本", "language": "日文", "source_org": "マイナビ農業", "title_original": "稲の高温障害対策7つの方法！水管理のコツと自動化のすすめ", "url": "https://agri.mynavi.jp/2026_07_22_529466/"}, {"id": 138, "public_title": "稗草如何代謝多種除草劑？CYP81A酵素促成跨類型抗藥性，部分抗性甚至早於新型藥劑上市", "public_summary": "東京農工大學、筑波大學、富山縣立大學研究團隊解開水田雜草稗草對「從未使用過」的合成生長素類除草劑產生抗藥性的機制，發現傳統抗藥性管理常強調輪替不同作用機制，以降低單一標的位點持續承受選汰壓力。這項研究提醒，若雜草已具備廣效型代謝酵素，不同作用機制的藥劑仍可能遭到同一套解毒系統處理。\r\n因此，除草劑輪替不宜只看作用機制分類，也要掌握當地雜草族群是否存在代謝型多重抗性。田間管理仍需搭配栽培輪作、機械除草、適期用藥、降低種子回補及監測抗性族群等方法，減少持續依賴化學防除。", "public_article": "稗草如何代謝多種除草劑？\r\n研究揭示CYP81A酵素促成跨類型抗藥性，部分抗性甚至早於新型藥劑上市\r\n\r\n除草劑抗藥性通常分為兩類：一類來自作用標的改變，使藥劑無法正常結合；另一類則是雜草提升代謝能力，在藥劑發揮作用前便將其分解。相較之下，後者涉及多種酵素與調控路徑，抗性範圍也更難預測。\r\n\r\n日本筑波大學等研究團隊以多重抗藥性稗草為材料，分析細胞色素P450酵素CYP81A12與CYP81A21如何代謝不同類型的生長素型除草劑。研究發現，這些酵素可降低二氯喹啉酸（quinclorac）的毒害，也能使植株同時對氟氯吡啶酯（florpyrauxifen-benzyl）與2,4-D產生抗性，顯示單一代謝路徑可能帶來跨化學結構的抗藥性。\r\n\r\n【抗性來自代謝能力，而非作用標的改變】\r\n\r\n研究材料來自1997年在美國加州沙加緬度谷稻田採集的稗草族群。這個族群對多種作用機制不同的除草劑均具有抗性，但採集當時並沒有生長素型除草劑的已知使用紀錄。\r\n過去研究已發現，這個多重抗藥性族群會同時提高多個P450基因的表現，包括CYP81A12、CYP81A21與CYP709C69。後續遺傳分析也顯示，二氯喹啉酸抗性與多種其他除草劑抗性高度連動，暗示背後可能由共同的代謝系統控制。\r\n研究團隊進一步檢查Aux/IAA基因家族，未發現已知會造成生長素型除草劑抗性的標的位點突變。這使代謝型抗性的可能性更高。\r\n\r\n【CYP81A12與CYP81A21降低二氯喹啉酸毒害】\r\n\r\n研究人員先將不同CYP81A基因導入阿拉伯芥，再觀察其對二氯喹啉酸的反應。結果顯示，表現CYP81A12與CYP81A21的植株，在含藥培養基中生長較佳，對藥劑敏感度明顯下降；CYP81A24也呈現較弱的抗性。\r\n為確認這些酵素是否直接代謝二氯喹啉酸，團隊再利用大腸桿菌表現不同CYP81A蛋白。液相層析串聯質譜分析顯示，CYP81A12、CYP81A21與CYP81A24皆會產生疑似羥基化代謝物，表示這些酵素能直接改變二氯喹啉酸的化學結構。\r\n這項結果也解釋了為何抗藥性植株在施藥後產生較少乙烯。二氯喹啉酸會誘導植物大量生成乙烯，並伴隨一連串毒害反應；當CYP81A酵素加速藥劑失活後，乙烯生成量也隨之下降。\r\n在試驗中，表現CYP81A12或CYP81A21的阿拉伯芥，施用二氯喹啉酸後的乙烯生成量明顯低於野生型，進一步支持「先代謝藥劑，再降低毒害反應」的機制。\r\n\r\n【酵素口袋結構決定藥劑能否靠近催化中心】\r\n\r\n研究團隊也利用分子對接與300奈秒分子動力學模擬，比較不同CYP81A酵素與二氯喹啉酸的結合方式。\r\n能代謝二氯喹啉酸的CYP81A12、CYP81A21與CYP81A24，可讓藥劑維持在靠近血基質催化中心的位置，約距離5至7埃。相較之下，無法有效代謝二氯喹啉酸的CYP81A18，會把藥劑固定在離催化中心約11埃的位置。\r\n差異不只來自結合強弱，也與口袋大小、形狀及水分子進入程度有關。CYP81A12的結合口袋較大、較有彈性，藥劑較容易移動到適合反應的位置；CYP81A18的口袋較窄，且水分子較容易靠近催化中心，使藥劑難以維持有效排列。\r\n這項結果說明，酵素即使能與除草劑結合，也不代表一定能完成代謝。真正影響反應效率的關鍵，是藥劑能否以合適角度與距離靠近催化中心。\r\n\r\n【同一組酵素也能處理其他生長素型除草劑】\r\n\r\n研究團隊接著測試氟氯吡啶酯與2,4-D。雖然這兩種藥劑與二氯喹啉酸的化學結構不同，但表現CYP81A12與CYP81A21的阿拉伯芥仍呈現抗性，多重抗藥性稗草也能耐受較高劑量。\r\n以P450抑制劑馬拉松預先處理後，氟氯吡啶酯抗性則部分下降，進一步證明CYP81A酵素參與其中。\r\n這代表CYP81A12與CYP81A21具有較寬廣的受質範圍，不只代謝單一藥劑，也能處理不同化學類別與作用機制的除草劑。研究團隊稱這種特性為「催化多樣性」，也是代謝型多重抗藥性難以管理的原因之一。\r\n\r\n【新型除草劑上市前，抗性能力可能已存在】\r\n\r\n氟氯吡啶酯直到2018年才商業化，但這個稗草族群早在1997年便已採集。兩者相差超過20年，顯示雜草不必先接觸某一新型藥劑，才逐步演化出對它的抗性。\r\n只要族群中原本就存在能廣泛代謝不同化合物的P450酵素，當新藥劑投入市場後，便可能立即表現交互抗性。這種情況使單純輪替不同作用機制的藥劑，未必能完全避免抗性累積。\r\nCYP81A24過去已知可代謝六種不同作用機制的除草劑，這次研究又確認其能處理生長素型除草劑，使其涉及的作用機制增加至七類。這也顯示，代謝型抗性的範圍可能遠比單一作用標的突變更廣。\r\n\r\n【除草劑輪替仍需考量代謝型交互抗性】\r\n\r\n傳統抗藥性管理常強調輪替不同作用機制，以降低單一標的位點持續承受選汰壓力。這項研究提醒，若雜草已具備廣效型代謝酵素，不同作用機制的藥劑仍可能遭到同一套解毒系統處理。\r\n因此，除草劑輪替不宜只看作用機制分類，也要掌握當地雜草族群是否存在代謝型多重抗性。田間管理仍需搭配栽培輪作、機械除草、適期用藥、降低種子回補及監測抗性族群等方法，減少持續依賴化學防除。\r\n\r\n研究團隊目前仍未完全釐清CYP81A基因為何會同步大量表現。這個多重抗藥性族群可能存在共同的上游調控因子，控制多個解毒基因同時啟動。若能找出這項調控來源，將有助於更早辨識高風險族群，也能改善交互抗性的預測。\r\n\r\n【研究仍有待確認的環節】\r\n\r\n目前質譜分析確認了疑似羥基化二氯喹啉酸，但因缺乏標準品，尚未確定實際羥基化位置。分子模擬提供了酵素結構與代謝能力之間的合理解釋，仍需進一步透過量子化學計算或結構實驗驗證。\r\n此外，研究主要利用阿拉伯芥、大腸桿菌及特定稗草族群進行分析。不同雜草種類、地區與遺傳背景是否具有相同代謝路徑，仍需更多田間族群資料確認。\r\n這項研究的重要意義，在於證明生長素型除草劑同樣可能遭遇P450代謝型抗性。當單一酵素能處理多種化學結構時，新藥劑也可能在正式使用前便面臨既有抗性能力。未來抗藥性管理除了追蹤標的位點突變，也需要更重視雜草代謝能力與交互抗性的累積。\r\n\r\n論文資訊：【Journal of Agriculture and Food Chemistry】Catalytic Promiscuity Underpins Metabolic Resistance to Auxinic Herbicidesin Echinochloa phyllopogon https://pubs.acs.org/jafcau/article/74/25/19454/5171437/Catalytic-Promiscuity-Underpins-Metabolic", "public_article_format": "text", "public_date": "2026-07-25", "published_date": "2026-07-23", "public_image_url": "https://i.ibb.co/vvg7Knjc/Chat-GPT-Image-2026-7-25-01-50-49.png", "topic": "C_IPM植物健康與農藥減量", "country": "日本", "language": "英文", "source_org": "share.google", "title_original": "「未使用農薬」まで分解するスーパー雑草　東京農工大学などが仕組みを解明", "url": "https://share.google/5Ti6O2rE5mqrbLu5E"}, {"id": 85, "public_title": "AI判讀番茄品質，串接栽培與流通資料降低不良果與耗損", "public_summary": "由農研機構等單位組成的聯盟與企業共同開發以AI判定番茄品質的選果機，串接栽培與流通資料，實證降低不良果與廢棄損耗成效。", "public_article": "生鮮番茄在採收時外觀看似正常，進入儲運後卻可能因微細傷、色澤不均或內部品質問題而快速劣化。這類「潛在性品質不良」難以靠人工目視判斷，也容易造成流通端退貨與廢棄。\r\n\r\n日本可果美、澀谷精機、農研機構、AGRI SMILE及磐城小名濱菜園組成研究聯盟，自2023年起投入三年時間，開發以人工智慧判定番茄品質的選果設備，並把選果資料與栽培、流通資料串接。實證結果顯示，系統能找出不良果的栽培條件，也能預測儲運期間的品質劣化，作為調整栽培與出貨順序的依據。\r\n\r\n【人眼看不出的品質問題，往往在流通後才出現】\r\n\r\n研究重點放在「潛在性品質不良」。團隊希望在番茄進入流通前，先用設備蒐集外觀與內部品質資訊，再與栽培環境及物流條件比對，找出哪些果實較容易劣化，以及哪些管理因素可能提高不良果比例。\r\n研究團隊開發的AI選果機已於2024年4月導入磐城小名濱菜園的選果場。設備整合外觀品質攝影機與內部品質感測器，能在不破壞果實的情況下，高速蒐集每顆番茄超過20項外部與內部品質資料，番茄依序通過外觀攝影與內部感測模組，再由系統完成品質判讀。截至實證結束，系統已累積超過1,000萬筆資料。這些資料不只用於當下分級，也成為後續分析栽培條件與品質變化的基礎。\r\n\r\n【選果資料回到生產端，協助調整栽培條件】\r\n\r\n研究團隊將果實品質資料與栽培環境資料依時間序列整合，分析色澤不均與微細傷的發生條件，再依結果調整環境控制。實證結果顯示，調整栽培條件後，色澤不均果的發生率由52%降至45%，減少7個百分點；微細傷果的發生率則由43%降至13%，減少30個百分點。可販售果實比例也隨之提高。\r\n\r\n這項結果說明，選果設備不只負責分級。當品質資料能回傳到生產端，農場便能追查不良果與溫度、濕度、環境控制或栽培管理之間的關係，再據此修正管理方式。\r\n\r\n【預測品質劣化，調整出貨先後順序】\r\n\r\n研究團隊也把AI選果資料與流通資料整合，用來預測番茄在保管期間的品質變化。分析顯示，帶有微細傷等潛在性品質問題的果實，若依一般流程長時間儲運，較容易在通路端劣化。團隊因此安排這類果實提前出貨，縮短其在流通系統中的停留時間。\r\n依實證試算，這種出貨調整可使流通階段的廢棄量減少約30%。這項數字來自試驗條件下的推估，尚不能直接視為所有番茄供應鏈都能達成相同效果，但已顯示品質資料可用於出貨排序與物流管理。\r\n\r\n【五個單位分工完成系統實證】\r\n\r\n這項研究由五個單位共同執行，各自負責不同環節：可果美統籌研究、推動實證並規劃栽培與流通模式；澀谷精機負責AI選果系統與品質檢測技術；農研機構開發內部品質感測技術；AGRI SMILE分析選果、栽培環境與流通資料，並找出不良果成因；磐城小名濱菜園則提供實證場域。\r\n\r\n可果美與澀谷精機表示，後續將持續檢討AI選果機的使用方式，並評估導入其他可果美品牌生鮮番茄農場。研究團隊也規劃延續「資料蒐集、分析、提出假設、再實證」的循環，逐步改善栽培與流通管理。\r\n\r\n參考資料：https://www.kagome.co.jp/library/company/news/2026/img/2026060901_t.pdf", "public_article_format": "text", "public_date": "2026-07-18", "published_date": "", "public_image_url": "https://i.ibb.co/TMSJGqZK/Chat-GPT-Image-2026-7-18-12-42-48.png", "topic": "F_冷鏈食安與農食供應鏈", "country": "日本", "language": "日文", "source_org": "農研機構（NARO）新聞稿", "title_original": "(研究成果) 生鮮トマトの廃棄ロス低減を目指すコンソーシアムの実証成果 AIでトマトの品質を判定する選果機を共同開発 栽培・流通データとの連携で不良果・廃棄ロス低減を実証(外部リンク:カゴメ株式会社)", "url": "https://www.naro.go.jp/publicity_report/press/laboratory/nfri/176115.html"}, {"id": 90, "public_title": "37年土壤增溫實驗發現：暖化恐使穩定碳庫也開始分解", "public_summary": "美國哈佛森林進行近40年的土壤增溫實驗顯示，持續高溫30年後，原本被認為穩定的土壤有機碳也開始分解、釋出更多二氧化碳，森林土壤在暖化下的碳排放風險可能被低估。", "public_article": "森林土壤儲存大量碳，過去研究多認為，其中一部分有機碳結構穩定，不容易因短期升溫而分解。不過，美國一項持續37年的土壤增溫試驗顯示，當高溫延續數十年，土壤微生物可能開始分解這些原先較穩定的碳，並釋放更多二氧化碳。\r\n\r\n這項試驗位於麻薩諸塞州中部的哈佛森林，由海洋生物研究所科學家Jerry Melillo長期主持。研究團隊全年將試驗區土壤溫度維持在周邊土壤以上5°C，持續觀察森林土壤的碳循環與微生物變化。研究結果顯示，到了增溫試驗的第四個十年，原先被認為較能抵抗分解的土壤有機質也開始流失。\r\n\r\n【為何要讓土壤持續增溫5°C】\r\n\r\n研究團隊在試驗開始時，選擇將土壤溫度提高5°C。Melillo說明，這個幅度代表當時全球暖化預測的高值範圍。相較於短期實驗，長期增溫試驗能觀察微生物群落、土壤有機質與碳排放是否在數十年後出現新的反應。這類變化往往無法從幾個月或幾年的試驗中辨識。\r\n\r\n\r\n【持續增溫超過30年後，開始流失原先認為穩定的碳】\r\n\r\n土壤微生物會分解落葉、根系與其他有機物，並將氮、磷等養分重新釋放，供植物利用。微生物在分解有機質時，也會透過呼吸作用排放二氧化碳。溫度升高通常會加快微生物代謝，但微生物不會長期維持相同反應。隨著可利用有機質減少、微生物組成改變及土壤條件變化，土壤碳排放可能出現不同階段。這項試驗的重要發現，是長期增溫改變了微生物利用碳源的範圍。當較容易分解的有機質逐漸減少，微生物仍可能轉而利用原先分解速度較慢、保存時間較長的土壤碳。\r\n\r\n土壤有機碳並非單一物質。有些來自新鮮落葉或細根，微生物可以快速分解；有些則與礦物結合，或經過長期轉化，分解速度較慢，通常被視為相對穩定的碳庫。\r\n\r\n研究團隊在試驗持續增溫超過30年後，發現開始影響這些較穩定的有機質。這代表長期升溫造成的土壤碳損失，可能高於依短期實驗推估的結果。當穩定碳開始分解，森林土壤便會釋放原先長期儲存的二氧化碳。若這類現象廣泛發生，土壤可能減弱原有的碳儲存功能，並增加大氣中的溫室氣體。\r\n\r\n土壤碳與氣候之間存在回饋關係。氣溫升高後，微生物分解有機質的速度可能加快，促使土壤排放更多二氧化碳；大氣中二氧化碳增加，又會進一步推升全球溫度。過去氣候模型已納入土壤呼吸與碳損失，但對穩定碳在長期增溫下的反應仍有不確定性。這次觀察顯示，模型若低估穩定土壤碳的分解，便可能低估森林土壤未來的二氧化碳排放。\r\n\r\n【研究結果不代表所有土壤反應相同】\r\n\r\n這項試驗位於美國東北部溫帶森林，結果不能直接套用到熱帶森林、農地、草原、泥炭地或高緯度凍土。土壤碳的穩定性會受到溫度、降雨、土壤質地、礦物組成、植物種類、微生物群落與有機質來源影響。不同生態系統對升溫的反應速度與幅度可能差異很大。此外，試驗採用全年增加5°C的處理，與自然氣候變遷中的季節變化、乾旱、極端降雨及植物生長反應仍有差別。研究提供的是長期增溫可能影響穩定碳的證據，仍需結合其他地區與不同生態系統的資料，才能推估全球影響。\r\n\r\n", "public_article_format": "text", "public_date": "2026-07-18", "published_date": "2026-07-14", "public_image_url": "", "topic": "E_低碳農業土壤與循環生物經濟", "country": "國際", "language": "英文", "source_org": "ScienceDaily 農業與食品", "title_original": "A 37-year soil experiment revealed a hidden climate threat", "url": "https://www.sciencedaily.com/releases/2026/07/260713000809.htm"}, {"id": 92, "public_title": "日中團隊以精準基因編輯，讓水稻鎘吸收量降低48%且不影響產量", "public_summary": "日本岡山大學與中國科學院團隊以鹼基編輯技術，在水稻金屬轉運蛋白基因OsNramp5找到一個關鍵點突變，可大幅降低稻米鎘吸收，同時維持正常錳吸收與植株生長表現。", "public_article": "稻米中的鎘含量涉及食品安全，也是一項難度較高的育種課題。水稻吸收鎘時，經常利用原本負責運輸錳等必需元素的蛋白質。若直接關閉這些運輸途徑，雖能降低鎘累積，也可能影響養分吸收、植株生長與產量。\r\n\r\n日本岡山大學與中國科學院研究團隊利用鹼基編輯技術，改變水稻金屬運輸蛋白OsNramp5中的一個胺基酸。田間試驗顯示，編輯後水稻的糙米鎘濃度由每公斤0.14毫克降至0.07毫克，降幅約48%；產量及鐵、錳、鋅等微量元素含量則未出現明顯變化。\r\n\r\n【降低鎘吸收，容易連帶影響錳營養】\r\n\r\n鎘是具有毒性與致癌風險的重金屬，可能因工業化、都市發展及其他人為活動進入農地土壤，再由作物帶入食物鏈。水稻吸收鎘的能力高於多數主要穀物，因此成為全球人口攝取鎘的來源之一。育種人員長期嘗試降低稻米鎘含量，但相關基因通常也參與植物必需元素的吸收。這次研究鎖定的OsNramp5，主要存在於水稻根部細胞，負責運輸錳與鎘。錳參與光合作用及多項酵素反應，是水稻正常生長所需的微量元素。\r\n\r\n過去研究曾直接敲除OsNramp5，以減少水稻吸收鎘。然而，OsNramp5失去功能後，也可能降低錳吸收，進而影響植株生長與產量。研究團隊因此改以調整蛋白質的金屬選擇性為目標，希望降低鎘向稻穀移動，同時保留必需元素的運輸功能。\r\n\r\n【從1,600多個編輯品系篩選出關鍵突變】\r\n\r\n研究團隊使用腺嘌呤與胞嘧啶鹼基編輯器，針對OsNramp5製造大量細微突變，再比較不同變異對鎘累積、錳吸收及植株生長的影響。團隊建立超過1,600個基因編輯水稻品系，最後找到表現較佳的突變。這項突變將OsNramp5蛋白第441個位置的異白胺酸改為蘇胺酸，研究中記為OsNramp5^I441T。研究人員接著進行植株生理分析、基因表現測定、蛋白質定位、酵母運輸試驗，以及鎘污染土壤的田間試驗，以確認這項突變如何影響金屬運輸。\r\n\r\n試驗結果顯示，OsNramp5^I441T降低了水稻地上部與稻穀中的鎘累積，但沒有改變OsNramp5的基因表現量、蛋白質含量及細胞內定位。在鎘污染土壤的田間試驗中，未編輯水稻的糙米鎘濃度為每公斤0.14毫克，編輯水稻則降至每公斤0.07毫克。兩者的穀粒產量沒有明顯差異，糙米中的鐵、錳與鋅含量也維持相近水準。結果顯示，研究團隊並未藉由全面抑制金屬吸收來降低鎘，而是改變蛋白質運送不同金屬的偏好，因此減少了對水稻營養與生長的影響。\r\n\r\n【鋅增加後，抑制鎘向地上部移動】\r\n\r\nOsNramp5除了運輸錳與鎘，也能運輸鋅。I441T突變提高了蛋白質對鋅的運輸能力，使更多鋅累積於根部細胞。根部鋅濃度提高後，鋅與鎘在根部向地上部運輸的過程中產生競爭，減少鎘進入輸導組織的機會。鎘由根部運往莖葉的量下降後，最終進入稻穀的鎘也隨之減少。這種調整保留了水稻吸收必需礦物質的能力，也降低了稻穀鎘含量。\r\n\r\n現行降低稻米鎘含量的方法包括土壤改良、灌溉管理及品種選育。田間管理需要持續投入，也會受到土壤性質、水源及氣候條件影響；直接敲除金屬運輸基因，則可能干擾必需元素吸收。這次研究僅改變一個胺基酸，使OsNramp5保留原有功能，同時調整其金屬運輸偏好。研究團隊認為，OsNramp5^I441T可作為培育低鎘水稻的遺傳材料，尤其適合評估應用於輕度鎘污染土壤。\r\n\r\n目前試驗已證實這項突變能降低糙米鎘含量，但實際育種與推廣仍需累積更多資料。\r\n不同水稻品種的遺傳背景、土壤中的鎘與鋅濃度、酸鹼值、灌溉方式及施肥管理，都可能影響金屬吸收與運輸。後續研究仍需透過多年、多地試驗，確認低鎘效果、產量與米質能否維持穩定。這項技術也無法取代污染農地管理。若土壤鎘濃度偏高，仍需搭配水分管理、土壤改良及食用安全監測。品種改良的作用，是降低水稻將鎘帶入可食部位的風險，並增加田間管理的緩衝空間。\r\n\r\n", "public_article_format": "text", "public_date": "2026-07-18", "published_date": "2026-07-16", "public_image_url": "", "topic": "C_IPM植物健康與農藥減量", "country": "國際", "language": "英文", "source_org": "Phys.org 農業", "title_original": "Tiny gene edit cuts cadmium in rice by 48% without reducing yields", "url": "https://phys.org/news/2026-07-tiny-gene-cadmium-rice-yields.html"}, {"id": 97, "public_title": "美國調查顯示，52%農民認為AI與數位工具目前未帶來明顯幫助", "public_summary": "普渡大學與CME集團「農業經濟指標」調查400位美國農民，52%認為AI與數據工具目前對農場經營沒有實質幫助，僅14%認為AI能減少人力需求，反映農民對AI導入農場的實用性仍持保留態度。", "public_article": "農業科技業者常以降低人工與資材成本，說明人工智慧與數位工具對農場經營的價值。不過，美國普渡大學與芝加哥商品交易所集團最新一期「農業經濟景氣指標」調查顯示，農民對這些工具仍抱持明顯疑慮。\r\n\r\n在受訪的400位美國農業生產者中，52%表示，AI與資料驅動工具目前對自身農場「沒有帶來明顯效益」。真正認為這些工具能降低人工需求與成本的農民，僅占14%。調查結果顯示，農民對AI的期待，與農業科技產業常見的宣傳重點並不完全一致。相較於節省人工，22.8%的受訪者較認同AI與數位工具能提高產量；至於降低風險與不確定性，多數農民仍未感受到明顯幫助。\r\n\r\n【農民尚未找到適合自己的使用方式】\r\n\r\n普渡大學商業農業中心主任、調查主持人Michael Langemeier指出，AI與資料工具未來應能產生實際效益，但多數農民目前還不清楚這些工具要如何融入自己的經營。\r\n\r\n他認為，隨著使用經驗增加，未來認為AI對農場有幫助的農民比例可能提高。不過，農民需要時間理解工具功能，也需要確認建議能否配合現場條件。特別是農業決策受到天候、機械、人力與田間條件影響。即使AI提供明確建議，農民也不一定能在現場完全執行。例如，系統可能建議某一天播種玉米，但當天若遇到降雨，或播種機臨時故障，農民仍必須延後作業。Langemeier指出，資料驅動工具需要一段學習期。農民除了理解建議內容，也要判斷建議是否符合現場狀況。部分工具提出的管理處方過於精細，實務上未必能完全落實。\r\n\r\n【高資材成本仍是農場財務的最大壓力】\r\n\r\n這期調查也詢問農民，哪些因素最限制農場財務改善。42%的受訪者將高資材成本列為首要問題，比例明顯高於其他選項。其次為農產品價格偏低，占17%；天候風險占14%；政策不確定性占11%；人工與設備問題占9%；債務或財務壓力占8%。這些結果說明，農民目前最直接的經營壓力仍來自肥料、種子、燃料、農藥與其他投入成本。即使AI工具主打節省資材，若農民無法明確看見投入與回報之間的差距，導入意願仍然有限。\r\n\r\n【AI能否落地，關鍵在於是否對應農場問題】\r\n\r\n這項調查反映，農業科技產業常談AI能降低成本、改善決策，但農民更在意工具能否處理眼前問題。若系統只能提供一般化建議，或需要大量資料輸入、設備更新與人員訓練，農民可能難以判斷導入是否划算。對中小型農場而言，初期成本與操作複雜度也可能抵銷預期效益。農民較容易接受的工具，通常具備幾項條件：能處理明確問題、操作簡單、建議符合田間節奏，並能用產量、成本或風險變化證明效益。\r\n\r\n本次調查尚未細分不同作物、農場規模與數位化程度，因此無法判斷哪些農民對AI較為接受，也無法比較不同工具的使用成效。不過，結果已顯示，AI在農業上的普及程度，不能只看工具數量或業者投入，也要看農民是否能在實際經營中獲得可辨識的效益。", "public_article_format": "text", "public_date": "2026-07-18", "published_date": "2026-07-15", "public_image_url": "", "topic": "A_智慧農業與資料治理", "country": "國際", "language": "英文", "source_org": "AgFunder News", "title_original": "Many growers still find ‘no meaningful benefit’ from AI use on the farm: survey", "url": "https://agfundernews.com/many-growers-still-find-no-meaningful-benefit-from-ai-use-on-the-farm-survey"}, {"id": 104, "public_title": "日本參議院院會17日通過因應氣候變遷等重要農產品品種開發與普及新法", "public_summary": "日本參議院院會17日通過因應氣候變遷等重要農產品品種開發與普及新法，將由國家制定「基本方針」，整合縣、企業與農研機構等單位共同推動品種開發。", "public_article": "因應氣候變遷等挑戰，推動重要農作物品種育成與種苗生產的新法，已於7月17日在日本參議院全體會議表決通過，獲朝野多數議員支持，正式成立。\r\n\r\n這項新法全名為《重要品種育成及其種苗生產振興法》，通稱「氣候變遷等因應品種法」。日本政府指出，隨著高溫等氣候衝擊逐漸影響農業生產，為確保糧食穩定供應，必須加快育成並普及具高溫耐受性、抗病性及高產等特性的關鍵品種。新法也將搭配《種苗法》修正，強化重要品種及其他新品種的育種者權利保護。\r\n\r\n依新制度，日本中央政府將先訂定重要品種育成與普及的基本方針，內容包括哪些特性應列為重點、如何運用基因體分析等先進技術、如何納入市場與實際需求端評估，以及新品種智慧財產權的保護方式。\r\n\r\n在品種育成方面，日本農研機構、都道府縣及民間企業可單獨或共同提出「重要品種育成事業計畫」，說明新品種特性、預定栽培地區、目標普及面積、需求端評估方式及品種登錄申請時程，經農林水產大臣認定後，可使用農研機構的研究設施與設備，並獲得品種登錄申請費等減免。完成育成的重要品種，也必須提出品種登錄申請。\r\n\r\n在種苗生產與普及方面，都道府縣將依中央基本方針擬定區域計畫，規劃重要品種的生產、普及方向及種苗生產區域。種苗生產者則可依地方計畫提出生產計畫，內容包括生產量、種苗生產區域規模及農地集中方式，經知事認定後，可參與農地整合相關協議，並適用農地利用調整及農業用地編入程序簡化等措施。\r\n\r\n此外，種苗生產者也可與周邊農業者訂定栽培管理協議。即使農地之後由他人承接，該協議效力仍可延續，以維持種苗生產區域的管理一致性。\r\n\r\n新法預定在公布後六個月內，由政令另定施行日期。整體制度希望建立由中央訂定方向、產官學共同育種、地方政府規劃普及、種苗業者穩定生產的推動架構，加快氣候調適品種從研發走向產地應用。\r\n\r\n資料來源：https://www.maff.go.jp/j/law/bill/attach/pdf/221-30.pdf\r\n", "public_article_format": "text", "public_date": "2026-07-18", "published_date": "2026-07-18", "public_image_url": "https://i.ibb.co/Pvz9kBYB/Chat-GPT-Image-2026-7-18-11-32-50.png", "topic": "B_氣候韌性與農業風險管理", "country": "日本", "language": "日文", "source_org": "日本農業新聞", "title_original": "気候変動対応の品種開発へ新法成立 国主導で開発", "url": "https://www.agrinews.co.jp/news/index/394564"}, {"id": 109, "public_title": "日本新創公司與北海道政府合作，建置AI伐採狀況判釋模型示範計畫", "public_summary": "日本新創公司Archeda與北海道政府簽約，於令和8年度執行「伐採狀況把握AI模型建置實證」委託業務，以衛星資料結合AI偵測伐採狀況，協助廣域森林監測與森林行政作業效率化。", "public_article": "北海道森林面積廣大，地方政府若要逐一前往現場確認伐採情形，需要投入大量人力與時間。隨著林業從業人口減少、地方政府林務人員有限，如何持續掌握伐採進度與範圍，已成為森林行政的重要課題。北海道政府2026年度啟動「伐採狀況掌握AI模型建置實證」，由日本新創公司Archeda承接。這項計畫將結合衛星影像與人工智慧，辨識北海道境內可能發生伐採的區域，再提供林務人員作為現地查核與行政判斷的參考。\r\n\r\n【衛星影像先篩選，現勘再確認】\r\n\r\n衛星能以固定頻率拍攝大範圍地表。若搭配不同時間的影像，便能比對森林覆蓋與地表變化，找出疑似伐採區域。本案的AI模型將分析北海道境內的時序衛星資料，辨識林地中近期出現明顯變化的位置。行政人員可依分析結果安排後續查核，優先處理變化較明顯或風險較高的區域。由於衛星影像可能受到雲層、積雪、季節變化與地形影響，AI也可能將整地、風倒木或其他地表變化判定為伐採。因此，由模型扮演篩選工具，協助地方政府便能將有限人力集中在需要進一步確認的區域，並提高伐採狀況的掌握頻率。\r\n\r\n【以林班單位追蹤伐採時間與位置】\r\n\r\nArcheda表示，既有森林分析系統能以林小班等管理單位，追蹤不同時間的衛星影像，辨識伐採發生的位置。這項功能可協助地方政府比對伐採申報內容，確認實際作業位置、範圍與時間是否一致。若系統發現申報區域外出現地表變化，行政人員也能進一步查核。除了伐採辨識，Archeda目前提供的森林分析項目還包括：\r\n\r\n* 造林與更新狀況監測\r\n* 樹高與樹冠辨識\r\n* 森林資源量推估\r\n* 無人機現地量測\r\n* 申請、申報及施業紀錄的地圖化管理\r\n其中，森林管理雲端平台「森ノート」可整合施業紀錄、申請資料與衛星分析結果，讓管理人員直接在地圖上查閱不同林區資訊。\r\n\r\n【北海道成為大範圍森林監測的測試場域】\r\n\r\n北海道是日本森林面積最大的地區之一，林地分布廣，地形與氣候條件差異也大。傳統森林管理高度依賴現地巡查。這種方式能取得直接資訊，但在人力有限、林區範圍廣大的情況下，很難維持高頻率與完整覆蓋。但對森林行政而言，重要的不是單次偵測結果，而是能否建立穩定更新、可追溯且能與申報制度銜接的資料基礎。\r\n對衛星與AI監測而言，北海道能提供足夠規模的測試環境，也能檢驗模型面對積雪、雲層及不同林型時的辨識能力。本次實證的重點不只在於AI能否辨識影像，還包括分析結果能否配合行政流程。當地方政府持續保存不同年份的伐採、造林與森林資源資訊，便能進一步分析更新進度、施業分布及森林變化趨勢。\r\n\r\n", "public_article_format": "text", "public_date": "2026-07-18", "published_date": "2026-07-16", "public_image_url": "", "topic": "D_森林木竹及林下經濟", "country": "日本", "language": "日文", "source_org": "日本農業新聞", "title_original": "Archeda、北海道の令和8年度「伐採状況把握AIモデル構築実証」委託業務の契約を締結 株式会社Archeda 2026年7月16日 掲載", "url": "https://www.agrinews.co.jp/news/prtimes/393980"}, {"id": 51, "public_title": "植物也能戴上「穿戴裝置」：葉片貼片與莖部感測器，讓農民提早掌握缺水、鹽害與生長異常", "public_summary": "美國塔夫茨大學（Tufts）團隊開發植物「穿戴式」感測器，希望在作物出現捲葉、生長遲緩等可見症狀「之前」，就抓到逆境訊號。研究刊於《ACS Applied Materials & …", "public_article": "農民在田間看到葉片捲曲、植株矮化或生長停滯時，作物往往已經承受數日壓力。等到症狀明顯出現，缺水、鹽分累積或養分失衡可能已影響光合作用與生長。美國塔夫茨大學研究團隊近期開發一套植物「穿戴式感測器」，希望在作物外觀尚未出現異常前，便掌握植物的生理反應。\r\n\r\n這套系統包含兩種裝置：一種是貼附於葉片表面的薄型感測器，外觀看起來像暫時性刺青；另一種則是纏繞在莖部、可隨植物生長伸展的感測帶。兩者分別量測葉片水分交換狀況及莖部直徑變化，藉此判斷植物是否正面臨缺水、鹽害或生長受阻。更特別的是，葉片感測器不需要外接電池，而是利用植物蒸散所產生的水分交換自行發電。\r\n\r\n【從空中俯瞰，走向植物本身的即時反應】\r\n\r\n目前農業監測已廣泛使用衛星、無人機、土壤感測器與田間氣象站。衛星與無人機可以透過可見光、紅外線及微波影像，觀察作物覆蓋、葉色、生長不均、溫度、病蟲害及土壤含水量。土壤感測器則能量測水分、溫度、酸鹼值及部分養分，氣象站也能提供氣溫、濕度、降雨、風速與日照等資訊。這些工具能協助農民掌握田區整體環境，但多半反映兩種情況：一是可能在未來對作物造成影響的外部條件，二是已經發生的生長異常或受害結果。\r\n\r\n植物穿戴式感測器研究團隊希望直接觀察植物當下如何回應環境，在葉片萎凋、捲曲或植株生長受阻前，提供較早的警示。研究主持人、塔夫茨大學電機與電腦工程學教授Sameer Sonkusale表示，這項技術的發展目標是讓整片農田未來能布建植物層級的監測網路。每一株或每一區代表性作物都能回傳缺水、鹽害、病害或養分失衡的早期訊號。衛星與無人機提供的是空中視角，植物穿戴裝置則提供更貼近植株本身的觀察。\r\n\r\n【葉片感測器量測「空氣有多想把水吸走」】\r\n\r\n葉片感測器主要量測蒸氣壓差，也就是VPD（Vapor Pressure Deficit，空氣吸收水分的能力），當VPD偏高時，代表空氣較乾燥，葉片水分散失速度會加快。植物通常會關閉氣孔，降低蒸散量，避免過度失水。氣孔關閉雖然能減緩脫水，也會限制二氧化碳進入葉片，使光合作用與生長速度下降。因此，VPD不只是環境濕度指標，也能反映植物正面臨的水分壓力。\r\n\r\n【利用植物蒸散水分自行發電】\r\n\r\n葉片感測器的核心材料是五氧化二釩晶體。研究人員將五氧化二釩製成極薄的奈米片，再層層堆疊成膜。感測器上方另設置一層由碳原子構成的石墨烯，形成可以讓水氣通過的微型篩網。當植物蒸散產生的水分穿過石墨烯，進入五氧化二釩奈米片層後，水分會形成離子，並在材料內移動產生電流。水分交換愈強，產生的電流也愈大，感測器產生的電力只有微瓦等級，但搭配低功耗電子元件及儲能裝置，已足以支援定期量測。\r\n\r\n【莖部感測帶記錄植物有沒有繼續長大】\r\n\r\n葉片感測器觀察的是較快速的水分交換反應，莖部感測帶則記錄較慢的生長變化。莖部裝置採用日本剪紙藝術「切紙」的結構概念，在材料表面設計特殊切口，使感測帶可以隨著莖部膨大伸展與變形。感測器外層塗覆一種稱為共熔凝膠的柔軟導離子材料。當莖部直徑增加或縮小時，凝膠的形狀與電阻會隨之改變，系統便能持續追蹤莖粗變化。\r\n\r\n植物健康生長時，莖部直徑通常會逐漸增加；遭遇缺水或鹽害時，生長可能趨緩，莖部甚至會暫時收縮。將葉片與莖部感測器搭配使用，可以同時掌握不同時間尺度的生理反應。葉片感測器較快反映水分散失狀況，莖部感測器則呈現生長累積結果。\r\n\r\n【甜椒試驗辨識缺水與鹽害】\r\n\r\n研究團隊以甜椒植株進行測試，觀察健康植株、缺水植株及鹽分逆境植株的差異。健康甜椒的VPD會隨每日空氣濕度變化呈現規律起伏，反映正常的日夜水分交換週期。缺水植株的VPD則呈現持續上升趨勢，顯示葉片面臨較強的水分散失壓力。鹽分逆境植株呈現另一種反應。與健康對照組相比，其VPD反而較低。研究人員推測，這可能與鹽分影響根系吸水能力及氣孔調節有關。莖部感測器也記錄到明顯差異，健康植株的莖部持續增粗，受壓力植株則出現生長減緩或直徑縮小。兩類感測訊號搭配後，系統不只判斷植物是否受到壓力，也有機會進一步區分不同逆境類型。\r\n\r\n【從田區平均值，走向植株層級管理】\r\n\r\n現有農業監測多以田區或區域為單位，提供平均溫度、土壤水分或影像變化。這類資訊適合掌握整體趨勢，但可能忽略同一田區內不同植株的差異。植物穿戴式感測器讓監測尺度進一步縮小到單株或代表性植株，直接讀取作物的生理反應。對設施農業、高價值果樹、育苗生產或鹽害風險較高的田區而言，這類即時監測可能具有較高應用價值。農民可以在肉眼症狀出現前察覺異常，縮短發現問題與採取措施之間的時間。\r\n\r\n\r\n臺灣設施農業與高價作物對早期逆境、病害預警需求高。逐株葉片感測若成熟，可對照農業部智慧農業與植物醫師的監測體系。不過，這項技術目前仍處於研究與系統開發階段。未來能否普及，仍需評估感測器成本、使用壽命、田間耐候性、不同作物的校正需求、資料判讀方式及大面積布建的可行性。\r\n\r\n\r\n#智慧監測 #IPM #設施農業 #植物感測\r\n\r\n\r\n原文標題：Wearables to track plant health: Farmers could use real-time information to manage crop conditions\r\n原始網址：https://phys.org/news/2026-07-wearables-track-health-farmers-real.html", "public_article_format": "text", "public_date": "2026-07-12", "published_date": "2026-07-09", "public_image_url": "", "topic": "C_IPM植物健康與農藥減量", "country": "國際", "language": "英文", "source_org": "Phys.org 農業", "title_original": "Wearables to track plant health: Farmers could use real-time information to manage crop conditions", "url": "https://phys.org/news/2026-07-wearables-track-health-farmers-real.html"}, {"id": 52, "public_title": "AI 變量播種：以土壤、地形與歷年產量資料，找出玉米與大豆的最佳播種策略", "public_summary": "美國密蘇里大學團隊以人工智慧分析俄亥俄州兩座農場的土壤、地形與多年產量資料，依田區條件給出不同播種密度建議。研究在玉米上取得穩定可預測的結果，大豆則因受天候影響較大而仍待更多資料驗證。", "public_article": "農民愈來愈重視每一分土地的投入效益，但傳統播種方式往往對整塊農田採用相同密度。問題在於，看起來平整一致的田區，土壤肥力、水分條件、地勢與侵蝕風險可能差異很大。美國密蘇里大學研究團隊近期利用人工智慧與地理空間分析，探索如何依照田區內不同位置的條件，調整播種密度，讓種子投入更接近實際產量潛力。\r\n\r\n研究以美國俄亥俄州兩座農場的玉米與大豆資料進行分析。結果顯示，玉米對變量播種的反應較穩定，較適合近期導入精準農業；大豆則受到天候影響較大，模型仍需要更多資料與田間驗證。\r\n\r\n【同一塊田，不同位置的生產條件並不相同】\r\n\r\n密蘇里大學農業系統科技助理教授、研究共同通訊作者Jasmine Neupane指出，從道路旁看去，一整片農田可能相當整齊，但田區內部的條件通常並不均一。有些位置土壤較肥沃，保水能力較佳；另一些區域則可能地勢較低、容易積水，或因坡度、沖蝕與養分流失而降低生產力。若所有位置都採用相同播種密度，部分高潛力區域可能沒有充分利用，低潛力區域則可能投入過多種子，增加成本，卻未必提高產量。這也是變量播種技術希望處理的問題。\r\n\r\n【播得更多，不一定收得更多】\r\n\r\n在土壤與水分條件良好的區域，較高的播種密度可能帶來增產；在生產潛力較低的位置，同樣增加種子量，反而可能提高種苗成本，卻無法形成相對應的收益。研究團隊因此導入變量播種技術，也就是VRS（Variable-Rate Seeding）。搭載變量控制系統的播種機，在田間移動時，可以依照不同區位的產量潛力，即時調整播種量。高潛力區域採用較高密度，條件較差的區域則適度降低，避免全田使用同一標準。\r\n\r\n【AI如何判斷分區播種量】\r\n\r\n研究團隊將農場常見的資料輸入人工智慧模型，包括：\r\n* 土壤採樣資料\r\n* 田區高程與地形資訊\r\n* 多年產量紀錄\r\n* 不同區位的生產表現\r\n* 播種密度與投入成本\r\n\r\n模型分析各項資料後，找出播種密度與產量、收益之間的關係，再提出較符合特定位置條件的播種建議。Neupane表示，人工智慧能協助農民判斷田區不同位置適合的播種密度，也能延伸應用於肥料及作物保護資材管理。當農民更清楚哪些位置具有較高生產潛力，便能集中投入種子、肥料與其他資材；產量反應有限的區域則不必持續增加投入。這類管理方式有助於降低不必要的成本，也能減少養分與農業化學資材流失，降低逕流對鄰近土壤及水體的影響。\r\n\r\n【玉米的結果較穩定，接近實務應用階段】\r\n\r\n研究團隊比較玉米與大豆後發現，玉米的分析結果較為一致，也較容易預測。模型可以辨識哪些區位提高播種密度後能增加收益，哪些區域即使增加種子量，經濟效益仍然有限。這代表玉米的播種密度與土壤、地形及歷年產量之間，存在較穩定的關係。只要農場累積足夠資料，模型便有機會提供具有實用價值的分區建議。不過，研究並未表示提高播種密度一定能增加收益。真正的重點是找出適合增加密度的位置，同時辨識不需要額外投入的區域。\r\n\r\n另一方面，大豆具有較強的生長調節能力。當播種密度較低時，單株可能增加分枝、形成更多莢果，以部分補償株數不足；播種密度較高時，植株也會依照光線、水分與空間條件調整生長。這種適應能力有助於作物面對環境變化，卻也讓播種密度與最終產量之間的關係變得不容易預測。因此，同一套播種策略在不同年份可能產生不同結果。某一年適合提高密度的區域，隔年若遇到乾旱、高溫或降雨分布改變，效果可能不再相同。\r\n\r\n【經濟最佳值，不等於單純追求最高產量】\r\n\r\n這項研究同時分析農藝與經濟層面的最佳播種密度。農藝上的最佳值，通常是能獲得最高產量的播種密度；經濟上的最佳值，則必須同時考量種子成本、肥料投入、管理費用及作物售價。最高產量不一定帶來最高利潤。若為了增加少量產量而大幅提高種子投入，額外收入可能不足以支應增加的成本。人工智慧模型的作用，是比較不同播種密度下的投入與收益，協助農民找出較接近經濟效益最佳值的管理方式。當種子價格、作物售價或肥料成本改變時，最佳播種密度也可能隨之調整。因此，這類系統不能只依賴一次性的分析結果，而要持續更新成本、市場及田間資料。\r\n\r\n\r\n農民原本就知道低窪處、沙質區或坡地的產量可能不同。人工智慧進一步把這些經驗與土壤、地形及產量紀錄整合，將田區劃分為更細緻的管理區域。這項技術的實際效益，仍取決於資料品質、機具設備、種子成本、作物價格，以及農民是否具備長期而完整的產量紀錄。對資料累積較完整、已使用衛星定位與產量監測設備的農場而言，變量播種較容易導入。缺乏數位資料的小型農場，則可能需要先從土壤採樣、田區分區及產量紀錄做起。\r\n\r\n回到臺灣，近年推動智慧農業與精準農業，農業部與各區農業改良場都有相關試驗，但變量播種要發揮效益，通常需要夠大的田區、可即時調整密度的農機，以及多年累積的田間與產量資料，而臺灣田區相對破碎、單位面積較小，導入時的設備成本與資料累積可能構成主要門檻。這項研究對玉米與大豆的差異，也提醒技術效益會因作物特性而不同，導入評估宜以個別作物與田區條件為準。相關題目適合由農業部、農業試驗所、各區農業改良場，以及大學農藝與農機系所，作為智慧農業示範與農機補助政策的觀察對象。\r\n\r\n原文標題：Leveraging machine learning and geospatial analysis to determine agronomic and economic optima for variable-rate seeding in corn and soybean\r\n原文連結：https://phys.org/news/2026-07-future-ai-farm.html", "public_article_format": "text", "public_date": "2026-07-12", "published_date": "2026-07-08", "public_image_url": "", "topic": "A_智慧農業與資料治理", "country": "美國", "language": "英文", "source_org": "Phys.org 農業", "title_original": "Planting the future: Researchers put AI to work on the farm", "url": "https://phys.org/news/2026-07-future-ai-farm.html"}, {"id": 64, "public_title": "AI在消費品研發無所不在，但真的有推動進展嗎？九成大型消費品企業已使用AI，但真正融入日常流程的僅約兩成", "public_summary": "調查發現，大型消費品公司57%研發主管認為，生成式AI產出的配方成果過於籠統，仍需大量人工修改才能使用。", "public_article": "人工智慧已進入大型食品與消費品企業的研發部門，但「開始使用」與「真正產生效益」之間，仍有明顯差距。AI研發平台業者Turing Labs近期針對美國與歐洲290位大型消費品企業資深研發主管進行調查。結果顯示，91%的受訪者已在工作中使用AI，或正在進行試驗、擴大導入；然而，僅有19%表示AI已真正嵌入日常研發流程。更值得注意的是，即使企業投入大量試驗，真正能持續使用並創造明確商業效益的案例仍然有限。Turing Labs創辦人暨執行長Manmit Shrimali認為，食品與消費品產業目前並不缺乏AI概念或創新點子，真正缺少的是一套能整合市場、配方、法規、成本與量產條件的新型研發模式。\r\n\r\n【AI應用很多，真正改變研發流程的卻不多】\r\n\r\n從表面上看，九成以上大型企業已開始使用AI，似乎代表產業導入速度相當快。但進一步分析後可以發現，多數應用仍集中在概念發想、資料搜尋、文件摘要與初步研究。這些任務適合通用型大型語言模型，也較容易快速看到成果。目前AI帶來較明顯效益的部門，反而常是行銷而非研發。企業可以利用AI減少廣告代理商支出、提高內部內容製作效率，或加快文案、圖像與市場素材產出。\r\n\r\n這些應用確實能降低成本，卻不等同於產品創新。當企業試圖把AI用在配方設計、法規判斷、成分選擇與商品化時，問題便開始浮現。依據Turing Labs調查：\r\n\r\n* 20%的AI計畫最後沒有進入正式執行\r\n* 14%雖然曾經導入，之後又遭到放棄\r\n* 24%仍在使用，但幾乎沒有產生明顯商業效益\r\n* 57%的受訪者認為，生成式AI提供的配方結果過於籠統，仍需大量人工修正與驗證\r\n\r\n這些數據顯示，大型企業並非沒有接觸AI，而是仍在尋找適合高專業門檻研發工作的使用方式。\r\n\r\n【食品配方不是單純的搜尋問題】\r\n\r\n通用型AI工具之所以在食品研發上容易失準，主要原因在於配方設計牽涉的條件遠比文字生成複雜。一項食品或飲料產品從概念走向上市，通常需要同時考量：\r\n\r\n* 原料化學特性\r\n* 成分間相互作用\r\n* 食品法規與標示限制\r\n* 製程與設備適用性\r\n* 原料價格與供應穩定性\r\n* 風味、口感與外觀\r\n* 保存期限\r\n* 營養目標\r\n* 消費者定位\r\n* 通路與市場策略\r\n\r\n這些條件彼此牽動。降低糖分可能影響口感與保存性，替換原料可能改變製程穩定度，改善營養標示也可能提高成本。因此，食品研發不能只依靠「找出可能答案」，還必須確認這個答案是否能生產、符合法規、具有市場競爭力，並在成本範圍內維持品質。Shrimali指出，部分企業曾嘗試把數千份技術白皮書上傳到通用聊天工具，再直接詢問配方問題，最後卻發現相同問題可能得到不同答案。對一般資料整理而言，這種差異或許尚可接受；對配方、食品安全與法規決策來說，結果不穩定便可能形成重大風險。\r\n\r\n【問題不只在工具，也在企業如何看待AI】\r\n\r\n企業常見的另一項錯誤，是把AI視為加快既有流程的工具，卻沒有重新思考研發工作應如何組織。許多企業希望AI縮短現有作業時間，例如加快配方調整、整理研究報告或協助製作簡報。這些做法能改善局部效率，但若流程本身存在部門斷點、資料孤島或重複決策，單純加速並不會解決根本問題。食品研發經常涉及市場、研發、法規、採購、製造與財務等多個部門。若各部門使用不同資料系統，且在產品開發後期才交換意見，許多問題仍會延後才被發現。AI真正可能帶來的變化，是讓這些條件更早被整合，而不是單純讓其中某一個步驟變快。\r\n\r\n企業導入AI大致可以分為三類。\r\n\r\n第一類企業認為自己有能力建立內部系統，但實際開始後才發現開發時間過長，成本也不斷增加。\r\n第二類企業同時進行許多AI試驗，持續更換工具與供應商，卻沒有足夠人力深入使用任何一套系統。\r\n第三類企業會先明確界定問題，選擇單一合作夥伴，再投入時間與資料進行整合。\r\n\r\n部分大型消費品企業過去投入數百萬美元建立資料庫，期待最後能形成一套涵蓋所有研發工作的智慧系統。實際結果卻常是零散的局部成果。資料雖然被集中保存，產品開發人員仍然不知道如何使用，企業對AI能否真正改變產品創新也逐漸失去信心。這說明資料集中本身並不等於智慧決策。若缺乏明確問題、專業模型與工作流程設計，再完整的資料庫也可能無法直接轉換為研發成果。\r\n\r\n導入初期，企業可以從一個商業問題開始，例如：「如何從自有品牌手中重新取得義大利麵醬市場占有率？」\r\n\r\n系統接著分析問題可能出在哪裡，包括產品配方、售價、包裝規格、產品宣稱、法規限制與消費者定位。後續再進一步推演：\r\n\r\n* 應該開發什麼產品\r\n* 哪一種配方較合適\r\n* 大規模生產成本是多少\r\n* 法規風險集中在哪些地方\r\n* 現有產品組合有哪些成本可以調整\r\n* 節省下來的資源是否能支應新品上市\r\n\r\n配方最佳化仍然是其中一項功能，但已不是整套系統的唯一核心。\r\n\r\n【AI可以提早發現法規風險】\r\n\r\n在食品產品開發流程中，法規審查經常發生在配方完成之後。產品開發人員將配方交給法規部門，再等待數天取得回覆。若發現某項原料、用量或宣稱不符合規定，便需要重新修改配方，增加開發時間。但AI在法規工作的潛力，是把風險判斷往前移。系統可以在產品開發初期便標示潛在法規問題，將規定轉換成可操作的配方限制，並提出替代原料或調整方向。這樣的AI不只是檢查產品是否合規，也能協助企業判斷法規變動可能帶來哪些市場機會。\r\n\r\n【AI代理仍不能完全取代人員判斷】\r\n\r\n近年受到高度關注的AI代理，已能分解任務、搜尋資料與執行多步驟工作，但AI代理可能誤解背景、遺漏條件，或在資料不足時做出錯誤推論，因此仍需要適當的流程設計、風險限制與人員確認。較可行的方式，是讓AI處理大量資料整理、規則比對與方案推演，再由研發、法規與商業人員共同判斷。AI的角色較接近決策支援系統，而不是完全取代產品開發團隊。\r\n\r\nAI是否協助研發部門創造實際商業成果的衡量方式應包括：\r\n\r\n* 是否帶動營收\r\n* 是否改善產品毛利\r\n* 是否增加通路貨架空間\r\n* 是否降低上市後再次修改的比例\r\n* 是否開發出真正具有差異化的產品\r\n* 是否提高研發資源配置效率\r\n\r\n若AI只讓原有流程快一點，卻沒有提高產品成功率，企業仍然可能持續推出缺乏競爭力的商品。\r\n\r\n\r\n【調查說明】\r\n\r\n調查對象：美國與歐洲290位資深研發主管\r\n企業條件：員工人數1,000人以上，且從事食品及飲料配方開發與製造\r\n主要發現：\r\n\r\n* 91%已使用、試驗或擴大導入AI\r\n* 19%已將AI嵌入日常工作流程\r\n* 20%的AI計畫未正式執行\r\n* 14%導入後遭到放棄\r\n* 24%仍在使用，但商業效益有限\r\n* 57%認為生成式AI配方結果過於籠統\r\n* 52%的產品上市後一年內需要調整\r\n* 60%認為品牌與自有品牌品質差距縮小\r\n\r\n原文標題：AI is everywhere in CPG R&D. But is it moving the needle? Turing Labs surveys the biggest players\r\n原文連結：\r\nhttps://agfundernews.com/ai-is-everywhere-in-cpg-rd-but-is-it-moving-the-needle-turing-labs-surveys-the-biggest-players\r\n", "public_article_format": "text", "public_date": "2026-07-12", "published_date": "2026-06-16", "public_image_url": "", "topic": "F_冷鏈食安與農食供應鏈", "country": "國際", "language": "英文", "source_org": "AgFunder News", "title_original": "AI is everywhere in CPG R&D. But is it moving the needle? Turing Labs surveys the biggest players", "url": "https://agfundernews.com/ai-is-everywhere-in-cpg-rd-but-is-it-moving-the-needle-turing-labs-surveys-the-biggest-players"}, {"id": 59, "public_title": "德國 Stenon 募 1,800 萬歐元，以即時土壤氮素數據對抗肥料漲價", "public_summary": "德國農業科技公司 Stenon 完成 1,800 萬歐元（約 2,050 萬美元）B 輪募資，由荷蘭影響力投資機構 Pymwymic 領投，用於擴展其氮素與土壤數據管理平台。背景是…", "public_article": "全球肥料價格劇烈波動，農民愈來愈難掌握生產成本。德國農業科技公司Stenon近期完成1,800萬歐元、約2,050萬美元的B輪募資，準備擴大氮肥與土壤數據管理平台的市場布局。\r\n\r\n歐盟地區的氮肥價格已較2024年平均高出約70%，促使歐盟執委會提出5.4億歐元、約6.15億美元的農民紓困方案。高度依賴進口肥料的巴西，同樣面臨成本上升問題，包括磷酸二銨（DAP）及尿素等重要肥料，價格都受到國際市場牽動。部分巴西農民因價格過高而減少採購農業資材。投入量一旦下降，可能進一步影響施肥量、作物產量與農場收入。Stenon提出的解方，是讓農民能夠直接在田間取得更快速、更精細的氮素與土壤資料，依照實際狀況調整肥料施用。\r\n\r\n傳統土壤檢測多半依靠少數採樣點，再以平均值代表整塊田區。然而，即使在同一塊農地，不同位置的土壤肥力、含水量與有機質仍可能存在明顯差異。FarmLab能夠增加量測頻率與採樣密度，使農民更容易掌握田區內部的變化。而Stenon開發的FarmLab，是一套可攜式土壤分析設備，搭載光學及電學感測器。設備插入土壤後，能在數秒內量測多項資料，包括植物可利用態氮、土壤有機質、土壤溫度與含水量。透過軟體與人工智慧分析原始數據，將量測結果轉換為施肥管理建議，協助農民判斷肥料施用位置與用量。農民不必採集土壤樣本後送至實驗室，再等待數日或數週才能取得報告，而是能在田間即時取得數據，作為當下施肥與管理的參考。\r\n\r\nStenon的平台目前已進入美國加州、巴西、瑞士、奧地利、德國與希臘等國，應用於玉米、豆類、棉花、甘蔗、咖啡及穀物等作物，使用後的產量增幅約為2%至8%。以氮肥投入效益計算，平均投資報酬率約為20%至40%。\r\n\r\n面對肥料價格上漲，農民最直接的反應往往是減少施肥量，但全面減量未必能降低整體風險。作物在關鍵生育期若無法取得足夠養分，後續產量與品質損失可能高於節省下來的肥料成本。Stenon的發展方向顯示，精準施肥的重點正逐漸從「整塊農地應該施多少肥」，轉向「田區內哪些位置需要施肥，以及應該在什麼時間施用」。\r\n\r\n即時土壤檢測也開始從研究或顧問服務，逐步進入農民日常管理流程。當量測速度提高、操作程序簡化，土壤數據便有機會與施肥機械、田間管理紀錄及作物生長資料進一步整合。但這類技術能否普及，仍取決於設備成本、數據準確度、在地校正、操作便利性及實際投資效益。不過，在肥料價格與供應風險持續增加的環境下，如何讓每一公斤肥料發揮更高效益，已成為農場經營不可忽視的管理課題。\r\n\r\n\r\n#智慧農業 #精準施肥 #農業減碳\r\n\r\n\r\n原文標題：Stenon bags $20.5m to combat fertilizer price hikes with better nitrogen management\r\n原始網址：https://agfundernews.com/stenon-bags-20-5m-to-combat-fertilizer-price-hikes-with-better-nitrogen-management", "public_article_format": "text", "public_date": "2026-07-11", "published_date": "2026-07-01", "public_image_url": "", "topic": "A_智慧農業與資料治理", "country": "德國", "language": "英文", "source_org": "AgFunder News", "title_original": "Stenon bags $20.5m to combat fertilizer price hikes with better nitrogen management", "url": "https://agfundernews.com/stenon-bags-20-5m-to-combat-fertilizer-price-hikes-with-better-nitrogen-management"}, {"id": 72, "public_title": "果樹不能憑感覺修剪：苗木業者解析「疏枝」與「短截」的正確方法及使用時機", "public_summary": "日本農業媒體マイナビ農業「生產技術」專欄，由苗木業者說明果樹剪定中「切り戻し（回縮、疏刪）」與「切り返し（短截）」兩種剪法的原理與用法。", "public_article": "果樹修剪看似只是把過長或雜亂的枝條剪掉，實際上，每一次下剪都會影響後續枝條生長、樹冠採光、病蟲害風險，甚至開花與結果的位置。修剪方法雖然很多，首先需要分辨的，是「疏枝修剪」與「短截修剪」的差異。兩者下剪的位置不同，目的也完全不同。若沒有先想清楚希望留下什麼枝條、引導哪一個芽生長，隨意截斷枝條，反而可能造成傷口不易癒合、枝條枯死，或長出大量難以管理的徒長枝。\r\n\r\n【疏枝修剪】\r\n\r\n疏枝修剪是將枝條剪回枝條基部、枝條分岔處或與主幹連接的位置，不留下突出的殘枝。這種剪法不受枝齡限制，無論是一年生新梢或多年生老枝，只要判斷該枝條不需要保留，都可以從基部剪除。\r\n實務上，以下枝條通常會採用疏枝方式處理：\r\n\r\n* 樹冠內部過度密集、彼此交錯的枝條\r\n* 朝樹冠內側生長的內向枝\r\n* 向下垂落、妨礙管理的下垂枝\r\n* 已衰老、枯弱或生產力下降的枝條\r\n* 破壞預定樹形的枝條\r\n* 影響採光及通風的多餘枝條\r\n\r\n由於這種剪法能直接降低枝條數量，也常被稱為「間引修剪」。\r\n\r\n【短截修剪】\r\n\r\n短截修剪是在新梢或一年生枝的中段下剪，不將枝條整根剪回分岔處。這種剪法通常用於年輕枝條，主要目的不是減少枝條數，而是刺激剪口附近的芽萌發，增加新枝，或調整下一段枝條的生長方向。剪除枝條先端後，原本受到頂芽抑制的側芽較容易萌發。因此，短截修剪經常用於：\r\n\r\n* 增加枝條與葉片數量\r\n* 培養幼樹的骨架枝\r\n* 引導枝條向外或向特定方向生長\r\n* 促進當年生結果枝形成\r\n* 控制樹高並增加樹冠橫向發展\r\n\r\n二年生以上、已有一定粗度的枝條，原則上不應在中段任意鋸斷。粗枝從中間截斷後，切口面積較大，附近又未必有適當的分枝或芽點能持續輸送水分與養分，傷口通常較難癒合，也容易從剪口開始乾枯或腐朽。此外，粗枝遭到強度截短後，樹體常會在剪口周圍萌發多根生長旺盛的徒長枝。這些枝條直立、節間長，容易使樹冠重新變得混亂，後續管理反而更加困難。因此，短截修剪主要適用於一年生枝或仍然年輕、細小的新梢。若是較粗或較老的枝條，通常應尋找適當的分枝位置，以疏枝方式完整剪除，或剪回具有生長能力的側枝。\r\n\r\n【案例：利用兩種剪法降低酪梨樹高】\r\n\r\n設施栽培酪梨時，樹高往往是最棘手的管理問題之一。酪梨生長勢強，若長期不修剪，很快便可能長到二至三公尺以上。樹冠過高、過密後，光線難以進入內部，下層與內側枝條容易逐漸衰弱、枯死，也會增加病蟲害防治、授粉、採收與日常管理的難度。\r\n為控制設施內的樹高，可從幼樹階段便頻繁使用短截修剪，促使枝條橫向生長，再搭配疏枝修剪選留骨架枝，培養超低樹形。樹體高度降低後，枝葉總量及單株產量可能受到影響。不過，設施內若任由樹冠持續擴大，後續的採光、通風與病蟲害管理都會更加困難。因此，可選擇維持較低、較容易操作的樹形，再利用適度短截增加結果枝，使樹體保有一定的結果能力。\r\n\r\n這項原則並不限於酪梨。無論管理哪一種果樹，都應先決定希望培養的樹形，再依據目標選擇剪法。對樹形沒有幫助的枝條，應剪回枝條基部；希望促使新枝萌發時，則需確認芽的位置後進行短截。只要正確運用這兩種剪法，樹冠結構通常會更加穩定，樹體也較容易維持健康。\r\n\r\n【短截不是隨意把枝條剪短】\r\n\r\n短截修剪雖然是在一年生枝中段下剪，卻不代表可以選擇任意位置將枝條截斷。新枝只能從芽點萌發。如果剪口與保留芽之間距離過長，便會留下沒有生長用途的短小殘枝。這段枝條後續缺少芽與葉片拉動水分、養分，容易從剪口向下乾枯，嚴重時甚至可能枯到原本預定保留的芽附近。因此，即使採用短截修剪，也應像疏枝一樣，不留下過長、沒有用途的殘枝。\r\n\r\n正確做法是先決定希望保留哪一個芽，再於該芽上方不遠處下剪。如此一來，新梢可從預定芽點萌發，剪口周圍也較容易形成癒傷組織，使傷口逐漸封閉。\r\n\r\n【為什麼從分岔處剪除比較容易癒合】\r\n\r\n疏枝修剪是在枝條分岔處或枝條基部下剪。這些位置周圍仍有持續運作的枝幹組織，水分與養分流動較為活躍，因此較容易形成癒傷組織，傷口也比較容易封閉。相較之下，若在枝條中段任意截斷，剪口外側已沒有芽、葉片或枝條繼續生長，原本負責輸送水分與養分的部分組織失去作用，剪口附近較容易乾枯。\r\n尤其當剪口距離芽點太遠時，剪口與芽之間會留下一小段枝梢。這一段枝條沒有後續用途，也不容易維持活性，乾枯範圍可能逐漸向下延伸。短截修剪的基本原則，是在欲保留芽的上方留下一點安全距離後下剪。剪得太靠近，可能傷及芽體；距離太遠，又會留下容易乾枯的枝段。\r\n\r\n【剪口角度不必過斜】\r\n\r\n剪口角度同樣會影響傷口癒合。建議依照芽的位置，稍微以斜角下剪，使水分不容易停留在剪口表面，也讓剪口與芽點之間保持適當關係。不過，剪口並非愈斜愈好。斜度過大會增加傷口面積，反而延長癒合時間。只需略微傾斜，不必刻意削出過長的斜面。短截前應先決定「哪一個芽需要保留」，再確認剪口與芽的位置，使水分與養分能持續供應該芽。與其只注意剪刀應該落在哪裡，更重要的是理解剪後的枝條會朝哪個方向生長。\r\n\r\n【短截修剪的關鍵，在於留下哪一個芽】\r\n\r\n短截修剪不只會影響新枝數量，也能利用芽的位置調整枝條方向。枝條通常會朝保留芽所面向的方向生長。因此，希望枝條向樹冠外側展開時，應選擇外芽；不希望枝條繼續伸向樹冠中心，則應避免保留內芽。\r\n\r\n對採用開心形、低樹形管理的果樹而言，判斷芽的位置尤其重要。當樹冠內向枝持續增加，內部容易變得密集，陽光與空氣難以進入。長期下來，內側枝條可能衰弱或枯死，病蟲害發生機率也會提高，採收與田間操作都更加困難。幼樹培養低樹形時，通常會選擇朝外的芽，在外芽上方進行短截。新枝萌發後便會向外生長，使樹冠逐步向四周展開。\r\n\r\n若保留朝上或朝內的芽，長出的枝條往往直立、生長勢較強，容易形成徒長枝。徒長枝偏向營養生長，部分果樹也較不容易在這類枝條上形成花芽。因此，希望降低樹高或使枝條橫向發展時，不宜長期只保留朝上或朝內的芽。不過，內芽並非完全不能使用。當樹勢明顯衰弱，或需要在短時間內培養強壯枝條、恢復樹冠時，也可以刻意保留較直立的芽，利用其生長勢培養更新枝。\r\n\r\n短截修剪能透過芽的位置調整枝條方向與生長強弱。修剪後應持續觀察新枝的反應，逐步累積不同果樹、不同季節與不同樹勢下的管理經驗。\r\n\r\n【修剪的重點，是選擇留下什麼】\r\n\r\n果樹修剪與其說是「把枝條剪掉」，更接近選擇應該留下哪些枝條與芽。下剪前，應先想像修剪後樹體可能產生的反應：哪些芽會萌發、新枝會朝哪個方向生長、樹冠內部是否能獲得足夠光線，以及未來的結果枝應該分布在哪些位置。每一個剪口都應有明確目的，並與整體樹形相互配合。需要移除枝條時，從基部完整疏除；需要增加新枝或引導生長方向時，選定適當芽點後進行短截。掌握這兩種剪法的差異，修剪便不再只是憑經驗刪除枝條，而是有系統地安排樹體下一階段的生長。當修剪目的更清楚，果樹的採光、通風與管理效率也會逐步改善，樹形更穩定，後續栽培與採收也會輕鬆許多。\r\n\r\n\r\n原文標題：【図解】適当な剪定では果樹は育たない！  苗木屋が教える、科学的に正しい「切り戻し」と「切り返し」の方法と使い分け\r\n原始網址：https://agri.mynavi.jp/2026_07_10_543089/", "public_article_format": "text", "public_date": "2026-07-11", "published_date": "2026-07-10", "public_image_url": "https://i.ibb.co/CpnTQJpj/Chat-GPT-Image-2026-7-11-10-18-16.png", "topic": "I_栽培管理", "country": "日本", "language": "日文", "source_org": "マイナビ農業", "title_original": "【図解】適当な剪定では果樹は育たない！  苗木屋が教える、科学的に正しい「切り戻し」と「切り返し」の方法と使い分け", "url": "https://agri.mynavi.jp/2026_07_10_543089/"}];

function home(){
  const intro = `<h1>國際農業科技情報</h1>
    <p class="lead">追蹤美國、日本、歐盟、韓國等地的智慧農業、氣候韌性、植物健康、森林經濟等發展，每週精選並轉譯為可讀的深度文章。本站為個人研究與內容經營用途。</p>
    <h2>最新公開文章</h2>`;
  const items = [...DATA].sort((a,b)=>(b.public_date||'').localeCompare(a.public_date||''));
  const preview = items.slice(0, 6);
  const more = items.length > 6 ? `<p style="text-align:center;margin:16px 0"><a class="tag" onclick="go('#/latest')">查看全部 ${items.length} 篇 →</a></p>` : '';
  return intro + (preview.length?preview.map(card).join(''):'<div class="empty">尚無已發布的公開文章。</div>') + more;
}
function topics(){
  const counts={}; DATA.forEach(a=>counts[a.topic]=(counts[a.topic]||0)+1);
  const cells = Object.keys(LABELS).map(k=>`<a class="card" style="display:block;text-decoration:none" onclick="go('#/topic/${encodeURIComponent(k)}')"><h3>${esc(LABELS[k])}</h3><div class="meta">${counts[k]||0} 篇已公開</div></a>`).join('');
  return `<h1>主題分類</h1><div class="grid">${cells}</div>`;
}
function article(id){
  const a = DATA.find(x=>String(x.id)===String(id));
  if(!a) return '<div class="empty">找不到這篇公開文章。</div>';
  const tags = `<a class="tag" onclick="go('#/topic/${encodeURIComponent(a.topic)}')">${esc(label(a.topic))}</a><a class="tag" onclick="go('#/country/${encodeURIComponent(a.country)}')">${esc(a.country)}</a>`;
  const hero = a.public_image_url?`<a href="${esc(a.public_image_url)}" target="_blank" rel="noopener noreferrer"><img class="hero" src="${esc(a.public_image_url)}" alt="${esc(a.public_title)}" loading="lazy" referrerpolicy="no-referrer"></a>`:'';
  // public_article_format='html' 時 DB 內容已在後台存檔時經白名單過濾，這裡直接信任輸出，不再跳脫
  const body = a.public_article_format==='html' ? `<div class="article-html">${a.public_article}</div>` : `<p>${esc(a.public_article)}</p>`;
  return `<article class="article"><h1>${esc(a.public_title)}</h1>
    <div class="meta"><span>發布日 ${esc(a.public_date)}</span><span>原文語言：${esc(a.language)}</span><span>來源機構：${esc(a.source_org)}</span>${tags}</div>
    ${hero}${body}
    <div class="src"><strong>原始資料來源</strong><br>原文標題：${esc(a.title_original)}<br>
    原始網址：<a href="${esc(a.url)}" target="_blank" rel="noopener nofollow">${esc(a.url)}</a><br>
    發布日期：${esc(a.published_date)}</div></article>`;
}
function render(){
  const h = location.hash || '#/';
  const app = document.getElementById('app');
  let out;
  if(h.startsWith('#/article/')) out = article(decodeURIComponent(h.split('/')[2]));
  else if(h.startsWith('#/topic/')){ const t=decodeURIComponent(h.split('/')[2]); out=listView(label(t), DATA.filter(a=>a.topic===t)); }
  else if(h.startsWith('#/country/')){ const c=decodeURIComponent(h.split('/')[2]); out=listView(c, DATA.filter(a=>a.country===c)); }
  else if(h.startsWith('#/search')){ const q=decodeURIComponent((h.split('?q=')[1]||'')); const ql=q.toLowerCase();
    out=listView('搜尋：'+q, DATA.filter(a=>((a.public_title||'')+(a.public_summary||'')+(a.public_article||'')).toLowerCase().includes(ql)), `找到 ${DATA.filter(a=>((a.public_title||'')+(a.public_summary||'')+(a.public_article||'')).toLowerCase().includes(ql)).length} 篇`); }
  else if(h==='#/latest') out = listView('文章總覽', [...DATA].sort((a,b)=>(b.public_date||'').localeCompare(a.public_date||'')));
  else if(h==='#/topics') out = topics();
  else out = home();
  app.innerHTML = out; window.scrollTo(0,0);
}
function doSearch(e){ e.preventDefault(); go('#/search?q='+encodeURIComponent(document.getElementById('q').value.trim())); return false; }
window.addEventListener('hashchange', render);
render();
</script>
</body>
