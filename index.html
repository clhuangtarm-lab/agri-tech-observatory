<script>
const DATA = [{"id": 192, "public_title": "AI辨識未清洗馬鈴薯，每小時最高分選10公噸", "public_summary": "慕尼黑工業大學(TUM)機械工程系學生Benedikt Keßler以自身馬鈴薯農場背景創立新創公司Karevo，開發以逾10萬張影像訓練的AI光學辨識系統，可在每小時分選10噸馬鈴薯、辨識準確率達95%，能偵測異物及腐爛、龜裂、金針蟲害等7類缺陷，並可直接處理未經清洗的馬鈴薯，適合中小型農場使用。", "public_article": "馬鈴薯分選需要逐顆檢查外觀，作業人員往往得長時間站在充滿噪音與粉塵的環境中。德國新創公司Karevo因此開發AI光學分選設備，透過超過10萬張影像訓練模型，辨識馬鈴薯損傷的準確率達95％，每小時最高可處理10公噸。\r\n\r\n這套設備的另一項特點，是能直接辨識未清洗的馬鈴薯。不同產區的土壤、品種及儲藏條件，會使馬鈴薯表面呈現明顯差異，傳統辨識方法容易受到泥土與外觀變化影響。Karevo則可依農場實際處理的馬鈴薯調整AI模型，提高系統對不同原料狀態的適應性。\r\n\r\n【可辨識異物及7類缺陷】\r\n\r\n馬鈴薯通過輸送帶時，光學系統會拍攝外觀影像，再由AI模型判讀是否需要分流。系統目前可辨識異物，以及腐爛、裂傷、金針蟲危害等7類缺陷，辨識馬鈴薯損傷的準確率達到95％。\r\n\r\n共同創辦人Benedikt Keßler成長於馬鈴薯農場，熟悉人工分選的工作負擔。他在慕尼黑工業大學攻讀機械工程期間，開始構想以AI協助馬鈴薯分選，並於碩士論文研究階段投入技術開發。考量小型及家庭農場常面臨設備價格高、體積大及維修不易等問題，團隊將設備設計得較小型，並採用模組化結構，方便維護及整合至既有分選系統，設備已於2025年秋季進入市場。", "public_article_format": "text", "public_date": "2026-08-15", "published_date": "2026-08-11", "public_image_url": "https://i.ibb.co/m5L9c16H/Chat-GPT-Image-2026-8-15-12-46-06.png", "topic": "A_智慧農業與資料治理", "country": "德國", "language": "英文", "source_org": "Phys.org 農業", "title_original": "Sorting potatoes with AI", "url": "https://phys.org/news/2026-08-potatoes-ai.html"}, {"id": 193, "public_title": "X光斷層掃描解密葉片內部構造，助育種降低作物「蒸散耗水」", "public_summary": "美國伊利諾大學香檳分校團隊利用阿岡國家實驗室粒子對撞機光束線的次世代影像技術，首度精細解析高粱葉片氣孔與內部氣體通道、光合作用中心及葉脈的連結結構，研究發表於《Plant Physiology》，盼藉此培育通風效率更佳、能減少「作物蒸散耗水」並兼顧抗旱能力的新品種。", "public_article": "氣孔變少，葉內通風空間反而變大\r\n\r\n植物進行光合作用時，二氧化碳從葉片氣孔進入，水分也會由同一個出口散失。研究估計，植物每吸收1個二氧化碳分子，約有300至400個水分子從葉內逸散至大氣。晴朗高溫有利於光合作用，卻也會加速水分損失。美國伊利諾大學厄巴納－香檳分校研究團隊因此嘗試減少作物葉片的氣孔數量，希望降低蒸散，同時維持光合作用所需的二氧化碳供應。\r\n\r\n不過，氣孔變少後，二氧化碳是否會更難穿過葉內空氣通道、到達光合作用細胞，成為進一步改良前必須釐清的問題。\r\n\r\n【microCT重建完整高粱葉片內部】\r\n\r\n葉片內部的氣孔、空氣通道、葉肉細胞及葉脈彼此連接，僅靠傳統二維顯微影像，較難掌握完整的三維關係。\r\n\r\n研究團隊使用美國阿岡國家實驗室先進光子源的高強度X光，透過高解析微型電腦斷層掃描（microCT），拍攝完整、存活的高粱葉片。取得連續影像後，再由機器學習協助組合成高解析三維模型。\r\n\r\n這項研究首次詳細呈現高粱葉片表面氣孔，如何連接葉內空氣通道、光合作用細胞與葉脈。\r\n\r\n研究團隊原先預期，減少氣孔後，二氧化碳進入葉內的路徑可能變長、變得更曲折，進而降低傳輸效率。實際影像卻顯示，氣孔較少的葉片，其氣孔下方空氣空間較大。這項內部構造的補償，使二氧化碳在葉內的傳輸導度，與氣孔較多的葉片維持相當。\r\n\r\n換句話說，減少氣孔有機會降低水分散失，卻不一定會同步削弱二氧化碳輸送至光合作用細胞的能力。研究團隊認為，這項結果有利於後續發展水分利用效率較高的作物。\r\n\r\n【上表面氣孔為何位於葉脈上方？】\r\n\r\n研究也發現，高粱葉片上表面的氣孔多位於葉脈上方，而非通常被認為較有利於形成內部空氣空間的葉脈之間。這項排列方式顯示，葉片上下表面的氣孔可能分別承擔不同功能，包括吸收二氧化碳，以及透過水分散失協助葉片降溫。研究團隊後續希望釐清兩側氣孔的分工，並評估如何運用相關構造特性，提高作物水分利用效率。\r\n\r\n目前成果證明的是葉片構造與二氧化碳傳輸的補償關係，尚未等同於田間耐旱、增產或避免乾旱減產的實證結果。相關表現仍需在不同環境及生育階段進一步驗證。", "public_article_format": "text", "public_date": "2026-08-15", "published_date": "2026-08-11", "public_image_url": "https://i.ibb.co/FkMMZrhM/Chat-GPT-Image-2026-8-15-02-07-51.png", "topic": "B_氣候韌性與農業風險管理", "country": "國際", "language": "英文", "source_org": "Phys.org 農業", "title_original": "X-ray analysis reveals the inner life of leaves while advancing engineering efforts to reduce 'crop sweat'", "url": "https://phys.org/news/2026-08-ray-analysis-reveals-life-advancing.html"}, {"id": 197, "public_title": "民間育成葡萄新品種「昭峰」魅力何在？專訪育成者", "public_summary": "日本民間育成的葡萄新品種「昭峰」於2023年首次出貨，源自風味評價高但栽培不易、著色差的「紅環」品種，保留紅環濃郁風味同時改善栽培穩定性；育成者說明著色管理可透過調整遮光讓果實由綠轉黃提升風味，並建議市場出貨時同箱果實顏色應力求一致以利賣相評價。", "public_article": "評估葡萄新品種時，果粒大小、甜度與外觀往往最先受到注意；對實際栽培的農民而言，每串葡萄需要摘除多少果粒、果穗是否容易整形，同樣會影響品種能否擴大栽培。\r\n\r\n日本長野縣葡萄農北澤文康育成的「昭峰」，最初因果粒大、風味佳而入選。經過多年試作後，育成者才逐漸發現，昭峰更明顯的特色是著粒較疏鬆、果穗形狀整齊，能減少摘粒與整穗作業。\r\n\r\n【保留紅環風味，較容易處理成無籽果】\r\n\r\n北澤文康將昭峰形容為「容易栽培、能夠無籽化的紅環」。紅環的味道及香氣受到不少日本葡萄農肯定，但栽培難度較高，著色表現也不穩定；使用吉貝素進行無籽化處理時，反應也不理想。\r\n\r\n昭峰大致承襲紅環的濃郁風味，吉貝素處理的反應則較穩定。果粒通常約10至20公克，若以栽培管理方式追求更大果粒，風味可能相對變淡。\r\n\r\n育成者認為糖度達20度已具良好食用品質；若糖度略低，只要酸度充分下降，仍可呈現適合食用的風味。不過，這是日本育成者的栽培與品評經驗，並非固定採收標準。育成者也特別提醒，應避免為搶早上市而過早採收。\r\n\r\n【果色以黃綠為主，不以紅葡萄定位】\r\n\r\n昭峰雖然偶爾會像紅環一樣出現淡紅色，但育成者並未將其定位為紅色葡萄。果實維持綠色時，風味成熟較慢；適度接受日照、由綠色轉為黃綠或黃色後，風味表現通常較好。\r\n\r\n栽培時可透過調整果穗遮傘，使果實適度接受陽光。不過，成熟度提高後，病害風險也會增加，因此需搭配避雨措施。\r\n\r\n若供應批發市場，育成者建議依果色分級裝箱。黃色、綠色及偶爾著紅的果穗可分別整理，避免同一箱內色差過大，影響陳列時的整體感。\r\n\r\n【著粒疏鬆，減少摘粒剪刀次數】\r\n\r\n昭峰最受育成者重視的生產優勢，是果粒天生排列較疏鬆。一般葡萄每個支梗可能著生7至9粒，整穗時需摘除至2至3粒；昭峰雖然也可能著生6至7粒，但不少果穗一開始便只有2至3粒，農民只需去除形狀異常的果粒。\r\n\r\n支梗之間的距離較長，也使剪刀容易伸入。相較部分夏麝香（Shine Muscat）系品種的支梗容易橫向延伸，昭峰較容易形成肩部飽滿、輪廓整齊的圓筒形果穗，分岔或尾端彎曲的情形也較少。\r\n\r\n花穗整形時，昭峰上方多餘的支梗容易用手指去除，軸部較不會剝裂成毛邊。若產區習慣以剪刀逐一處理，由於支梗不易橫向伸展，操作可能稍微困難；改以手指整理，速度則較快。\r\n\r\n這些差異看似細微，但栽培面積增加後，每串葡萄少剪幾刀，便可能形成明顯的作業時間差距。\r\n\r\n【易發晚腐病，畸形果也較多】\r\n\r\n昭峰的主要弱點是對晚腐病較敏感。育成者在長野縣露天栽培時，尚未認為病害嚴重到無法生產，但在降雨較多的地區，建議至少設置簡易避雨設施。\r\n\r\n其黑痘病抗性略優於夏麝香，但仍可能發病；露菌病在正常防治下相對可控，灰黴病發生則不明顯。由於晚腐病通常較早成為主要問題，避雨仍是栽培管理的重要環節。\r\n\r\n昭峰著粒較少，也可能伴隨較多變形或畸形果，發生比例明顯高於夏麝香，可在摘粒階段一併去除。育成者多年栽培期間未觀察到裂果，但這仍屬目前日本試作經驗，尚不宜推及不同地區與栽培條件。\r\n\r\n【從2012年交配到2023年首次出貨】\r\n\r\n昭峰於2012年完成交配，2013年播種，2015年首次結果。育成者先連續觀察3年，再以嫁接方式繁殖，同時委託友人及具栽培經驗的農民試作，參與人數超過10人、未滿20人。試作者普遍肯定昭峰的風味與栽培操作性，但著色仍是共同面臨的問題。昭峰於2023年首次少量出貨，從交配至進入市場，已累積超過10年的觀察與試作。育成者未在日本申請品種登記，主要考量登記程序可能延後公開與推廣時間，希望昭峰能較快擴大栽培；品種名稱則已在日本辦理商標登記。", "public_article_format": "text", "public_date": "2026-08-15", "published_date": "2026-08-15", "public_image_url": "https://i.ibb.co/pB8KNqxh/Chat-GPT-Image-2026-8-15-01-13-17.png", "topic": "I_栽培管理", "country": "日本", "language": "日文", "source_org": "マイナビ農業", "title_original": "民間から生まれたブドウ最新品種「昭峰」の魅力とは。育成者に話を聞いた", "url": "https://agri.mynavi.jp/2026_08_15_578338/"}, {"id": 200, "public_title": "不經農協、市場出貨，愛媛急傾斜地年賺11億日圓的「一人一票地域協同組合」", "public_summary": "愛媛縣西予市明浜町的農業組織「無茶々園」在難以機械作業的石垣梯田急傾斜地上栽培溫州蜜柑、伊予柑、椪柑等約40個柑橘品種，堅持有機栽培為主的環境保全型農業，栽培規模已擴大至125公頃、涵蓋當地約7成農戶；其核心是以「地域協同組合」為概念的4法人聯合體制，分別負責生產決策、銷售與選果出貨、新農民培育、及高齡福利服務，年營收超過11億日圓，展現不透過農協、市場等傳統通路的自主經營模式。", "public_article": "日本愛媛縣西予市明浜町的柑橘園，沿著海岸陡坡層層向上。石砌梯田坡度大，曳引機不易進入，生產效率與作業條件都不占優勢。無茶々園卻在這片土地上形成125公頃的生產規模，年營收超過11億日圓。支撐這項事業的關鍵，不只在於柑橘栽培或品牌經營，而是一套由農民、職員及不同法人共同參與的決策系統——「地域協同組合」。\r\n\r\n【4類組織分工，重要方針共同決定】\r\n\r\n無茶々園並非單一公司，而是由不同功能的法人組成聯合體。農事組合法人無茶々園由明浜地區58名農民共同加入，負責生產體系、栽培技術交流及農民之間的意見整合；株式會社地域法人無茶々園則承擔銷售、選果出貨、商品開發及財務等非生產工作，使農民能將主要心力放在田間。\r\n\r\n有限會社てんぽ印負責直營農場及新農培育，透過薪資制接納外地移入或缺乏經驗的從農者，在約25公頃的農場中共同生產柑橘、蔬菜及加工品。株式會社百笑一輝則經營日間照顧與付費老人住宅，回應地方高齡化需求。\r\n\r\n統籌這些法人及當地漁業者的「地域協同組合無茶々園」本身不具法人資格，各組織以對等方式派員參與，依「一人一票」決定共同方針。即使只是修改農藥使用標準，也需由20名理事討論，直到所有人形成共識。\r\n\r\n這套程序看似耗時，卻使農民與職員能實際參與決策，也共同承擔執行結果，成為組織在陡坡產地持續經營的重要基礎。\r\n\r\n【不靠拍賣價格，以直販與生協建立穩定通路】\r\n\r\n無茶々園在陡坡栽培溫州蜜柑、伊予柑、椪柑等約40個柑橘品種，並以環境保全型農業為共同方向，優先採用有機栽培規範允許的農藥，將用藥控制在最低程度。這套作法已擴及當地約七成農家。\r\n\r\n減少農藥使用後，果實外觀不一定符合批發市場偏好的規格，因此無茶々園很早便開始尋找理解其栽培價值的消費者。目前個人直販約占三成，顧客規模約1萬人；生協通路約占五成，兩者合計支撐約八成銷售，農協出貨則為零。\r\n\r\n這套通路並非只靠消費者認同維繫。無茶々園設置專業銷售與行政人員，持續蒐集市場資訊，以成本及數據向通路提出合理交易價格。對加入農事組合法人的農民，原則上採全量收購與固定單價，即使市場價格下跌，也盡量維持農家所得穩定。\r\n\r\n【果皮轉為商品，最後回到柑橘園】\r\n\r\n降低對生鮮果品的依賴，也是無茶々園分散農業經營風險的方法。柑橘榨汁後留下的果皮含有芳香成分，團隊將其蒸餾為精油，再開發成yaetoco系列護手霜及入浴用品。\r\n\r\n相關產品的設計、推廣及包裝更新由團隊自行掌握，目前已進入日本各地生活雜貨店及觀光地伴手禮店，銷售據點超過120家。\r\n\r\n果皮也被製成橘子果醬、檸檬胡椒等加工品，最後剩餘的殘渣全部堆肥化，重新回到柑橘園。這套循環將原本需要處理的加工副產物，轉為不同產品及田間資源。\r\n\r\n【交出決策權，讓新人有機會留下】\r\n\r\n2026年，無茶々園的理事會已沒有1974年創立組織的70、80歲成員，連60歲以上理事也不多，決策核心逐步轉向移居者及40歲以下的年輕世代。\r\n\r\n新進人員不必一開始就自行承擔土地、設備與經營風險，而能以受薪員工身分進入てんぽ印，在團隊中學習生產與加工。有人累積經驗後留在直營農場，也有人轉入其他組織工作，形成地方吸引、培育及留住人才的管道。\r\n\r\n【維持生活機能，也是農業經營的一部分】\r\n\r\n無茶々園將地方發展方向整理為「FECWH」：食物（Food）、能源（Energy）、照顧（Care）、工作（Work）及居住（Home）。農業與漁業提供食物，太陽能等措施回應能源需求，照護組織服務高齡居民，直營農場創造就業，廢校利用及生活服務則支撐居住條件。\r\n\r\n明浜町高齡化率超過五成，當地農協超市撤離後，沒有車輛的高齡者及外國技能實習生也可能面臨購物困難。無茶々園因此開始與既有產地直送通路中的零售業者交換資訊，評估由地方自治組織共同推動商店進駐。\r\n\r\n對無茶々園而言，農業能否持續，取決於地方是否還有人居住、工作與生活。地域協同組合的作用，正是把原本分散於生產、銷售、人才、福祉及生活服務的問題，放進同一套共同決策系統中處理。\r\n", "public_article_format": "text", "public_date": "2026-08-15", "published_date": "2026-08-11", "public_image_url": "https://i.ibb.co/4n45Pm94/Chat-GPT-Image-2026-8-15-01-05-17.png", "topic": "G_農村產業創新與六級產業化", "country": "日本", "language": "日文", "source_org": "マイナビ農業", "title_original": "農協・市場の出荷ゼロ。愛媛の急傾斜地で年間11億円を稼ぎ出す「1人1票の地域協同組合」", "url": "https://agri.mynavi.jp/2026_08_11_570291/"}, {"id": 206, "public_title": "健身房也能成為農產直售點，北条蔬果24小時販售", "public_summary": "經營健身房品牌「P・SPO」的三福控股（愛媛縣松山市）與HAPP合作，自7月23日起在旗下門市設置無人直賣所，販售北條產新鮮蔬果（番茄、洋蔥等品項100日圓起），部分門市可24小時購買，規格外農產品也一併販售，目標推動地產地消與減少食物浪費。", "public_article": "健身房除了提供運動空間，也能成為地方農產品接近消費者的新據點。\r\n日本愛媛縣松山市的健身品牌P・SPO與HAPP合作，自2026年7月23日起，在4處營業據點設置無人蔬果直售區，販售北条地區農民生產的當季蔬菜及水果。\r\n\r\n直售區利用健身房24小時營業的特性，使消費者可在運動前後、上下班途中或清晨等不同時段購買農產品。首批商品包含番茄、洋蔥等蔬菜，價格自100日圓起；實際品項與價格會依季節、天候及採收狀況調整。\r\n\r\n【外觀不整齊，也能進入直售通路】\r\n\r\n販售品項除一般規格農產品，也納入形狀或大小略有差異、但品質沒有問題的蔬果。這類產品若不符合既有通路對外觀及規格的要求，可能較難進入一般銷售體系；無人直售區則提供另一個接觸在地消費者的管道。\r\n\r\n這項作法以運用可食農產品、促進地產地消及增加農民販售據點為目的。不過，目前新聞稿並未公布實際銷售量、格外品占比或減少的食品損耗數量，相關效益仍有待後續營運資料驗證。\r\n\r\n【4處據點，每週安排3次為主補貨】\r\n\r\n無人直售區設於以下4處P・SPO據點：\r\n\r\n●ダイノP・SPO土居田店\r\n●P・SPO中央通り店\r\n●P・SPO姫原店\r\n●SPA P・SPO北条店\r\n\r\n相較另設專門店面，這項模式利用既有的24小時營業空間，將農產品帶入居民原本就會前往的生活據點。對地方農民而言，可增加一處小量、彈性的販售管道；對消費者而言，也能在不同時段接觸北条生產的當季蔬果。", "public_article_format": "text", "public_date": "2026-08-15", "published_date": "2026-08-12", "public_image_url": "https://i.ibb.co/845Q81Lg/Chat-GPT-Image-2026-8-15-01-59-53.png", "topic": "F_冷鏈食安與農食供應鏈", "country": "日本", "language": "日文", "source_org": "日本農業新聞", "title_original": "【愛媛・松山】P・SPO、北条産野菜・果物の無人直売所を設置 三福グループ 2026年8月12日 掲載", "url": "https://www.agrinews.co.jp/news/prtimes/399478"}, {"id": 208, "public_title": "益蟲作物保護技術指南", "public_summary": "英國Agricology平台發布由Rothamsted Research研究人員撰寫的技術指南，介紹如何辨識並運用農田中的天敵昆蟲及其他掠食性節肢動物，作為整合式病蟲害管理(IPM)的自然防治手段；指南說明主要天敵類群的生活史與棲地需求，並提出以花帶邊界、樹籬、甲蟲堤、覆蓋作物、減少耕犁與降低廣效殺蟲劑使用等方式營造棲地，附兩則實際農場案例，展示保育型生物防治如何在維持產量同時降低農藥依賴、提升生物多樣性與韌性。", "public_article": "★多種天敵共同工作，防治效果才穩定★\r\n\r\n農田裡的害蟲可能出現在土壤、莖葉或作物上方，也會在不同季節進入田區。若只依賴單一種天敵，即使短期數量很多，也未必能涵蓋所有害蟲、活動位置及發生時間。\r\n\r\n英國Agricology出版的《Beneficial Insects for Crop Protection》指出，天敵至少承擔農田中約五成的害蟲控制作用。其價值來自不同類群的分工：步行蟲與隱翅蟲在土表尋找蟲卵、幼蟲及掉落的蚜蟲；蜘蛛、草蛉幼蟲與寄生蜂在作物冠層活動；瓢蟲及食蚜蠅則能從田埂、樹籬或鄰近棲地快速進入田區。\r\n\r\n【專一性與廣食性天敵扮演不同角色】\r\n寄生蜂等專一性天敵，通常鎖定特定害蟲，能隨著寄主族群增加而發揮控制作用；但牠們需要等害蟲出現後，才有機會繁殖並增加數量。瓢蟲、蜘蛛及步行蟲等廣食性捕食者，可以利用其他昆蟲、花粉或植物性資源維持族群。當目標害蟲尚未大量發生時，牠們已在田區活動，形成第一道防線。\r\n兩類天敵同時存在，才能兼顧害蟲初期的低密度控制，以及族群增加後的持續壓制。\r\n\r\n【地表與飛行天敵相互接手】\r\n\r\n德國冬小麥田間研究發現，相較沒有天敵的對照處理，只有地表天敵時，穀類蚜蟲抑制幅度為18％；只有飛行性天敵時為70％；兩者共同存在時則提高至172％。\r\n其中一項作用方式，是作物冠層的捕食或寄生行為使蚜蟲掉落地面，再由步行蟲、隱翅蟲等地表捕食者接手。不同天敵並非各自處理一部分害蟲，而可能透過前後銜接產生更大的整體效果。\r\n\r\n【多樣性也能分散氣候風險】\r\n\r\n昆蟲活動容易受到溫度與天候影響。某些年份適合瓢蟲繁殖，另一些年份可能有利於其他捕食者或寄生蜂。若田區具備不同活動季節、氣候耐受性與取食方式的天敵，即使其中一類數量下降，其他類群仍可能補上防治缺口。\r\n相關比例及研究結果來自英國與歐洲農田，實際表現仍會受到作物、害蟲、氣候及地景條件影響。\r\n\r\n★★花帶只是起點，留住天敵要從三個尺度著手★★\r\n\r\n在田邊種植花帶可以提供花粉、花蜜與棲息空間，但天敵若無法安全越冬、移動進入田區，或進入後又受到耕作與藥劑干擾，花帶的作用仍會受到限制。保育型生物防治的重點，是改善農場環境，支持原本已存在於田區及周邊的捕食者與寄生性天敵。指南將相關措施分為農場尺度、田區尺度及日常管理三個層次。\r\n\r\n【農場尺度：串聯越冬與覓食棲地】\r\n\r\n農作區會反覆經歷耕作、用藥與採收，樹籬、草生田埂、林地、休耕區及濕地等半自然棲地，則能提供較穩定的越冬、繁殖及避難空間。地表活動的天敵需要連續的草帶、田埂或甲蟲堤等廊道；飛行距離有限的昆蟲，則可利用分散的棲地斑塊作為移動中的「踏腳石」。\r\n研究估計，半自然棲地約占農業地景20％時，較能支持有效的生物防治；在景觀較單一的農業區，8％至10％已可產生可測量的天敵、害蟲控制及經營效益。這些數值是歐洲研究結果，不是所有農場均須套用的固定門檻。\r\n\r\n【田區尺度：把資源帶進作物內部】\r\n\r\n花帶、田間植被帶、覆蓋作物、間作及伴生作物，可以增加植被結構、調整微氣候，並提供替代食物，使天敵由田緣進入作物內部。英國白金漢郡一座商業農場，將3％的田緣改為野花、草類及其他非作物植被。在五年輪作期間，整體產量得以維持或提高，天敵數量也有所增加，顯示棲地營造未必會降低全場生產力。\r\n\r\n【日常管理：避免破壞已建立的族群】\r\n廣效性殺蟲劑會同時影響害蟲與天敵，而天敵族群通常恢復得較慢。以英國油菜研究為例，各季節皆有不同天敵活動，很難找到完全不影響天敵的施藥時段。當用藥確有必要時，指南建議可評估在飛行性天敵較少活動的傍晚處理，並保留未施藥避難區。這些作法只能降低部分影響，仍應依當地核准標示、害蟲密度及田間監測結果判斷。\r\n\r\n土壤耕作也可能破壞地表捕食者的棲地、越冬巢穴及寄生蜂的繭。減少耕擾、保留地表殘體及增加有機質，可改善步行蟲、隱翅蟲、蜘蛛與蠼螋的生存條件。\r\n\r\n★★★從土表到空中，不同天敵接手不同害蟲★★★\r\n\r\n農田中的有益生物不全是昆蟲。蜘蛛、蟎、蜈蚣及盲蛛等節肢動物，也會捕食農業害蟲。牠們分布於土表、莖部、作物冠層及空中，共同形成多層次的防線。\r\n\r\n【土表捕食者攔截蟲卵與幼蟲】\r\n\r\n步行蟲可捕食蛞蝓、蝸牛、害蟲甲蟲、毛毛蟲、地下幼蟲、蚜蟲及雜草種子；隱翅蟲則會取食土壤中的害蟲卵、幼蟲，以及小型軟體動物。捕食蟎體型僅約0.2至0.5毫米，可捕食薊馬、粉蝨、葉蟎及部分葉甲。田間除了可購買的生物防治種類，也存在許多自然族群。蜈蚣與盲蛛則會捕食小型昆蟲、幼蟲及其他節肢動物。\r\n這些地表天敵需要覆蓋作物、草生田埂、有機質及較少受擾動的土壤環境。\r\n\r\n【莖部與冠層是另一個捕食區域】\r\n\r\n蜘蛛可能結網，也可能主動追逐獵物，取食害蟲甲蟲、蚜蟲、飛蛾及椿象等。螞蟻會捕食多種昆蟲，但部分種類也可能保護分泌蜜露的蚜蟲，因此實際作用會因物種及田間關係而異。作物冠層中，瓢蟲主要捕食蚜蟲，也會取食介殼蟲、粉蝨及粉介殼蟲。草蛉幼蟲的食性廣，一隻幼蟲可取食約200至300隻蚜蟲；食蚜蠅成蟲利用花粉與花蜜，幼蟲則捕食蚜蟲、介殼蟲、木蝨、蟎及粉蝨。\r\n寄生蜂會將卵產在特定寄主體內或體表，幼蟲發育過程使寄主死亡。部分種類專門寄生穀類或十字花科作物的蚜蟲，也有種類寄生蛾類蟲卵或跳甲幼蟲。\r\n\r\n【飛行捕食者處理空中的昆蟲】\r\n\r\n食蟲虻、長足虻及舞虻等會在空中或植株表面捕捉其他昆蟲。蜻蜓與豆娘主要在水域繁殖，成蟲則會捕食蚊、蚋、蠅及其他飛行性昆蟲。因此，池塘、濕地、樹籬、草地及花源豐富的田緣，各自支持不同類群。若棲地只提供單一資源，便難以涵蓋從土表到空中的完整天敵組合。\r\n\r\n★★★★先建立棲地，兩座英國農場再逐步停用殺蟲劑★★★★\r\n\r\n停用殺蟲劑並不是兩座英國農場轉型的第一步。Papley Grove與Hope Farm皆先花費多年建立樹籬、草生田埂、花帶及其他棲地，再配合監測逐步調整耕作及用藥方式。\r\n\r\n【Papley Grove：一次沒有施藥的觀察改變管理方向】\r\n\r\nPapley Grove是英國劍橋郡一座165公頃的農場，以冬小麥、大麥、冬豆及油菜等旱作為主。農場從草生田埂與新植樹籬開始，之後增加花源豐富的田緣、花粉與花蜜植物，以及穿越田區的植被帶。\r\n\r\n一次冬豆田蚜蟲大量發生時，農場原本準備施藥，卻發現鄰近田緣棲地的區域幾乎沒有蚜蟲；隨著走向缺乏棲地的田區另一端，蚜蟲數量才明顯增加。農民觀察到瓢蟲、草蛉及其他捕食者正在取食害蟲，因此決定不施藥，最後也未發現產量受損。\r\nPapley Grove停用殺蟲劑已超過13年。農場的經驗顯示，單一誘集作物未必是主要原因，整體棲地與管理系統更可能影響害蟲及天敵比例。\r\n\r\n【Hope Farm：先建立天敵網絡，再於2018年停用】\r\n\r\nHope Farm面積181公頃，由英國皇家鳥類保護協會於2000年購入，希望驗證農業生產、野生動物保育及經營收益能否並行。\r\n農場先逐步增加花帶、樹籬、甲蟲堤、覆蓋作物、伴生作物、草本牧草地、灌叢及池塘，輪作作物也由原本三年三作物增加至六種。建立多年的棲地網絡後，農場於2018年開始停用殺蟲劑。\r\n\r\n在一項油菜試驗中，誘集作物內的跳甲幼蟲數量，是油菜與伴生作物處理的四倍，顯示搭配誘集與伴生作物，可降低作物脆弱階段承受的害蟲壓力。\r\n\r\nHope Farm也持續進行標準化監測。繁殖鳥類數量增加約200％，蝴蝶指數的長期趨勢約比2001年基準高200％。這些指標反映整體棲地與生物多樣性改善，不能直接等同於天敵防治成效。\r\n\r\n", "public_article_format": "text", "public_date": "2026-08-15", "published_date": "2026-07-22", "public_image_url": "https://i.ibb.co/gZcjhjXS/Chat-GPT-Image-2026-8-15-01-43-53-1.png", "topic": "C_IPM植物健康與農藥減量", "country": "國際", "language": "英文", "source_org": "agricology.co.uk", "title_original": "Beneficial Insects for Crop Protection Technical Guide - Agricology", "url": "https://agricology.co.uk/resource/beneficial-insects-for-crop-protection-technical-guide/?fbclid=IwY2xjawTj7K5wZG9mBGV4dG4DYWVtAjExAHNydGMGYXBwX2lkDzQwOTk2MjYyMzA4NTYwOQABHhOt97P06tFp21ngAe39op4G4aPsIR-PSayRCOUtksukMGNEBBOBkrIW-Pgc_aem_1QJWre3Nk33SJT-xb509WQ"}, {"id": 165, "public_title": "東北大學發現新分子類別，可增強植物耐旱性且不損害生長", "public_summary": "日本東北大學領軍的國際研究團隊發現一類新型小分子，能增強植物耐旱能力，且不會如脫落酸（ABA）那樣引發種子休眠、生長抑制等副作用，研究發表於《Nature Communications》。", "public_article": "關閉氣孔，也不會讓生長停下來？新型小分子提升植物耐旱性\r\n\r\n乾旱時，植物會合成離層酸（abscisic acid, ABA），促使葉片氣孔關閉，減少水分散失。這項反應有助於植物保存水分，卻也可能造成種子休眠、發芽延遲與生長受抑制。日本東北大學領導的國際研究團隊，找到兩種可促進氣孔關閉的小分子，初步試驗顯示能提升植物耐旱性，且未造成上述明顯副作用。\r\n\r\n【從控制氣孔開啟的KAT1著手】\r\n\r\n研究團隊以模式植物擬南芥（Arabidopsis thaliana）為材料，將目標鎖定在KAT1鉀離子通道。KAT1會調節鉀離子（K⁺）進入保衛細胞，促使氣孔開啟；若能抑制KAT1，便可能在乾旱環境下幫助氣孔保持關閉。\r\n\r\n透過電生理化合物篩選，研究人員找到小分子NS5806，並調整其化學結構，合成衍生物UA49。將兩種化合物施用於葉片表皮後，皆可促使氣孔關閉並抑制氣孔開啟；以葉面方式施用，也能提高植株在乾旱條件下的耐受性。\r\n\r\n值得注意的是，NS5806與UA49的作用不同於直接施用ABA。試驗中，兩種化合物未造成種子發芽延遲或根系生長受到抑制，顯示其可能在節水與維持生長之間取得較好的平衡。\r\n\r\n【可能涉及不同於ABA的鈣離子訊息傳遞】\r\n\r\n為釐清作用機制，研究團隊比較正常植株與缺乏KAT1通道的植株，並觀察保衛細胞內的鈣離子（Ca²⁺）濃度變化。\r\n\r\n正常植株施用NS5806或UA49後，保衛細胞出現持續性的鈣離子流入；缺乏KAT1的植株則未出現相同反應。這項結果顯示，鉀離子通道活性的調節可能與細胞內鈣離子訊息傳遞密切相關，也提出K⁺通道可能參與訊息傳遞的新方向。\r\n\r\n【距離主要作物應用仍需進一步驗證】\r\n\r\nNS5806與UA49在擬南芥試驗中提升了耐旱性，且相較於ABA，未出現發芽延遲及根系生長抑制等明顯影響，因此具有作為植物生物刺激素候選成分的潛力。\r\n\r\n不過，目前研究仍以模式植物為主。這些化合物能否在主要農作物發揮相同效果，以及適用濃度、持續時間、施用方式與環境影響，仍有待後續研究確認。", "public_article_format": "text", "public_date": "2026-08-08", "published_date": "2026-08-05", "public_image_url": "https://i.ibb.co/Gfyywjj1/Chat-GPT-Image-2026-8-8-01-05-25.png", "topic": "B_氣候韌性與農業風險管理", "country": "國際", "language": "英文", "source_org": "Phys.org 農業", "title_original": "New molecule class creates hardy, drought tolerant plants", "url": "https://phys.org/news/2026-08-molecule-class-hardy-drought-tolerant.html"}, {"id": 166, "public_title": "賓州州立大學：無土栽培系統設計會左右微生物生態與作物影響", "public_summary": "賓州州立大學研究團隊分析5種水耕無土栽培系統的細菌相，發現系統設計會強烈影響養液中的微生物組成，栽培週期也顯著影響微生物群落結構，顯示不同系統需要各自的微生物管理策略。", "public_article": "無土栽培系統不同，營養液中的微生物也會不同？\r\n\r\n無土栽培利用營養液取代傳統土壤，可因應水資源與土地限制，也廣泛應用於番茄、葉菜及香草等作物。然而，營養液若採循環使用，微生物可能隨水流擴散；其中有些有助於植物生長，有些則可能增加病害或食品安全風險。\r\n\r\n美國賓州州立大學研究團隊比較5種無土栽培系統，發現系統設計與栽培週期都會影響營養液中的細菌量及菌相組成，但營養液的差異未直接反映在青江菜葉片的細菌量上。\r\n\r\n【5種系統的微生物組成各有差異】\r\n\r\n研究團隊以青江菜進行試驗，比較5種無土栽培方式：\r\n1. 深水式水耕：根系直接浸在含氧營養液中\r\n2. Kratky式：不使用幫浦的被動式水耕\r\n3. 養液薄膜技術（NFT）：薄層營養液持續流過根部\r\n4. 潮汐式：定期讓根部浸水及排水\r\n5. 滴灌式：將營養液滴至根部\r\n\r\n研究人員一方面測量營養液中的細菌濃度，並利用16S rRNA基因定序分析菌相組成；另一方面，也直接檢測青江菜葉片上的細菌量，了解營養液中的細菌是否會轉移至葉片。\r\n\r\n結果顯示，不同系統的營養液具有不同的細菌量與菌相組成，其中滴灌系統的細菌量最高。微生物組成也會隨栽培週期改變，但部分細菌類群在各週期持續出現，顯示它們可能較能適應無土栽培環境。此外，營養液pH值較高時，細菌量相對較低。\r\n\r\n【營養液細菌量不同，葉片細菌量卻相近】\r\n\r\n儘管5種系統的營養液細菌量明顯不同，各系統青江菜葉片上的細菌量卻相近。這表示營養液中的微生物量，未必會直接轉化為葉片污染程度。\r\n\r\n不過，細菌量較高的系統是否也更有利於食源性病原菌存活，目前仍無法確定。研究測量的是整體細菌量與菌相組成，不能直接將細菌總量較高解讀為食品安全風險較高。\r\n\r\n【微生物管理可能需要依系統調整】\r\n\r\n無土栽培中的微生物可能參與養分循環、植物生長與病害抑制，也可能在病原菌進入循環營養液後協助其擴散。由於不同系統及栽培週期呈現不同的微生物變化，各類無土栽培設施可能需要採取不同的微生物管理方式。\r\n\r\n研究團隊認為，後續仍需釐清系統設計與操作方式如何影響食源性病原菌的存活及持續存在，才能進一步作為無土栽培管理與規範研擬的依據。", "public_article_format": "text", "public_date": "2026-08-08", "published_date": "2026-08-05", "public_image_url": "https://i.ibb.co/prXRqZq6/Chat-GPT-Image-2026-8-8-01-10-57.png", "topic": "C_IPM植物健康與農藥減量", "country": "美國", "language": "英文", "source_org": "Phys.org 農業", "title_original": "Soilless farming system design can determine microbial growth, impact on crops", "url": "https://phys.org/news/2026-08-soilless-farming-microbial-growth-impact.html"}, {"id": 167, "public_title": "拉籌伯大學：耐旱黑麥草演化出新特性，為除草帶來新挑戰", "public_summary": "澳洲拉籌伯大學研究發現，澳洲穀物田最具破壞力的雜草「一年生黑麥草」能調整生長與繁殖方式以適應乾旱逆境，隨氣候變異加劇，這種適應力可能讓除草管理更加困難，該雜草估計每年造成穀物產業9,300萬美元損失。", "public_article": "中度缺水反而長得更旺？抗藥性一年生黑麥草展現耐旱調適能力\r\n\r\n一年生黑麥草（Lolium rigidum）是澳洲穀物生產系統中危害嚴重的雜草，具有競爭力強、種子產量高及除草劑抗藥性普遍等特性。澳洲拉籌伯大學研究發現，部分族群可調整生長與繁殖方式因應乾旱；其中抗藥性族群在中度缺水時，生長甚至比土壤水分飽和時更旺盛。\r\n\r\n【中度缺水未必抑制雜草生長】\r\n\r\n研究團隊在溫室控制環境下，比較除草劑抗藥性與感受性族群，在不同土壤水分條件下的生長反應。\r\n\r\n結果顯示，中度水分限制並未單純壓低一年生黑麥草的生長。抗藥性族群在部分條件下，葉片數最多增加132%，分蘗數最多增加153%，顯示適度缺水可能刺激其生長。\r\n\r\n研究人員也觀察到，一年生黑麥草可彈性調整開花時間，並在水分逆境下維持較高的葉片含水量，這些特性可能有助於其在缺水環境中持續生存。\r\n\r\n【嚴重乾旱下仍能存活並產生種子】\r\n\r\n當缺水程度加劇，抗藥性族群的株高、根部與地上部生物量，以及種子產量最多下降約50%。然而，植株並未完全停止生長，仍可存活並繁殖。\r\n\r\n研究團隊指出，抗藥性族群未出現明顯的適存性代價，在水分逆境下的表現甚至較好。這表示農民可能同時面對具有除草劑抗藥性及耐旱調適能力的雜草，即使在較乾燥的生產季節，也不能假設其危害會自然降低。\r\n\r\n【雜草管理需考量族群與季節差異】\r\n\r\n不同一年生黑麥草族群對缺水的反應不盡相同，因此很難以單一方法因應所有產區與生產季節。了解當地族群在不同水分條件下的生長及繁殖變化，有助於調整管理時機，降低種子產生與土壤種子庫累積。\r\n目前研究是在控制環境下進行，後續仍需納入更多族群，並透過田間試驗確認不同季節與環境條件下的反應。", "public_article_format": "text", "public_date": "2026-08-08", "published_date": "2026-08-05", "public_image_url": "https://i.ibb.co/5XKx13t8/Chat-GPT-Image-2026-8-8-01-19-12.png", "topic": "C_IPM植物健康與農藥減量", "country": "澳洲", "language": "英文", "source_org": "Phys.org 農業", "title_original": "Drought-hardy ryegrass raises new weed management challenge", "url": "https://phys.org/news/2026-08-drought-hardy-ryegrass-weed.html"}, {"id": 168, "public_title": "多年生生質能草類初步恢復美國中西部因玉米連作流失的土壤碳", "public_summary": "伊利諾大學香檳分校研究團隊比較芒草、柳枝稷等多年生生質能作物與玉米大豆輪作田、原生草原的土壤有機碳含量，發現近200年玉米為主的農業已使中西部土壤有機碳較原生草原減半，改種多年生生質能草類有助部分恢復土壤碳儲量。", "public_article": "改種多年生能源草，土壤碳開始回升？\r\n\r\n美國中西部近200年來以玉米為主的農業生產，使土壤有機碳存量相較於當地原生高草草原大幅減少。美國伊利諾大學研究團隊發現，將原本種植玉米、黃豆等一年生作物的農地，改種芒草與柳枝稷等多年生能源作物，可能逐步回補流失的土壤碳。\r\n\r\n【多年生能源作物的土壤碳高於玉米田】\r\n\r\n研究團隊在美國伊利諾州比較原生草原、玉米耕作系統，以及種植未滿11年的7處多年生能源作物系統，並以等量土壤質量為基準，計算地表至1公尺深的土壤有機碳存量。\r\n\r\n各類土地的平均土壤有機碳存量為：\r\n1. 原生草原：每公頃146公噸碳\r\n2. 芒草：每公頃107公噸碳\r\n3. 柳枝稷：每公頃97.9公噸碳\r\n4. 玉米：每公頃87.7公噸碳\r\n芒草與柳枝稷田的土壤有機碳存量均高於玉米田，但仍未恢復至原生草原水準。\r\n\r\n【7處試驗田中有4處開始增加】\r\n\r\n研究人員進一步追蹤芒草與柳枝稷田5年間的變化，結果發現，7處試驗地點中有4處的土壤有機碳增加。碳同位素（δ¹³C）分析也確認，表層土壤中新增加的碳來自芒草與柳枝稷。\r\n\r\n這項結果顯示，即使每年採收地上部作物，多年生能源作物仍可能透過根系及其他植物碳輸入，逐步累積土壤有機碳，減少長期種植一年生玉米造成的土壤碳缺口。\r\n\r\n不過，研究中的多年生作物栽培年限尚未超過11年，且只有部分地點在前5年呈現增加。土壤碳能否持續累積，以及需要多久才能接近原生草原水準，仍需長期追蹤。", "public_article_format": "text", "public_date": "2026-08-08", "published_date": "2026-08-04", "public_image_url": "https://i.ibb.co/TqKDvdky/Chat-GPT-Image-2026-8-8-01-24-14.png", "topic": "E_低碳農業土壤與循環生物經濟", "country": "美國", "language": "英文", "source_org": "Phys.org 農業", "title_original": "Perennial bioenergy grasses begin rebuilding Midwest soil carbon lost to maize", "url": "https://phys.org/news/2026-08-perennial-bioenergy-grasses-rebuilding-midwest.html"}, {"id": 170, "public_title": "了解葉片表面特性，能否開發新的作物病害防治方法？", "public_summary": "阿德雷德大學研究團隊以生物介面研究方法，把焦點從無差別噴灑殺菌劑轉向植物與真菌互動的起點——葉片表面本身的蠟質特性，盼藉此開發更精準的真菌病害防治新途徑，研究發表於《Biointerphases》。", "public_article": "葉片表面可能是阻斷病菌感染的起點？\r\n\r\n真菌性病害可能嚴重影響穀類作物生產，目前主要透過殺菌劑預防與控制。澳洲阿德雷德大學研究團隊則從病原菌最初接觸作物的位置著手，將植物病害視為「生物界面」問題，探討葉片表面的化學與物理特性如何影響真菌辨識寄主及開始萌發。\r\n\r\n【葉面蠟質可能參與寄主辨識】\r\n\r\n葉片外層具有天然的蠟質角質層，主要功能是保護植物免受外界環境影響。近年研究也顯示，這層表面可能向其他生物傳遞訊號，其中包括白粉病菌等病原菌。\r\n\r\n為了分開檢視蠟質的化學作用與葉片結構的幾何效應，研究人員將葉片角質層蠟質塗覆於非生物表面，再觀察兩種白粉病菌的反應。\r\n\r\n結果顯示，兩種白粉病菌都能在蠟質塗層上萌發。即使缺少葉片本身的立體結構，蠟質仍可觸發真菌生長，顯示葉面化學成分可能參與病原菌辨識寄主的過程。\r\n\r\n【感染過程不只受到蠟質影響】\r\n\r\n病原菌能否成功感染，仍取決於多項條件的共同作用，包括葉面粗糙度、潤濕性及環境條件等。這些因素之間也可能彼此促進或抵銷，因此不能僅依蠟質反應推論實際感染結果。\r\n\r\n研究團隊希望進一步找出病原菌辨識寄主時使用的特定表面訊號，並了解是否能干擾或阻斷這些訊號，使病原菌在感染建立前無法辨識寄主。\r\n\r\n不過，目前成果主要用於確認葉面蠟質可能參與白粉病菌萌發，尚未提出可直接應用於田間的防治方法，也不能視為已能取代殺菌劑。後續仍需結合化學、植物科學、真菌病理學及材料科學，釐清不同表面與環境因素的交互作用。", "public_article_format": "text", "public_date": "2026-08-08", "published_date": "2026-08-04", "public_image_url": "https://i.ibb.co/C3pq0qMp/Chat-GPT-Image-2026-8-8-01-30-31.png", "topic": "C_IPM植物健康與農藥減量", "country": "國際", "language": "英文", "source_org": "Phys.org 農業", "title_original": "Could understanding leaf surfaces lead to new ways to prevent crop disease?", "url": "https://phys.org/news/2026-08-leaf-surfaces-ways-crop-disease.html"}, {"id": 172, "public_title": "澳洲新創BioScout開發真菌病原體早期預警系統", "public_summary": "澳洲新創公司BioScout以AI驅動的即時孢子偵測系統提醒農民真菌病害風險，完成675萬澳幣（約480萬美元）種子輪募資，將擴大歐洲市場並把全球感測器網絡從250台增至2029年的1,000台，取代傳統定期噴藥、改採即時偵測降低過度用藥風險。", "public_article": "作物還沒出現病斑，AI先從空氣中找到真菌孢子？\r\n\r\n作物出現病斑時，真菌病原菌可能已完成一次繁殖週期，並開始向田間擴散。澳洲新創公司 BioScout 因此開發以人工智慧辨識空氣中真菌孢子的早期預警系統，希望在肉眼看見病徵前，協助農民掌握病原菌濃度與感染風險。\r\n\r\nBioScout近期完成675萬澳幣種子輪募資，計畫擴大歐洲市場，並在2029年前將全球感測器數量由250部增加至1,000部。\r\n\r\n【自動採集空氣，透過AI辨識孢子】\r\n\r\nBioScout的田間感測器會持續吸入空氣，將真菌孢子、花粉及其他懸浮微粒捕捉在透明膠帶上。每個採樣週期結束後，膠帶會自動移至顯微鏡下，拍攝數百張高解析影像，再傳送至公司系統，由訓練完成的AI模型進行辨識。\r\n\r\n每部感測器可監測40種以上的空氣傳播威脅。分析結果也會結合溫度、濕度、氣壓、降雨量、風速及風向，評估接下來幾天的感染風險。\r\n\r\n系統不只判斷是否偵測到病原菌，也會追蹤孢子濃度及其隨時間的變化。短暫升高可能只是孢子從其他地區隨風飄入；若不久後再次上升，則可能表示病原菌已在當地完成一輪生活史。\r\n\r\n【預警重點是協助判斷防治時機】\r\n\r\n目前許多農民依照固定週期預防性施用殺菌劑，原因是作物出現明顯病徵後，防治難度及成本往往已經提高。BioScout希望透過孢子濃度預警，協助農民決定何時巡田、是否需要防治，也能輸入既有施藥紀錄，觀察施藥後病原菌壓力是否下降。\r\n\r\n公司表示，部分農場可減少約一半的例行殺菌劑處理；紐西蘭一項個案每公頃約節省500美元。不過，這些數字屬於公司宣稱及個別案例，不能視為所有作物與產區都能達到的固定成效。\r\n\r\n對於不願減少預防性施藥的農民，系統也可作為風險監測工具。報導提到，一處葡萄園雖持續噴藥，灰黴病菌孢子濃度仍不斷上升，最後損失價值約100萬美元的葡萄；事後檢視資料，已可從濃度變化看出原有防治措施未能壓低病原菌壓力。\r\n\r\n【不同作物需要不同的感測密度】\r\n\r\n感測器的配置密度取決於作物與病原菌的傳播特性。在澳洲穀物產區，鏽病菌孢子可隨風傳播相當長的距離，BioScout估計每隔約30公里設置一部設備，即可能提供區域監測資訊；葡萄園的露菌病傳播距離較短，可能每100公頃就需要一部。\r\n\r\n目前系統已應用於歐洲、南非、澳洲、紐西蘭及美國的馬鈴薯產區，也正拓展巴西黃豆市場及溫室應用。公司並開始探索如何整合天氣、施藥紀錄、田間觀察與農民筆記，進一步分析病害發生原因及改善預警內容。\r\n\r\nBioScout將這套系統形容為「作物病害的颶風或龍捲風警報」：重點不是等到病害發生後才確認，而是從空氣中的孢子變化提早看見風險。不過，預警資料仍需配合作物生育狀況、田間觀察及專業判斷，才能轉化為實際的防治決策。", "public_article_format": "text", "public_date": "2026-08-08", "published_date": "2026-08-07", "public_image_url": "https://i.ibb.co/20YHHzk0/Chat-GPT-Image-2026-8-8-01-40-09.png", "topic": "C_IPM植物健康與農藥減量", "country": "國際", "language": "英文", "source_org": "AgFunder News", "title_original": "BioScout raises $4.8m for early warning system for fungal pathogens", "url": "https://agfundernews.com/bioscout-raises-4-8m-for-early-warning-system-for-fungal-pathogens"}, {"id": 181, "public_title": "熊本地震下，跨區調度如何避免生乳大規模廢棄？", "public_summary": "7月28日熊本地震發生後，當地遭遇最大震度7的強烈搖晃。熊本縣是日本西部最大的酪農產區，地震造成熊本縣酪農業協同組合聯合會及部分乳業工場停止運作，生乳運輸也一度受阻。然而，災後10天內，由指定生乳生產者團體受託收運的生乳，並未發生廢棄情形。", "public_article": "熊本地震下，跨區調度如何避免生乳大規模廢棄？\r\n\r\n7月28日熊本地震發生後，當地遭遇最大震度7的強烈搖晃。熊本縣是日本西部最大的酪農產區，地震造成熊本縣酪農業協同組合聯合會及部分乳業工場停止運作，生乳運輸也一度受阻。然而，災後10天內，由指定生乳生產者團體受託收運的生乳，並未發生廢棄情形。\r\n\r\n這次應變凸顯指定團體在緊急狀況下的集乳與供需調度功能。中央酪農會議指出，指定團體透過集乳體系與多元銷售管道，降低生乳處理陷入混亂的風險；J-Milk也認為，災害期間由產業共同支援的「互助」機制，是維持酪農與乳業發展的重要基礎。\r\n\r\n【每日600噸生乳，跨區物流共同支援】\r\n\r\n熊本縣每天約有600噸生乳需要處理。當縣內乳業工場無法完全承接，如何將生乳長距離運往其他地區，成為主要問題。\r\n\r\n九州生乳販賣農業協同組合聯合會依各乳業工場受損情形，安排縣內外的生乳處理；JA全農等全國性組織也加入協調，擴大跨區供需調度。北海道的Hokuren及關東生乳販賣農業協同組合聯合會等東日本指定團體，則派出大型乳罐車與駕駛支援運輸。\r\n\r\n透過全國規模的物流協作，原本可能因工場停擺而無處可去的生乳，得以轉往其他地區處理。相較之下，未經指定團體、自行安排銷售與運輸的生乳，在災害期間較難即時找到替代的處理管道，也可能面臨較高的廢棄風險。\r\n\r\n【災害應變成為畜安法修法討論焦點】\r\n\r\n日本預計自秋季起，配合2027年度畜產及酪農政策討論，進一步研議《畜產經營安定法》（簡稱畜安法）修正方向。討論重點在於，如何建立由酪農戶及產業相關單位共同參與生乳供需調度的制度。\r\n\r\n目前提出的方向包括，將加工原料乳補給金納入「交叉遵循」（cross-compliance）機制，把參與供需調度列為取得補助的條件；另一項則是強化酪農戶共同遵守的出貨規範，改善少量、分散向不同管道出貨，導致指定團體集乳成本增加的問題。\r\n\r\nJA集團北海道進一步主張，除在補助制度中導入供需調度條件，中央政府也應承擔調節生乳供需的責任。\r\n\r\n熊本地震期間的應變，呈現指定團體在集乳、跨區運輸與供需協調上的作用。後續日本畜安法修正討論，也將聚焦如何促使指定團體以外的生乳流通業者，共同納入供需調度機制。", "public_article_format": "text", "public_date": "2026-08-08", "published_date": "2026-08-06", "public_image_url": "https://i.ibb.co/RpPDNXmd/Chat-GPT-Image-2026-8-8-12-55-54.png", "topic": "H_農食系統與公共治理", "country": "日本", "language": "日文", "source_org": "JAcom 農業協同組合新聞", "title_original": "【畜安法改正論議】熊本地震で指定団体機能 生乳廃棄回避へ成果 伊本 克宜 （農政ジャーナリスト）", "url": "https://www.jacom.or.jp/articles/bWRRdlfWEWngO0BlJkDox"}, {"id": 190, "public_title": "NARO生育與產量預測工具：從環境資料到產量預測，實證增產17％", "public_summary": "プレスリリース(研究成果) 「NARO生育・収量予測ツール」を組み込んだ営農支援アプリケーションの社会実装\r\n\r\n農業データ連携基盤「WAGRI1)」で公開している農研機構開発のAPI2)「NARO生育・収量予測ツール①果菜類」を活用し、持続未来株式会社が生産者向け営農支援アプリケーションを開発しました。\r\n\r\n「NARO生育・収量予測ツール」を組み込んだ生産者向けアプリケーションのサービス提供は、国内初となります。\r\n\r\n本APIの生産現場での有効性は、広島県が実施する「ひろしま型スマート農業推進事業(ひろしまseedbox)」における実証を通じて確認され、その成果を基に本アプリケーションが開発されました。\r\n\r\n本アプリケーションを使うことで、施設野菜の生育や収量の予測結果をグラフとして確認でき、データに基づく栽培管理を支援します。\r\n\r\n農研機構の研究成果を活用したアプリケーションが生産現場で活用される", "public_article": "從環境資料到產量預測，廣島溫室實證增產17％\r\n\r\n設施蔬菜的生育與產量，會受到溫度、濕度、二氧化碳濃度及日射量等環境條件影響。生產者雖然可以透過設備調控溫室環境，但要判斷不同設定會帶來多少產量變化，過去仍相當依賴個人經驗。\r\n\r\n日本農研機構因此開發「NARO生育與產量預測工具」，只要輸入環境資料，以及葉寬、葉長、葉片數與著果數等生育資料，即可模擬作物的生育量及產量。相關API分為果菜類、草莓及露地蔬菜三類，並透過日本農業資料連結平台WAGRI提供使用。\r\n\r\n【先模擬不同條件，再決定環境控制方式】\r\n\r\n農研機構與持續未來株式會社透過廣島縣「廣島型智慧農業推動事業」，在吳市一處設有環境監測及控制系統的番茄溫室進行實證。\r\n\r\n研究團隊自2021年度起持續記錄溫度、二氧化碳濃度及日射量等資料，並以產量較導入前增加15％為目標，模擬多組栽培條件，作為2023年度環境管理方針的依據。\r\n\r\n模擬結果顯示，冬季11月至隔年3月的日間管理中，將溫室二氧化碳濃度提高50至100 ppm，有助於增加產量；若再提高濃度，增加的效果已相對有限。這項結果協助生產者找出較有效率的二氧化碳施用範圍，減少無效投入。\r\n\r\n生產者依據模擬結果設定全年環境控制目標，並在栽培期間持續調整與確認，最終產量較導入前增加17％，超過原訂15％的目標。\r\n\r\n【研究API轉為生產者可操作的APP】\r\n\r\n根據廣島縣的實證成果，持續未來株式會社將NARO預測API整合至營農支援App「Full Veg Navi」，自2025年9月1日起提供服務，也是日本首個採用「NARO生育與產量預測工具」的生產者用App。\r\n\r\n使用者可透過手機或電腦輸入栽培條件，比較多組模擬結果。例如將溫室二氧化碳濃度由400 ppm調整至500 ppm後，可從圖表查看預測產量的變化，再據此評估環境控制方式。\r\n\r\n除了生育與產量預測，App也整合作業、出勤、出貨紀錄，以及農藥與肥料庫存管理等功能。目前預測功能以番茄為主，後續預計擴充至小黃瓜、甜椒等其他果菜類。\r\n\r\n廣島縣的成果顯示，產量預測可以協助生產者比較不同管理方案，但並非由系統直接代替生產者控制溫室。17％的增產成果也來自特定設施與管理條件，實際表現仍會受到地區、品種、設備及栽培方式影響。", "public_article_format": "text", "public_date": "2026-08-08", "published_date": "", "public_image_url": "https://i.ibb.co/43v8cW8/Chat-GPT-Image-2026-8-8-02-19-59.png", "topic": "A_智慧農業與資料治理", "country": "日本", "language": "日文", "source_org": "農研機構（NARO）", "title_original": "(研究成果) 「NARO生育・収量予測ツール」を組み込んだ営農支援アプリケーションの社会実装 | プレスリリース・広報", "url": "https://www.naro.go.jp/publicity_report/press/laboratory/nivfs/176928.html"}, {"id": 191, "public_title": "刈草不必只能焚燒，也能轉為低碳園藝資材", "public_summary": "千葉大學環境健康領域科學中心與園藝學研究科團隊，聯合本田技術研究所比較河川堤防刈草在焚化、碳化、堆肥化三種處理方式下的溫室氣體收支，證實碳化與堆肥化處理有助降低地方廢棄物處理的碳排放，為將植物性廢棄物轉化為園藝資材的脫碳效益提供實證。原文正文為JavaScript動態載入，本摘要依網站提供的文章摘要（og:description）整理。", "public_article": "刈草不必只能焚燒，也能轉為低碳園藝資材\r\n\r\n河川堤防定期產生大量刈草，多數仍以焚燒方式處理。日本千葉大學與本田技術研究所等組成的研究團隊，比較刈草經焚燒、炭化及堆肥化後的溫室氣體收支，進一步評估製成的生物炭與堆肥用於園藝生產時，能否兼顧資材品質與減碳效益。\r\n\r\n研究以日本德島縣的刈草處理模式為案例，同時檢視「廢棄物處理」及「園藝利用」兩個階段，希望釐清未利用生物質轉為園藝資材後，實際能帶來多少環境效益。\r\n\r\n【炭化與堆肥化呈現淨吸收效果】\r\n\r\n研究結果顯示，每公斤鮮重刈草採焚燒處理時，溫室氣體收支為正0.245公斤二氧化碳當量（kg CO₂e）；製成生物炭及堆肥時，即使納入製造過程產生的環境負荷，收支仍分別為負0.395及負0.033公斤二氧化碳當量。\r\n\r\n換句話說，在這項研究的評估範圍及計算方法下，焚燒呈現溫室氣體淨排放，炭化與堆肥化則呈現淨吸收或儲存效果，其中又以生物炭的效果最為明顯。\r\n\r\n堆肥過去未被國際上普遍視為二氧化碳固定技術，研究團隊透過新的分析方法，將堆肥製造及使用過程納入整體收支，量化其可能具有的溫室氣體淨吸收能力。若再結合各地刈草發生量，也能進一步估算區域尺度的環境影響。\r\n\r\n【園藝利用可減少既有資材的碳足跡】\r\n\r\n研究製成的生物炭與堆肥，在品質及栽培表現上均與市售產品相當。試驗進一步以河川堤防刈草製成的堆肥占八成、生物炭占兩成，取代部分泥炭土、珍珠石與基肥。\r\n\r\n採用泥炭土、珍珠石及基肥的慣行處理，每盆碳足跡為41.7公克二氧化碳當量；使用刈草堆肥與生物炭的處理則降至0.06公克，顯示刈草經適當再資源化後，可作為育苗及盆栽生產資材，並大幅降低園藝生產的碳足跡。\r\n\r\n這項成果說明，未利用生物質的循環利用不必只限於直接投入農地，也能延伸至園藝介質與肥料替代。不過，相關數值來自日本德島縣案例，實際減碳效益仍會受到刈草原料、處理製程、運輸距離及資材替代比例影響。", "public_article_format": "text", "public_date": "2026-08-08", "published_date": "2026-08-04", "public_image_url": "https://i.ibb.co/1fXVXFJW/Chat-GPT-Image-2026-8-8-02-09-42.png", "topic": "E_低碳農業土壤與循環生物經濟", "country": "日本", "language": "日文", "source_org": "JAcom 農業協同組合新聞", "title_original": "植物性廃棄物を園芸資材に転換した際の脱炭素効果を実証　千葉大学", "url": "https://www.jacom.or.jp/articles/hzr4u48tY67yYR136uV42"}, {"id": 140, "public_title": "氣候韌性策略是強化美國海鮮產業競爭力的關鍵：調適治理、災後財務支持與氣候風險評估三項韌性策略", "public_summary": "邁阿密大學新研究指出，美國擴大國內海鮮生產的長期競爭力，取決於漁業能否承受氣候相關的干擾。研究以墨西哥灣漁業為案例，分析颶風衝擊並提出協助全國漁業因應氣候相關干擾（含海洋熱浪、有害藻華）的策略架構。", "public_article": "美國水產品要提升競爭力，不能只追求增產\r\n以墨西哥灣為例，提出調適治理、災後財務支持與氣候風險評估三項韌性策略\r\n\r\n美國近年希望擴大國內水產品生產，但漁業競爭力不只取決於捕撈量與養殖產能，也受到颶風、海洋熱浪及有害藻華等氣候事件影響。當港口、漁船、棲地、加工廠與物流系統同時受損，即使海域仍有漁業資源，供應也可能中斷數月，沿海社區與相關企業更需要較長時間恢復。\r\n\r\n美國邁阿密大學研究團隊以墨西哥灣漁業為案例，分析氣候災害如何影響水產品生產與供應鏈，並提出三項政策方向：建立能因應環境變化的調適型治理、提供獨立且穩定的財務安全網，以及以科學資料進行氣候風險評估。研究將氣候韌性視為產業競爭策略，強調真正具有競爭力的水產品部門，不只是產得多，也要能穩定生產、快速復原。\r\n\r\n【競爭力的關鍵，是能否持續供應】\r\n\r\n漁業政策談到競爭力時，常聚焦產量、成本、進口替代或市場規模，但水產品供應高度依賴自然環境與沿海基礎設施。一次強烈颶風可能同時破壞漁港、碼頭、冷鏈、加工設施與道路，也可能改變棲地、水質與漁獲分布。因此，增加捕撈或養殖能力，不代表供應一定更穩定。若每逢災害便中斷生產，企業難以維持訂單，消費者與通路也會轉向其他來源，沿海社區則可能因長期停工失去勞動力與產業基礎。\r\n\r\n研究團隊指出，氣候韌性的經濟價值，在於降低停產時間、減少損失，並讓漁業、加工與流通業者更快恢復。從這個角度來看，韌性不是生產以外的附加目標，而是穩定供應與維持市場信任的條件。\r\n\r\n【墨西哥灣同時具有高產值與高暴露風險】\r\n\r\n墨西哥灣是美國重要的水產品產區，每年商業漁獲碼頭產值約9.1億美元，並支撐超過25萬個商業與休閒漁業相關工作。全美規模最大的商業蝦類與牡蠣漁業，也集中在這個區域。\r\n\r\n高產值同時伴隨高度風險。墨西哥灣是美國颶風暴露程度最高、且風險增加速度最快的地區之一。強風、暴潮與洪水不只損壞船隻與港口，也會破壞濕地、牡蠣礁及近岸棲地，進一步影響漁業資源恢復。災害衝擊還會沿著供應鏈擴散。漁船即使可以重新出海，若加工廠停電、冷藏設備損壞、道路封閉或買家無法進場，漁獲仍難以進入市場。這顯示漁業韌性不能只處理海上生產，也需要納入陸上的加工、冷鏈、運輸與就業。\r\n\r\n【第一項策略：建立可調整的漁業治理】\r\n\r\n氣候變遷會改變魚種分布、繁殖季節、生長速度與棲地狀況。若管理制度仍以固定季節、固定區域或過去資源分布為基礎，可能無法及時回應新的環境條件。調適型治理的重點，是讓漁業管理可以依監測結果與資源變化調整，同時維持永續捕撈。例如，當魚群因海水升溫移動到不同海域，管理單位可能需要重新檢視配額、漁期、區域管制與跨轄區協調方式。\r\n\r\n災後也可能需要短期調整管理措施。部分漁區需要休養，另一些區域則可能承接較多捕撈壓力。若制度過度僵化，可能延誤產業恢復；但若只為增加供應而放寬限制，又可能使受損資源承受額外壓力。因此，調適治理並非單純放寬規則，而是建立能依科學資料修正的決策程序，讓資源保育與產業恢復同步進行。\r\n\r\n【第二項策略：建立獨立的財務安全網】\r\n\r\n漁業災後復原通常需要資金。船舶、漁具、碼頭、養殖設施與加工設備若受損，生產者可能在沒有收入的情況下，先支付修繕與重新營運成本。\r\n\r\n研究團隊主張建立較穩定、獨立的財務安全網，使漁業社區在災後能更快取得資金，避免每次事件都等待臨時性補助。相關工具可能包括保險、災害基金、低利融資、收入支持及基礎設施復原資金。「獨立」的重要性，在於降低援助受到年度預算、政治協商或單次災害認定程序影響。若資金撥付過慢，小型漁戶與加工業者可能在補助到位前退出市場，地方產業也可能失去原有產能。\r\n\r\n不過，財務安全網仍需設計適當條件。若補償方式未反映風險，可能鼓勵業者持續投資在高度暴露區域；若申請程序過於複雜，又可能使小型經營者難以取得支持。制度需要同時兼顧復原速度、公平性與長期風險降低。\r\n\r\n【第三項策略：以科學資料評估氣候風險】\r\n\r\n漁業管理若要提前準備，必須先知道風險發生在哪裡、影響哪些物種與供應鏈環節。氣候風險評估可整合海水溫度、颶風路徑、海洋熱浪、藻華、棲地變化、港口設施及產業資料，辨識高風險區域與脆弱環節。這類評估不只用於災害預警，也能支援長期投資。例如，港口是否需要提高防洪標準、冷鏈設備是否需要備援電力、加工廠是否過度集中，以及特定魚種是否應調整捕撈與市場布局。\r\n\r\n對沿海社區而言，風險資訊也有助於安排避難、船舶移置、設備保護及災後復工順序。若預測能進一步連結產業決策，便能從「知道災害可能來臨」，轉向「知道應優先保護哪些生產能力」。不過，風險模型仍存在不確定性，特別是魚群移動、棲地變化及多重事件同時發生時。評估結果應作為決策依據之一，並搭配在地漁民經驗與持續監測更新。\r\n\r\n【颶風案例也適用於海洋熱浪與有害藻華】\r\n\r\n研究以颶風為主要案例，但提出的策略不只適用於單一災害。海洋熱浪可能使魚群移動、增加死亡率，或改變捕撈季節；有害藻華則可能造成貝類停採、養殖生物死亡與市場信心下降。這些事件未必像颶風一樣直接摧毀設施，卻可能造成更長時間的生產與銷售限制。\r\n\r\n不同風險需要不同應變方式，但核心原則相同：提前辨識、降低暴露、建立替代方案，並縮短恢復時間。漁業若只在災害發生後補償損失，很難因應事件頻率與強度持續增加的趨勢。\r\n\r\n【韌性需要涵蓋整條水產品供應鏈】\r\n\r\n漁業韌性常被理解為漁船與漁民能否恢復作業，但水產品從海上到餐桌，還包括卸魚、拍賣、加工、冷藏、運輸、批發與餐飲等環節。任何一個節點中斷，都可能使整體供應停滯。例如，漁港受損會影響卸貨，冷鏈斷電可能造成產品報廢，加工廠停工則使原料無法處理。若市場端無法穩定收貨，漁民即使出海也可能面臨價格下跌。\r\n\r\n因此，韌性投資不能只集中在捕撈能力。港口防災、備援電力、冷藏容量、替代運輸路線與市場多元化，同樣會影響產業恢復速度。這也表示政策需要跨越傳統漁業管理範圍，與基礎設施、能源、金融、勞動及地方發展部門共同規劃。\r\n\r\n【增加國內生產前，要先降低供應中斷】\r\n\r\n美國推動國內水產品增產，希望降低進口依賴並強化糧食供應，但若新增產能集中在高風險地區，或缺乏災害備援，產量提升未必能轉化為穩定供應。研究團隊的觀點，是將氣候韌性放在增產政策之前或至少同步推進。新增港口、養殖設施、加工廠與物流系統時，應一併評估未來颶風、海平面上升、海洋熱浪與藻華風險。\r\n\r\n這種作法可能提高初期投資成本，卻有助於降低設備反覆受損、營運中斷與災後重建支出。對企業而言，較穩定的供應也有助於維持客戶、合約與融資條件。\r\n\r\n【韌性不等於維持原有產業不變】\r\n\r\n氣候調適有時意味著恢復原本的生產方式，但在部分地區，環境條件可能已不適合回到過去狀態。魚種分布改變、棲地退化或災害頻率提高後，產業可能需要調整捕撈對象、作業季節、設備配置與市場方向。因此，快速復原不能只以「恢復到災前產量」衡量，也要判斷原有模式是否仍具有長期可行性。某些社區可能適合強化既有漁業，另一些則需要發展養殖、加工、多元魚種或其他沿海產業。調適型治理與財務支持若能保留轉型空間，才能避免資金只用於重建相同的高風險設施。\r\n\r\n【從環境政策轉向產業經濟策略】\r\n\r\n這項研究最重要的觀點是把氣候韌性從環境保護議題，提升為水產品產業政策的一部分。健康的棲地與永續捕撈仍是基礎，但研究更進一步指出，韌性會影響企業是否能穩定交貨、勞工是否能維持就業、消費者是否能持續取得產品，以及沿海社區能否保留產業能力。因此，氣候投資的效益不只表現在減少生態損失，也包括縮短停工時間、降低供應波動與維持市場競爭力。\r\n\r\n", "public_article_format": "text", "public_date": "2026-08-01", "published_date": "2026-07-29", "public_image_url": "https://i.ibb.co/rfRmXxy1/Chat-GPT-Image-2026-8-1-11-22-50.png", "topic": "B_氣候韌性與農業風險管理", "country": "美國", "language": "英文", "source_org": "Phys.org 農業", "title_original": "A climate resilience strategy to strengthen US seafood competitiveness", "url": "https://phys.org/news/2026-07-climate-resilience-strategy-seafood-competitiveness.html"}, {"id": 141, "public_title": "甜菜與害蟲的互動關係隨乾旱程度而改變：中度缺水反而有利甜菜潛葉蠅幼蟲生長", "public_summary": "德國哥廷根大學研究團隊發現，甜菜受甜菜潛葉蠅為害的程度會因乾旱強度而異：中度乾旱反而促進幼蟲發育，重度乾旱則同時對植株與害蟲產生不利影響，研究發表於《Journal of Experimental Botany》。", "public_article": "乾旱不一定會減少蟲害\r\n德國研究發現，中度缺水反而有利甜菜潛葉蠅幼蟲生長，嚴重乾旱才同時壓制作物與害蟲\r\n\r\n乾旱除了抑制作物生長，也會改變植物與害蟲之間的關係。不過，水分愈少，蟲害不一定會減輕。植物在不同缺水程度下，葉片養分、生理狀態與揮發性物質都會改變，害蟲的取食、生長與產卵反應也可能隨之不同。\r\n\r\n德國哥廷根大學研究團隊以甜菜與甜菜潛葉蠅為材料，比較中度與嚴重乾旱下的植物生長、光合作用、葉片養分，以及害蟲幼蟲發育與成蟲產卵行為。結果顯示，中度乾旱雖然已使甜菜生長受限，葉片部分養分濃度卻提高，反而有利幼蟲生長並加重葉片受害；當乾旱進一步加劇，植物含水量與生理功能大幅下降，幼蟲發育才受到明顯抑制。\r\n\r\n\r\n【研究比較中度與嚴重乾旱下的蟲害反應】\r\n\r\n甜菜潛葉蠅是一種蠅類害蟲，幼蟲孵化後會鑽入葉片，在上下表皮之間取食，形成肉眼可見的白色或褐色潛食隧道。受害面積增加後，葉片可進行光合作用的組織減少，也可能進一步影響甜菜生長與糖分累積。研究團隊分別讓甜菜處於中度與嚴重乾旱，再搭配潛葉蠅危害，觀察植株生長量、葉面積、光合作用速率、葉片水分與營養成分，同時記錄幼蟲發育及雌蟲產卵行為。\r\n\r\n結果顯示，乾旱普遍會降低甜菜生長、葉面積與光合作用，但害蟲的反應並不是隨乾旱程度增加而單向下降。真正決定幼蟲表現的，是乾旱如何改變葉片內部的水分與養分條件。\r\n\r\n【中度乾旱下，葉片養分濃度提高】\r\n\r\n在中度乾旱條件下，甜菜雖然已受到水分壓力，部分葉片養分濃度卻有所增加。對潛葉蠅幼蟲而言，這樣的葉片仍保有足夠水分，也提供較有利的營養條件，因此幼蟲生長表現較好，對植株造成的損害也更加明顯。\r\n\r\n這種結果說明，植物受到壓力後，不一定立刻變成較差的寄主。當生長速度下降，而部分可利用養分仍留在葉片中，害蟲可能取得更集中的營養來源。因此，田間若出現中度缺水，作物外觀可能已略顯衰弱，但害蟲仍能正常發育，甚至比水分充足時造成更嚴重的危害。若只依植株萎凋程度判斷蟲害風險，可能低估這段時期的防治需求。\r\n\r\n【嚴重乾旱同時壓制作物與幼蟲】\r\n\r\n當缺水程度進一步加劇，甜菜葉片含水量與生理功能明顯下降，光合作用與整體生長受到更大限制。此時葉片已無法提供幼蟲正常發育所需的水分與營養條件，幼蟲生長也受到抑制。這表示嚴重乾旱確實可能降低部分害蟲表現，但代價是作物本身也承受更大傷害。即使蟲口減少，植株生長、葉面積與產量潛力仍可能大幅下降，不能把嚴重缺水視為有利的害蟲控制條件。\r\n\r\n因此，從生產角度來看，較值得關注的是中度乾旱階段。此時作物已出現生理壓力，害蟲卻仍可能獲益，形成「作物變弱、害蟲變強」的雙重風險。\r\n\r\n【乾旱也會改變植物對害蟲發出的化學訊號】\r\n\r\n植物會釋放多種揮發性有機化合物。這些氣味訊號可反映植物種類、生育狀態與受害情形，也會影響害蟲尋找寄主與選擇產卵位置。研究團隊發現，乾旱會改變甜菜所釋放揮發性物質的種類與總量。甜菜潛葉蠅雌蟲原本可利用這些訊號尋找適合幼蟲生長的植株，但乾旱後的氣味組成不同，也改變了雌蟲的產卵選擇。\r\n\r\n在嚴重乾旱下，雌蟲在植株上產下的卵明顯減少。這可能代表雌蟲能辨識植株生理狀態惡化，並避免把後代留在不利於幼蟲發育的寄主上。因此，乾旱對蟲害的影響不只發生在幼蟲取食之後，也可能從成蟲尋找寄主與產卵階段便開始。\r\n\r\n【植物、害蟲與環境形成動態關係】\r\n\r\n這項研究顯示，作物與害蟲的互動並非固定不變。相同害蟲在不同水分條件下，可能面臨完全不同的寄主品質。水分充足時，植物生長較快，也可能具有較完整的防禦與補償能力；中度乾旱時，植株生長受限，但葉片部分養分條件可能有利害蟲；嚴重乾旱時，植物與害蟲則同時受到抑制。\r\n\r\n這種非線性反應，使氣候變遷下的蟲害預測更加複雜。未來乾旱事件增加後，害蟲不一定全面減少，也不一定在所有乾旱年份都更嚴重。結果會取決於缺水強度、持續時間、作物生育階段與害蟲生活史。\r\n\r\n【中度逆境可能是蟲害監測的重要時點】\r\n\r\n田間管理常在作物出現明顯萎凋或嚴重受害後才加強巡查，但研究結果提醒，中度乾旱可能已經改變葉片品質，使害蟲取得更好的生長條件。對潛葉性害蟲而言，幼蟲藏在葉片組織內，藥劑或天敵接觸較不容易。若等到潛食隧道大量出現，部分葉片組織已經受損。較適合的作法，是在乾旱初期同步觀察成蟲活動、葉片卵量與早期潛食痕跡。\r\n\r\n灌溉紀錄也可與蟲害監測結合。當田區長時間沒有降雨、土壤水分下降但植株尚未嚴重萎凋時，可能正是害蟲風險上升的階段。此時應提高巡田頻率，而不是認為乾燥環境自然不利害蟲。\r\n\r\n【灌溉管理也可能改變蟲害結果】\r\n\r\n補充灌溉的主要目的，是降低作物缺水壓力，但水分恢復也會改變植物營養與害蟲生長條件。這不代表應為了抑制害蟲而刻意讓作物缺水，而是說明灌溉與病蟲害管理不宜完全分開。若田區處於中度乾旱，適時恢復水分可能幫助植株維持光合作用、生長與防禦能力；若灌溉時間過晚，植株已嚴重衰弱，則未必能迅速恢復。不同水分狀態也可能影響農藥吸收、天敵活動與害蟲世代發育。\r\n\r\n因此，乾旱期間的整合管理需要同時觀察土壤水分、植株生理與害蟲密度，再決定灌溉與防治時機，而不是只依其中一項指標處理。\r\n\r\n【氣候變遷下，蟲害風險不能只看平均溫度】\r\n\r\n氣候變遷對農業害蟲的影響，常從溫度升高與世代增加進行討論。這項研究補充了另一個層面：水分壓力也會改變作物作為寄主的品質，以及害蟲辨識植物的化學訊號。未來若高溫與乾旱同時發生，植物可能承受複合逆境，葉片水分、營養與防禦物質也會進一步改變。這些變化可能使部分害蟲受益，也可能對另一些害蟲不利，無法用單一方向概括。\r\n\r\n害蟲風險模型若只納入氣溫與降雨，可能仍不足以反映實際情況。後續需要進一步結合作物生理、土壤水分、植物揮發性物質與害蟲行為，才能更準確預測不同乾旱程度下的危害。\r\n", "public_article_format": "text", "public_date": "2026-08-01", "published_date": "2026-07-29", "public_image_url": "https://i.ibb.co/QvcjPNcF/Chat-GPT-Image-2026-8-1-11-34-49.png", "topic": "B_氣候韌性與農業風險管理", "country": "國際", "language": "英文", "source_org": "Phys.org 農業", "title_original": "Interaction between sugar beet and its pest varies depending on drought stress, researchers find", "url": "https://phys.org/news/2026-07-interaction-sugar-beet-pest-varies.html"}, {"id": 143, "public_title": "全球乾旱威脅作物生產熱點地圖，盤點17種主要作物的乾旱敏感度與生產損失熱點", "public_summary": "德拉瓦大學研究團隊量化全球17種主要作物（占全球糧食產量四分之三，含稻米、玉米、小麥、大豆）在雨養與灌溉條件下的乾旱敏感度與相關減產損失，繪出全球乾旱威脅熱點，研究發表於《Nature Communications》。", "public_article": "全球哪些作物產區最怕乾旱？\r\n研究區分雨養與灌溉農業，盤點17種主要作物的乾旱敏感度與生產損失熱點\r\n\r\n氣溫與降雨變化持續影響全球農業，但不同作物、不同生產方式面對乾旱時，受損程度並不相同。即使位於同一地區，依賴天然降雨的農田與具備灌溉條件的農田，也可能出現截然不同的產量反應。\r\n\r\n美國德拉瓦大學與義大利杜林理工大學研究團隊，分析水稻、玉米、小麥、大豆等17種主要作物，估算各作物在雨養與灌溉條件下的乾旱敏感度，以及乾旱相關的生產損失。這些作物合計約占全球糧食生產的四分之三，研究因此試圖回答一個關鍵問題：哪些地區一旦發生乾旱，對全球糧食供應的衝擊最值得優先關注？研究辨識出的乾旱敏感熱點，包括美國中西部部分地區、巴西東部、西班牙東部，以及印度中部與北部等。\r\n\r\n【乾旱風險不能只看降雨量多寡】\r\n\r\n一個地區是否容易受到乾旱衝擊，不能只用降雨量判斷。作物種類、生育期、土壤保水能力、灌溉條件與當地生產規模，都會影響最終損失。某些作物對短期缺水較敏感，若乾旱剛好發生在開花、授粉或籽粒充實期，產量可能快速下降；另一些作物則具有較深根系、較長生育期或較高耐旱能力，短期水分不足未必立即造成同等損失。\r\n\r\n此外，同樣的減產比例，發生在小面積產區與全球重要糧倉，對市場的意義也不同。研究因此不只衡量作物對乾旱的生理敏感度，也將生產損失納入分析，藉此找出既容易受旱、又可能牽動大量供應的區域。\r\n\r\n【雨養作物對氣候波動更敏感】\r\n\r\n研究團隊將雨養與灌溉作物分開分析。結果顯示，依賴天然降雨的作物，對乾旱與氣候變化的敏感度普遍較高。雨養農業沒有額外水源可補充。當降雨不足、土壤水分下降時，作物只能依賴既有土壤儲水與後續降雨。若缺水持續，光合作用、生長與產量形成都可能受到影響。灌溉作物則可透過渠道、噴灌、滴灌或其他供水系統補充水分，使產量在乾旱期間維持相對穩定。部分地區甚至可能因日照增加、病害減少，加上灌溉水源充足，而在偏乾年份維持或提高產量。\r\n\r\n不過，灌溉降低的是作物直接面對降雨不足的風險，不代表完全不受乾旱影響。當水庫、河川或地下水同時減少，灌溉農業仍可能面臨限水、抽水成本上升與長期水資源耗損。\r\n\r\n【乾旱熱點同時反映氣候與生產結構】\r\n\r\n研究辨識出的熱點包括美國中西部、巴西東部、西班牙東部，以及印度中部與北部部分地區。這些區域的共同特徵，不一定都是最乾燥，而是重要作物生產與乾旱敏感性在空間上重疊。\r\n\r\n美國中西部是玉米與大豆的重要產區，部分生產高度依賴降雨。當乾旱發生在關鍵生育期，大面積同步減產可能影響飼料、食品與生質燃料供應。巴西東部涵蓋多種農業生產系統，降雨變異與高溫可能同時影響大豆、玉米及其他作物。當主要產區進入乾旱，影響也可能透過出口市場向外擴散。西班牙東部長期面臨水資源壓力，灌溉雖能支撐高價值農業，但水源穩定性本身已成為限制。印度中部與北部則同時具有高人口、重要糧食生產與高度季風依賴等特性，降雨異常可能影響農民收入與區域糧食安全。\r\n\r\n【同一作物在不同地區，乾旱反應也不同】\r\n\r\n這項研究以作物別分析乾旱敏感度，顯示水稻、玉米、小麥與大豆不能只用全球平均值概括。同一種作物若栽培在不同氣候、土壤與管理條件下，缺水造成的影響可能差異很大。灌溉水稻與雨養水稻的水分來源不同；溫帶玉米與熱帶玉米面對高溫與蒸散壓力的方式也不相同。品種與播種期同樣會改變風險。早熟品種可能避開季末乾旱，但也可能降低產量潛力；延後播種有機會避開一段高溫，卻可能讓開花期遇上另一波缺水。\r\n\r\n因此，全球熱點地圖適合用來辨識優先區域，但實際調適措施仍需回到作物、品種與地方生產制度。\r\n\r\n【灌溉能降低風險，也可能轉移風險】\r\n\r\n研究結果顯示灌溉作物的產量對乾旱較不敏感，但這不表示擴大灌溉就是所有地區的標準答案。灌溉需要穩定水源、能源、輸配水設施與管理制度。若長期依賴地下水補充，可能使地下水位持續下降；若上游與下游、農業與城市用水競爭加劇，也可能形成新的社會與環境風險。在氣候變遷下，部分灌溉系統還可能同時面臨水源減少與作物需水增加。氣溫升高會提高蒸散，使同樣面積需要更多水才能維持生長。\r\n\r\n因此，灌溉應與節水技術、作期調整、耐旱品種、土壤保水及水資源治理共同規劃，而不是只增加取水能力。\r\n\r\n【乾旱調適應優先放在高損失熱點】\r\n\r\n乾旱風險評估的價值，在於協助有限資源投入最需要的區域。若一個地區同時具有高乾旱敏感度、大面積生產與全球供應重要性，便可能成為調適投資的優先對象。相關措施可能包括改善灌溉效率、調整播種期、推廣耐旱品種、增加土壤保水能力，以及建立更精細的乾旱預警與農業保險。\r\n\r\n不過，不同熱點需要的策略不一定相同。雨養產區可能更需要土壤管理、品種與氣象服務；高度灌溉區則可能優先處理用水效率、地下水與跨部門水資源分配。若只依全球平均風險制定單一政策，容易忽略地方差異，也可能把資源投入到效果有限的措施。\r\n\r\n【生產損失也會沿著貿易與供應鏈擴散】\r\n\r\n主要作物產區受旱，不只影響當地農民。玉米、大豆、小麥與水稻廣泛進入國際貿易、畜牧飼料、加工食品與能源市場，區域減產可能進一步造成價格與供應波動。當多個重要產區同時出現乾旱，其他地區也未必能迅速補足缺口。作物生產具有季節性，新增面積、調整品種與物流配置都需要時間。\r\n\r\n因此，乾旱熱點不只是農業氣候問題，也與糧食進口依賴、飼料成本及國家糧食安全有關。掌握哪些地區最容易發生大規模損失，有助於政府與企業評估採購來源是否過度集中，以及是否需要建立替代供應與庫存。\r\n\r\n【乾旱風險的核心，在於哪裡受損、損失多少】\r\n\r\n這項研究不只問哪些地方會乾旱，而是進一步比較不同作物與生產方式的敏感度，以及乾旱可能造成多少生產損失。結果再次顯示，雨養農業對氣候波動較敏感，灌溉則能提供一定緩衝，但效果仍受水資源條件限制。真正需要優先處理的，是乾旱風險、作物敏感度與重要生產區高度重疊的地方。\r\n\r\n面對氣候變遷，農業調適不能只依單一作物或單一國家的平均結果。將作物、生產方式與空間位置一起分析，才能更準確找出哪些地區的乾旱，不只是地方減產，也可能進一步影響全球糧食供應。\r\n", "public_article_format": "text", "public_date": "2026-08-01", "published_date": "2026-07-28", "public_image_url": "https://i.ibb.co/j9gNSWjj/Chat-GPT-Image-2026-8-1-11-51-24.png", "topic": "B_氣候韌性與農業風險管理", "country": "國際", "language": "英文", "source_org": "Phys.org 農業", "title_original": "Global hotspots where drought poses the greatest threat to crop production mapped", "url": "https://phys.org/news/2026-07-global-hotspots-drought-poses-greatest.html"}, {"id": 144, "public_title": "日本信州大學解析真菌感染植物新策略，重新檢視真菌病害防治的共同假設", "public_summary": "日本信州大學研究團隊發現，並非所有炭疽病菌都依賴傳統認為必要的「黑色素化附著器」侵入植物組織，部分菌種可能存在替代感染策略，此發現挑戰了稻熱病等病原真菌感染機制的既有認知，有助開發新型防治策略。", "public_article": "炭疽病菌不只靠「黑色附著器」侵入植物\r\n日本研究發現至少三種感染路徑，重新檢視真菌病害防治的共同假設\r\n\r\n植物病原真菌是造成作物損失的重要原因之一。過去對炭疽病菌與稻熱病菌的研究，多認為病原菌會先形成具有黑色素的附著器，再利用附著器產生壓力，穿透植物表面。這套感染模式長期被視為理解真菌侵入植物的重要基礎。\r\n\r\n不過，日本信州大學研究團隊比較多種炭疽病菌後發現，並不是所有菌株都需要黑色素化的附著器。有些真菌即使附著器沒有形成黑色素，仍能成功侵入植物；另一些則可直接由菌絲尖端進入組織。研究因此提出，炭疽病菌至少存在三種不同感染路徑，病害防治也不能只鎖定單一機制。\r\n\r\n【附著器為什麼需要黑色素】\r\n\r\n炭疽病菌與稻熱病菌感染植物時，常會在葉片或果實表面形成稱為「附著器」的特殊構造。附著器緊貼植物表面，並在內部累積高壓，讓病原菌產生侵入釘，穿過植物表皮與細胞壁。黑色素在這個過程中被認為相當重要。它能降低附著器細胞壁的滲透性，協助內部維持高壓。若黑色素形成受阻，附著器內壓力可能不足，病原菌便難以完成穿透。\r\n\r\n因此，抑制黑色素生合成一直是部分殺菌劑與病害研究的重要方向。這也形成一個長期假設：對這類病原菌而言，黑色素化附著器是感染植物不可缺少的步驟。\r\n\r\n【一個不受抑制劑影響的菌株，改變了研究方向】\r\n\r\n研究起點來自一個異常觀察。研究人員發現，某個炭疽病菌菌株即使接受黑色素生合成抑制劑處理，仍能正常侵入植物。顯微觀察顯示，它形成的附著器沒有明顯黑色素化，卻沒有因此失去感染能力。這項結果與既有模型不符，也促使研究團隊進一步追問：炭疽病菌是否存在其他不依賴黑色素的侵入方式？\r\n\r\n為了確認這不是單一菌株的例外，團隊結合基因分析、顯微觀察、生理試驗與系統發育分析，比較多種炭疽病菌。研究也使用黑色素缺失突變株及黑色素生合成抑制劑，觀察不同菌株在一般寄主與免疫能力較弱的阿拉伯芥上，如何形成附著器、穿透表面並進入組織。\r\n\r\n【第一種路徑：黑色素化附著器侵入】\r\n\r\n傳統感染模式仍然存在。部分炭疽病菌需先形成具有黑色素的成熟附著器，再累積足夠壓力穿透植物表面。這類感染方式可稱為「黑色素化附著器媒介侵入」。當黑色素生合成受到抑制，附著器功能下降，病原菌侵入能力也會明顯受限。\r\n\r\n對這些菌株而言，黑色素仍是感染過程中的重要條件。因此，針對黑色素合成或附著器成熟的防治策略，仍可能具有作用。研究的重要發現並不是推翻這套機制，而是指出它只代表炭疽病菌感染方式的一部分。\r\n\r\n【第二種路徑：沒有黑色素，附著器仍可完成侵入】\r\n\r\n研究團隊辨識出另一種感染方式，稱為「非黑色素化附著器媒介侵入」。採用這種策略的菌株，附著器即使沒有形成黑色素，仍能穿透植物組織。這表示它們可能利用不同的細胞壁結構、力學機制或分泌物，補足傳統模型中由黑色素負責的功能。\r\n\r\n研究也發現，部分菌株在附著器尚未完成黑色素化之前，就已開始自然感染植物。這進一步顯示，黑色素不一定是侵入的第一個必要條件，也可能只是部分菌株在特定階段使用的輔助機制。\r\n\r\n系統發育分析顯示，採用非黑色素化侵入方式的菌株並非隨機分布，而是在特定演化支系中較為集中。這代表替代感染策略可能是某些族群長期演化形成的特徵，而不是偶發性的生理異常。\r\n\r\n【第三種路徑：直接由菌絲尖端進入】\r\n\r\n除了兩種附著器侵入方式，研究團隊也再次確認「菌絲尖端侵入」的存在。這類病原菌不一定先形成典型附著器，而是由菌絲末端直接進入植物組織。與利用附著器累積壓力相比，菌絲尖端侵入可能更依賴局部酵素分解、細胞壁軟化或寄主表面特定結構。\r\n\r\n這項結果使炭疽病菌的感染模型從單一路徑，擴展為至少三種方式：\r\n1. 黑色素化附著器侵入\r\n2. 非黑色素化附著器侵入\r\n3. 菌絲尖端侵入\r\n\r\n不同菌株可能依演化背景與寄主條件，採用不同策略，甚至在不同情境下切換路徑。\r\n\r\n【相同病名，背後的感染機制可能不同】\r\n\r\n炭疽病可發生於多種蔬菜、果樹與經濟作物，病原多屬炭疽病菌屬。過去在病害診斷與防治上，常把不同菌種視為共享相近感染機制。這項研究顯示，即使同屬炭疽病菌，不同物種或菌株對黑色素的依賴程度可能差異很大。若防治策略只針對黑色素形成，對採用非黑色素化附著器或菌絲尖端侵入的菌株，效果可能有限。\r\n\r\n這也能解釋，為何某些黑色素生合成抑制劑在部分病害上表現良好，換到其他炭疽病菌或寄主後，防治效果卻不一致。問題不一定只來自藥劑抗性，也可能是病原菌本來就不依賴該路徑。因此，病原菌鑑定若只停留在屬或病名層級，可能不足以預測實際防治反應。未來還需要進一步掌握菌種、菌株與感染策略。\r\n\r\n【病害防治需要從單一標的轉向多重路徑】\r\n\r\n傳統防治常希望找到感染過程中的共同弱點，再利用單一藥劑或基因抗性阻斷。黑色素化附著器過去便被視為這類共同標的。研究揭示多條侵入路徑後，病害管理需要重新評估這種做法。若病原菌可繞過黑色素化步驟，單獨阻斷黑色素生合成，未必能有效防止所有菌株感染。\r\n\r\n較完整的策略可能需要同時考量：\r\n* 附著器形成與成熟\r\n* 黑色素生合成\r\n* 菌絲尖端侵入\r\n* 細胞壁分解酵素\r\n* 病原菌分泌的效應蛋白\r\n* 植物表面與細胞內免疫反應\r\n\r\n這並不代表每一項都需要同時用藥，而是防治技術開發應先確認目標病原主要採用哪一條路徑，再選擇較適合的標的。\r\n\r\n【替代感染路徑可能成為新的防治切入點】\r\n\r\n非黑色素化附著器如何產生侵入力，目前仍未完全釐清。這項未知也提供新的研究方向。若這類菌株不依賴黑色素維持附著器壓力，可能需要其他細胞壁組成、離子調節或機械力量。找出這些替代機制後，便可能發展新的殺菌劑標的或抗病育種方向。菌絲尖端侵入也值得進一步比較。若其更依賴特定分解酵素或寄主表面訊號，相關酵素、受器或植物防禦反應，都可能成為阻斷感染的節點。\r\n\r\n這項研究的價值不只在於增加一種感染分類，而是讓原本被共同模型遮蔽的差異重新受到注意。當病原菌有多套侵入工具，防治策略也需要建立更完整的機制圖譜。\r\n\r\n系統發育分析顯示，非黑色素化侵入能力在部分炭疽病菌演化支系中較常出現。這項結果意味著，未來即使尚未完成所有生理試驗，也可能先利用菌種親緣關係，推估某些菌株較可能採用哪種感染路徑。這類預測若能持續累積資料，可能協助病害風險評估與藥劑選擇。例如，當新地區出現某種炭疽病菌時，可先依其分類位置判斷，黑色素抑制型防治是否可能有效，再安排後續驗證。不過，演化關係不能完全取代實際測試。同一支系內仍可能存在菌株差異，寄主種類與環境條件也可能改變感染表現。\r\n\r\n\r\n這項研究最重要的觀念轉換，是不再把炭疽病菌視為只能透過黑色素化附著器侵入植物。黑色素化附著器仍是重要機制，但部分菌株可使用非黑色素化附著器，另一些則由菌絲尖端進入。這些差異顯示，植物病原真菌在感染策略上具有比過去想像更高的彈性。\r\n\r\n對作物保護而言，這代表病害管理不能只依賴單一路徑與單一標的。未來若能進一步釐清各類菌株的侵入偏好、替代機制及寄主反應，便有機會設計更精準，也較不容易遭病原菌繞過的防治策略。\r\n", "public_article_format": "text", "public_date": "2026-08-01", "published_date": "2026-07-27", "public_image_url": "https://i.ibb.co/LzNcLJNc/Chat-GPT-Image-2026-8-1-11-59-06.png", "topic": "C_IPM植物健康與農藥減量", "country": "國際", "language": "英文", "source_org": "Phys.org 農業", "title_original": "Unveiling fungal plant infection strategies to reshape the future of crop protection", "url": "https://phys.org/news/2026-07-unveiling-fungal-infection-strategies-reshape.html"}, {"id": 145, "public_title": "高解析遙測結合家戶與地理資料，可評估小農調適行為、政策成效與推廣優先區域", "public_summary": "密西根大學研究指出，高解析度衛星影像結合新分析工具，可協助政府、政策制定者與發展組織更精準判斷農業介入措施在哪裡有效，進而更有效分配資源、建構具韌性的糧食系統，尤其有助針對小規模農田提供支援。", "public_article": "衛星影像不只看農地，也能協助把永續農業資源投到更適合的地方\r\n高解析遙測結合家戶與地理資料，可評估小農調適行為、政策成效與推廣優先區域\r\n\r\n衛星長期用來觀察土地利用與環境變化，近年影像解析度與分析工具快速提升，也讓這些資料更有機會進入農業政策與計畫管理。對小農地區而言，傳統統計往往不足以呈現田區差異，實地調查成本又高，政府與發展組織即使知道某些永續作法可能有效，也不容易判斷應優先投入哪些地區。\r\n\r\n美國密西根大學研究者Meha Jain整合衛星遙測、地理空間分析、家戶與人口普查資料，觀察印度農民如何因應氣候變異與地下水下降，並進一步討論高解析衛星資料如何協助評估農業政策與推廣措施。研究重點不在把衛星影像直接交給農民，而是建立大尺度資料產品，協助政府與組織辨識哪些措施有效、哪些地方更適合投入資源。\r\n\r\n\r\n【小農田區過去常被衛星影像平均掉】\r\n\r\n早期衛星影像的空間解析度較低，一個像素可能涵蓋多塊農田、道路與聚落。對大面積農場而言，仍可辨識主要作物與土地覆蓋；但在印度及其他小農地區，田區面積小、邊界零碎，單一像素內往往混合多種地物，使作物分類、產量推估與管理差異難以準確呈現。\r\n\r\n目前公開衛星資料已可提供約10公尺解析度，較能對應小農田區尺度；商業衛星則能取得更細緻的影像。影像解析度提高後，研究者可進一步辨識個別田區的作物類型、種植時間、休耕與灌溉情形，也能持續觀察同一地區在不同年份的變化。這項進展的重要性，不只在於看得更清楚，也讓資料不足地區有機會建立較一致、可重複更新的農業資訊。\r\n\r\n【從觀察土地，進一步分析農民如何調適】\r\n\r\nJain的研究聚焦印度農業，分析天氣變異與地下水下降如何影響生產，以及農民是否透過調整作物與栽培方式降低衝擊。農民面對缺水時，可能改種需水量較低的作物、改變播種期、減少種植面積，或持續抽取地下水維持原有生產。這些選擇不只受到氣候與水資源影響，也與家庭資產、灌溉設施、資訊取得與市場條件有關。\r\n\r\n單靠衛星影像，可以看見土地與作物發生變化，卻未必知道農民為何調整。研究因此把遙測結果與家戶及普查資料結合，進一步判斷不同群體在相同環境壓力下，是否具有不同的調適能力這種分析方式，能把「田區發生什麼變化」與「哪些農民有能力採取行動」連結起來，也讓政策設計不只依賴平均結果。\r\n\r\n【許多永續作法已經存在，問題是沒有被廣泛採用】\r\n\r\n提高產量與降低環境衝擊，常被視為彼此衝突的目標，但研究指出，部分管理措施可以同時改善生產與環境表現。例如節水灌溉、調整作期、改種適地作物與改善土壤管理，都可能在特定條件下提高產量，並降低用水、溫室氣體排放或土地壓力。\r\n\r\n真正的困難，往往不在缺少技術，而是技術沒有擴大採用。成本過高、設備或種苗不易取得、農民缺乏資訊，或某項措施只在特定土壤、氣候與經營條件下有效，都可能限制推廣。因此，政策不能只問「這項技術有沒有效」，還需要進一步確認「在哪裡有效、對哪些農民有效，以及什麼條件下不適合」。高解析衛星資料的價值，就在於提供較細緻的空間差異，協助政府把原本統一推動的措施，調整為較符合地區條件的資源配置。\r\n\r\n【衛星資料可以協助評估政策是否真的有效】\r\n\r\n農業計畫執行後，常透過受益人數、補助面積或問卷回覆評估成效，但這些資料不一定能持續反映田區變化，也可能只涵蓋主動參與或容易調查的農戶。衛星資料可以在相同尺度與時間序列下，追蹤作物面積、種植強度、休耕、灌溉與植生狀況。若再搭配計畫名單、氣象與社經資料，便有機會比較參與與未參與地區的變化，評估某項措施是否真正改善生產或降低環境壓力。\r\n\r\n例如，政府推動節水作物後，可以觀察目標區是否出現作物轉換；導入灌溉設備後，也能比較種植期與產量穩定性是否改變。這類資料不能單獨證明因果，但能協助找出需要進一步調查的地區，也能補充傳統期末調查的不足。研究者認為，衛星農業的下一階段，不只是持續蒐集資料，而是讓資料更直接支援政策評估與決策。\r\n\r\n【從全面推廣，轉向更精準的資源配置】\r\n\r\n同一項永續措施在不同地區的效果可能差異很大。若地方水源不足，推廣高需水作物與灌溉設備未必適合；若市場距離遙遠，即使新作物較耐旱，也可能因缺乏收購通路而難以持續。透過衛星與地理資料，政府可先找出環境與生產條件較適合的區域，再搭配家戶資料判斷農民是否具有採用能力。資源配置因此可以從平均分配，轉向優先投入成功機會較高、或風險較迫切的地區。\r\n\r\n這種作法也能避免把單一技術當成普遍解方。若影像顯示同一縣市內的作物、水分與土地利用差異很大，推廣策略便應保留分區調整，而不是只依行政區制定相同補助條件。\r\n\r\n【衛星資料不能直接解決成本與可及性問題】\r\n\r\n即使資料能辨識最適合推廣的地區，農民仍可能因成本、設備不足、資訊落差或制度門檻而無法採用。衛星影像可以指出哪些地方面臨地下水下降、哪些田區可能因氣候變異而減產，但無法單獨處理貸款、種苗供應、技術服務與市場連結等問題。若政策只做到空間辨識，卻沒有後續配套，資料精度提高也不一定能轉化為實際採用。\r\n\r\n因此，遙測適合作為決策基礎，結合推廣、訪查與農民參與，把空間資料與地方知識、現場條件及制度設計整合。\r\n\r\n【產量估算仍容易忽略最高與最低產田區】\r\n\r\n衛星資料雖然能快速涵蓋大範圍，仍存在誤差。研究指出，遙測產量模型對中間表現的田區通常較穩定，但在最高產與最低產田區，預測可能較不準確。若模型低估高產田區，可能錯判某項措施的效益；若低產田區因災害、病害或管理失敗而未被準確辨識，也可能讓最需要支持的農戶被忽略。影像中的雲層、作物混種、田區邊界與不同栽培方式，也可能增加分類誤差。資料產品建立後，仍需揭露不確定性，並透過田間樣本與其他行政資料進行校正。\r\n\r\n\r\n【小農資料的價值，也伴隨治理問題】\r\n\r\n高解析影像能更細緻辨識農田活動，這同時帶來資料治理問題。當衛星資料再與家戶、補助或土地資訊結合，可能逐漸接近個別農戶層級。政府與研究組織在使用這類資料時，需要釐清資料用途、匿名化方式、存取權限與決策責任。若模型判定某個地區不適合補助，農民是否有申訴或補充資料的機會，也應納入制度設計。衛星資料能提高政策精準度，但不應成為單方面排除農戶的工具。資料應協助發現差異與改善資源配置，而不是取代現場確認與程序保障。\r\n\r\n【真正的轉變，是從有資料走向用資料做選擇】\r\n\r\n這項研究呈現的重點，不是衛星能替農民完成多少田間工作，而是政府與發展組織能否利用資料，把農業支持投入更適合的地方。過去許多農業計畫先選定措施，再廣泛尋找推廣對象；高解析遙測與地理分析則提供另一種路徑：先辨識地區差異、評估過去措施成效，再決定哪些技術、資源與支持應優先配置。\r\n\r\n這種轉變也使計畫評估從「做了多少」，進一步走向「在哪裡有效、對誰有效，以及為什麼沒有擴散」。\r\n\r\n衛星資料無法取代農民經驗與田間工作，但在資料稀缺的小農地區，它能提供一套持續更新的共同基礎。當影像、家戶調查與地方知識相互補充，永續農業政策才較有機會從全面宣導，轉向更精準且符合在地條件的支持方式。\r\n", "public_article_format": "text", "public_date": "2026-08-01", "published_date": "2026-07-27", "public_image_url": "https://i.ibb.co/35kr85Gt/Chat-GPT-Image-2026-8-1-12-07-18.png", "topic": "A_智慧農業與資料治理", "country": "國際", "language": "英文", "source_org": "Phys.org 農業", "title_original": "Satellite images could help target sustainable farming support for small fields", "url": "https://phys.org/news/2026-07-satellite-images-sustainable-farming-small.html"}, {"id": 147, "public_title": "刪減水稻基因片段可提升產量達25%，並增強耐旱耐熱性", "public_summary": "芝加哥大學研究團隊發現，刪去水稻特定基因的一段序列可使產量提升最高25%，並增強耐旱、耐熱性，且不需如先前研究般引入動物基因，全程使用植物自身基因即可達成，研究7月23日發表於《Nature Genetics》。", "public_article": "刪去一小段水稻蛋白質，產量提高20％至25％\r\n芝加哥大學研究從植物自身基因下手，同時改善高溫與乾旱耐受性\r\n\r\n提高作物產量，未必只能增加新的基因功能。有時候，移除原有蛋白質中的一小段限制區域，反而能讓植物生長得更好。美國芝加哥大學研究團隊針對植物本身具有的ALKBH9與ALKBH10基因進行調整，刪除蛋白質末端一段稱為「內在無序區域」的結構。水稻試驗結果顯示，經調整的植株產量提高約20％至25％，對乾旱與高溫的耐受性也有所改善。\r\n\r\n這項研究沒有導入動物或其他外來基因，而是改變植物原有蛋白質的結構。研究團隊認為，未來可透過鹼基編輯移除少量DNA序列，作為兼顧增產與逆境韌性的育種方向。\r\n\r\n【研究起點來自一個動物基因】\r\n\r\n研究團隊長期探討DNA、RNA與基因表現之間的關係。過去常把RNA視為DNA指令傳遞至蛋白質製造系統的中介，但近年研究逐漸發現，RNA上的化學標記也會影響哪些基因開啟，以及基因表現的強度。2021年，團隊曾將哺乳動物常見的FTO基因導入水稻與馬鈴薯。FTO可移除RNA上的特定化學標記，改變植物的基因表現調控。試驗中的植株生長較快、根系較長，產量與耐旱性也同步提高。不過，這項方法需要在植物中導入動物基因。即使效果明顯，仍可能面臨法規、消費者接受度與育種應用上的限制。\r\n\r\n研究團隊因此開始尋找植物自身是否存在功能相近的機制，希望不用外來基因，也能解除抑制生長的調控。\r\n\r\n【植物沒有FTO，但有功能相近的ALKBH9與ALKBH10】\r\n\r\n植物並沒有與哺乳動物FTO完全對應的基因，但具有ALKBH9與ALKBH10等相關蛋白。這些蛋白同樣參與RNA與組蛋白去甲基化，可能改變基因表現與染色質狀態。\r\n\r\nDNA在細胞中不會單獨存在，而是與組蛋白等結構一起形成染色質。染色質包覆得較緊密時，基因較不容易開啟；結構較鬆散時，轉錄機制則較容易接近DNA。ALKBH9與ALKBH10可影響RNA及組蛋白上的化學標記，進而調整染色質與基因表現。不過，正常狀態下，這些蛋白的作用範圍受到自身結構限制，無法像FTO一樣廣泛影響細胞中的染色質。研究團隊最後發現，限制來源可能不是蛋白質的主要功能區，而是位於末端的一段「內在無序區域」。\r\n\r\n【沒有固定形狀的蛋白質區域，也可能具有調控作用】\r\n\r\n多數蛋白質會摺疊成相對固定的三維結構，以執行催化、運輸或訊號傳遞等功能。但許多蛋白質也包含較柔軟、缺乏固定形狀的區段，稱為內在無序區域。這些區域過去常被視為連接不同蛋白質結構的橋梁，或是不具重要功能的尾端。後續研究則發現，它們可參與蛋白質定位、分子結合與基因調控，有時甚至像一道限制機制，決定蛋白質能在哪裡發揮作用。\r\n\r\nALKBH9與ALKBH10的C端，也就是蛋白質末端，便具有這類內在無序區域。研究團隊發現，這段結構會限制蛋白質接近細胞中的染色質。當C端無序區域遭到移除後，ALKBH9與ALKBH10便能更廣泛分布於細胞內，進一步作用於RNA、組蛋白與染色質，產生與FTO相近的基因調控效果。換句話說，研究不是替植物增加一套新功能，而是移除原有蛋白質上的限制，使它能接觸更多基因調控區域。\r\n\r\n【刪除蛋白質末端後，水稻產量提高20％至25％】\r\n\r\n研究團隊將去除C端區域的ALKBH9或ALKBH10導入水稻進行測試。結果顯示，植株生長與產量均有所提升，稻米產量增加約20％至25％。除了增產，經調整的植株也對乾旱與高溫表現出較佳耐受性。這與先前FTO試驗的結果相近，顯示植物自身的ALKBH蛋白在移除限制區域後，也能重新調整生長與逆境反應。\r\n\r\n研究團隊把這項作用描述為重新設定染色質動態。當RNA與組蛋白上的甲基標記發生改變，部分與生長、根系及逆境調適相關的基因可能更容易開啟，使植物在正常與受壓條件下維持較高生產力。不過，產量增加來自哪些具體構成，包括穗數、粒數、結實率或粒重，仍需進一步分析。耐旱與耐熱性背後涉及的生理路徑，目前也尚未完全釐清。\r\n\r\n【小幅編輯植物自身基因，與導入外來基因不同】\r\n\r\n這項策略最受到關注的地方，在於不必把動物FTO基因放入植物。若研究者只需要刪除ALKBH9或ALKBH10末端的少量序列，理論上可利用鹼基編輯或其他精準基因編輯方法，直接調整植物原有基因。最終植株不含外來DNA，變化也可能只涉及一個或少數鹼基。這種作法與傳統基因改造不同。傳統方法可能導入其他物種的完整基因；這項研究則是修改植物本身已存在的蛋白質，使其作用範圍改變。\r\n\r\n不過，編輯幅度小，不代表生物效應一定有限。ALKBH9與ALKBH10影響RNA、組蛋白與染色質，可能同時改變許多基因的表現。因此，後續仍需確認是否伴隨成熟期、植株高度、品質、病害感受性或其他非預期變化。\r\n\r\n【提高生長與耐逆境，可能來自同一套調控機制】\r\n\r\n一般而言，提高生長速度與增加逆境耐受性有時存在取捨。植物若長期啟動防禦反應，可能消耗可用於生長與繁殖的能量；若只追求快速生長，又可能在乾旱或高溫下較容易受損。這項研究卻同時觀察到增產與逆境耐受性提升，顯示ALKBH蛋白調控的可能不是單一防禦基因，而是較廣泛的生長與壓力反應網絡。染色質狀態改變後，植物可能更快啟動需要的基因，也可能維持較長根系、較高光合作用或更有效率的資源利用。不過，這些可能機制仍屬後續研究方向。\r\n\r\n研究團隊目前持續分析，刪除C端無序區域後，哪些RNA與組蛋白標記發生變化，以及哪些基因直接受到影響。只有釐清作用路徑，才能判斷這項方法是否能在不同環境中穩定使用。\r\n\r\n【許多植物都有相近基因，應用可能不只限於水稻】\r\n\r\nALKBH9與ALKBH10類基因廣泛存在於多種植物。研究團隊已開始測試，類似的蛋白質末端調整是否也能應用於其他作物。如果相同機制在玉米、小麥、大豆或馬鈴薯中成立，便可能形成一套跨作物的基因編輯策略。研究者不必為每一種作物重新尋找完全不同的增產基因，而是調整各作物自身的ALKBH蛋白。\r\n\r\n但不同作物的基因功能、蛋白質結構與生長調控未必完全一致。相同區段刪除後，可能產生不同程度的生長反應，也可能只在特定組織或環境下有效。多年生作物與一年生作物的評估方式也不同。水稻可在單一季節觀察產量，多年生果樹則需經過多個生育週期，才能確認長期生長、結果與逆境反應是否穩定。\r\n\r\n【試驗結果仍需經過多地點與多年度驗證】\r\n\r\n目前研究證明，刪除ALKBH9或ALKBH10末端區域可提高試驗水稻的產量與逆境耐受性，但距離實際品種應用仍有一段距離。產量表現需在不同品種、氣候、土壤與栽培管理下重複驗證。溫室或控制環境中的20％至25％增產，進入田間後可能受到病蟲害、肥力、密度與極端天候影響。耐旱與耐熱試驗也需要進一步區分壓力強度與生育階段。水稻在營養生長期耐旱，不一定代表開花與灌漿期仍能維持結實；高溫下生長較佳，也不一定能避免花粉失活與白未熟粒。若產量提高卻伴隨品質下降，實際產業價值仍會受到限制。\r\n\r\n", "public_article_format": "text", "public_date": "2026-08-01", "published_date": "2026-07-27", "public_image_url": "https://i.ibb.co/ccpxcXD2/Chat-GPT-Image-2026-8-1-12-37-42.png", "topic": "B_氣候韌性與農業風險管理", "country": "國際", "language": "英文", "source_org": "Phys.org 農業", "title_original": "Trimming rice genes boosts yields up to 25% and improves drought tolerance", "url": "https://phys.org/news/2026-07-trimming-rice-genes-boosts-yields.html"}, {"id": 152, "public_title": "日本綠色戰略對策下的IPM實踐：幾丁質生合成抑制劑第一型", "public_summary": "JAcom專欄「防除學習帖」第359回，介紹因應綠色糧食系統戰略的IPM（病蟲害整合管理）實踐，本篇主題為幾丁質生合成抑制劑第一型農藥的作用機制與應用（本文擷取不完整，僅能依標題整理，細節待回查原文）。", "public_article": "減少化學農藥風險，不代表一味少用藥\r\n布芬淨以抑制害蟲脫皮發揮作用，選擇性高、對部分天敵影響較低，可作為IPM中的精準用藥工具\r\n\r\n日本於2021年公布「綠色食料系統戰略」，提出降低化學農藥使用風險的政策目標。這項目標若只理解為減少農藥用量，可能忽略病蟲害防治的基本需求。對生產者而言，真正的挑戰是在維持作物產量與品質的前提下，降低整體農藥風險。IPM的核心也不是完全排除化學防治，而是結合監測、栽培管理、物理防治、生物防治與必要用藥。當田間仍需使用農藥時，若能依害蟲種類與生育期，選擇作用明確、標的範圍較窄，並較能保全天敵的有效成分，就有機會兼顧防治效果與風險降低。\r\n\r\n布芬淨（buprofezin）屬於IRAC，主要抑制害蟲幾丁質的生合成。它不以快速擊倒成蟲為主要作用，而是在若蟲脫皮時阻斷新外骨骼形成，使害蟲無法正常發育。這種作用特性，也決定了它在IPM中的適用時機與角色。\r\n\r\n【阻斷幾丁質合成，使若蟲無法正常脫皮】\r\n\r\n昆蟲外骨骼的主要成分之一是幾丁質。幼蟲或若蟲在生長過程中，需要反覆脫去舊外骨骼，再合成新的外骨骼。布芬淨會干擾這個過程，使害蟲在脫皮與變態時無法形成正常表皮，最後死亡。因此，布芬淨對若蟲期的效果較明顯，並不是接觸後立即大量死亡的速效型藥劑。施藥後若只觀察短時間內成蟲是否落下，容易低估實際效果。\r\n\r\n這也表示用藥時機相當重要。若害蟲族群已以成蟲為主，單靠布芬淨未必能快速壓低當下密度；若能在若蟲發生初期施用，則較符合其作用機制。\r\n\r\n【對成蟲殺傷有限，但可能降低下一代密度】\r\n\r\n布芬淨對成蟲與卵沒有明顯的直接殺蟲活性，但對部分雌成蟲可能產生抑制產卵、降低卵孵化率等作用。因此，它的效果不只表現在當代若蟲死亡，也可能降低後續族群增長速度。這類作用通常需要經過一段時間才能反映在田間密度上，不宜期待施藥後立即清除所有蟲體。\r\n\r\n在IPM管理中，這種特性可用於搭配田間監測。透過黏蟲板、葉背調查或族群齡期判斷，掌握若蟲比例與密度變化，再決定是否施用，比按照固定日期用藥更能發揮效果。\r\n\r\n【選擇性較高，有利於保留部分天敵】\r\n\r\n布芬淨主要作用於部分半翅目害蟲及部分蟎類，作用範圍不像廣效性殺蟲劑那麼廣。由於其標的與作用方式較具選擇性，對人畜與部分非標的生物的影響相對較低，也較常納入需要保全天敵的IPM系統。田間若同時利用寄生蜂、捕食性椿象、草蛉或捕食蟎等天敵，選擇性藥劑通常比廣效型藥劑更有利於維持生物防治功能。\r\n\r\n不過，「對天敵影響較低」並不等於對所有天敵完全安全。不同天敵種類、發育階段、接觸方式與藥劑劑型，反應可能不同。實際使用前，仍需參考當地登記標示、天敵相容性資料與生產場域經驗。\r\n\r\n【長殘效是優點，也需要搭配抗藥性管理】\r\n\r\n布芬淨具有較長殘效，可在一段時間內持續影響後續進入脫皮期的若蟲。這項特性有助於降低短期重複施藥，也能在害蟲世代重疊時提供較持久的控制。但同一作用機制若連續使用，也會增加抗藥性選汰壓力。尤其粉蝨、飛蝨與介殼蟲等害蟲世代短、繁殖快，長期依賴單一藥劑後，防治效果可能逐漸下降。因此，布芬淨應依IRAC作用機制進行輪替，避免連續多次使用同一組藥劑，也不能只更換商品名稱，卻持續使用相同有效成分或相同作用機制。\r\n\r\n抗藥性管理還需搭配非化學措施，例如移除受害嚴重植株、清除田間寄主、控制蟻類、改善通風，以及利用天敵壓低族群。這些措施能減少藥劑承受的防治壓力。\r\n\r\n【降低農藥風險，要看有效成分與使用方式】\r\n\r\n日本相關文章以「風險換算量」評估農藥政策目標，不只計算藥劑重量，也把不同有效成分的風險係數納入。這種方法提醒，減少化學農藥風險不能只比較用了幾公斤，也要看使用的是哪一種成分、作用對象與施用方式。\r\n\r\n布芬淨在日本基準年的風險換算量約為60.6公噸，占整體風險換算總量約0.26%。其不能直接套用臺灣，但管理邏輯值得參考：政策若只要求全面減量，可能連選擇性較高、可與天敵搭配的藥劑也一併排除，反而迫使生產者改用其他更廣效或施藥次數更多的方案。較合理的方向，是逐項比較有效成分的風險、作用機制、使用時機與替代方法，再決定哪些應優先減少，哪些可保留作為IPM中的必要工具。\r\n\r\n【使用前先確認害蟲種類與齡期】\r\n\r\n布芬淨的作用集中於若蟲脫皮，因此辨識害蟲種類與發育階段，比單純看到蟲就施藥更重要。以粉蝨、飛蝨或介殼蟲為例，成蟲、卵與若蟲可能同時存在。若田間以卵或初齡若蟲為主，布芬淨較可能發揮後續抑制效果；若成蟲密度已高，則可能需要搭配其他管理措施，避免成蟲持續產卵與擴散。\r\n\r\n施藥時也要讓藥液到達害蟲棲息位置。許多粉蝨與介殼蟲集中在葉背、枝條縫隙或較隱蔽部位，若只噴到葉片正面，即使選對有效成分，防治效果仍會受限。\r\n\r\n【農藥登記與使用範圍需以臺灣現行標示為準】\r\n\r\n布芬淨是臺灣核准使用的農藥普通名稱，英文為buprofezin，現有不同劑型與含量產品。實際可使用的作物、害蟲、稀釋倍數、施藥次數與安全採收期，應以農業部農藥資訊服務網及產品標示為準。日本文章所列的登記作物、商品名稱、施用方法與風險係數，屬於日本制度與當地登記內容，不宜直接轉為臺灣用藥建議。\r\n\r\n\r\n農藥資訊服務網：https://pesticide.aphia.gov.tw/information/\r\n", "public_article_format": "text", "public_date": "2026-08-01", "published_date": "2026-07-31", "public_image_url": "https://i.ibb.co/GvMn5ZTH/Chat-GPT-Image-2026-8-1-12-56-55.png", "topic": "C_IPM植物健康與農藥減量", "country": "日本", "language": "日文", "source_org": "JAcom 農業協同組合新聞", "title_original": "みどり戦略対策に向けたＩＰＭの実践（120）キチン生合成阻害剤 タイプ１【防除学習帖】第359回 防除学習帖", "url": "https://www.jacom.or.jp/articles/6z-bkcWJbSrKM7QY1dwhR"}, {"id": 153, "public_title": "湛水直播的初期除草，為什麼要在播種後儘快進行？", "public_summary": "JAcom專欄「今さら聞けない營農情報」第359回，說明水稻湛水直播栽培下的除草劑使用體系範例（本文擷取不完整，僅能依標題整理，細節待回查原文）。", "public_article": "湛水直播的初期除草，為什麼要在播種後儘快進行？\r\n\r\n農藥要發揮效果，必須讓有效成分到達作用位置。除草劑依處理方式，大致可分為莖葉處理與土壤處理；實際使用時，還需配合作物栽培方式、生育階段及雜草發生情形，才能兼顧除草效果與作物安全。\r\n\r\n湛水直播與移植栽培相似，播種前會依序進行耕起、入水、粗整地與細整地，再讓田面水自然下降至適合播種的淺水狀態，完成播種後重新湛水，施用初期除草劑。\r\n\r\n【雜草從整地時便開始萌發】\r\n\r\n水田雜草在整地與入水後便可能開始萌發。若自然減水時間較長，等到水稻播種時，部分雜草可能已經發芽。因此，播種後恢復湛水時，通常需要儘快施用初期除草劑，避免雜草進入較難防除的生育階段。\r\n\r\n【施藥需要適當水深】\r\n\r\n水田除草劑會透過田面水擴散，並在土壤表面形成處理層。施藥時需要維持適當水深，才能讓藥劑較均勻分布。水深不足或田面不平，可能造成局部藥量不足或濃度過高，影響除草效果，也增加藥害風險。\r\n\r\n【初期劑要兼顧稻苗安全】\r\n\r\n湛水直播在播種後不久便施用除草劑，剛萌發的稻苗幼芽可能接觸土壤表面的藥劑處理層。因此，初期除草劑除了要能控制已開始萌發的雜草，也必須對直播稻具有足夠安全性。\r\n\r\n", "public_article_format": "text", "public_date": "2026-08-01", "published_date": "2026-07-31", "public_image_url": "https://i.ibb.co/rqVcBg9/Chat-GPT-Image-2026-8-1-01-11-10.png", "topic": "C_IPM植物健康與農藥減量", "country": "日本", "language": "日文", "source_org": "JAcom 農業協同組合新聞", "title_original": "農薬の正しい使い方（93）湛水直播栽培での除草体系の例【今さら聞けない営農情報】第359回 今さら聞けない営農情報", "url": "https://www.jacom.or.jp/articles/XqB1rNWcfDLP2rTKo8Tov"}, {"id": 159, "public_title": "除草變娛樂：日本農村以觀光、運動、藝術結合，解決除草人力荒", "public_summary": "日本各地興起把農村沉重的除草工作「娛樂化」的做法，結合觀光、運動賽事與藝術創作，吸引不同背景的人參與。鹿兒島「除草觀光」自2017年推動至今已在30多處舉辦，長期參與者達140人；新潟南魚沼則舉辦「梯田除草藝術日本錦標賽」，藉創意活動持續補充農村除草人力。", "public_article": "把割草變成觀光、競賽與藝術\r\n日本農村嘗試讓重勞動變得可參與，也為長期缺工尋找新的協力模式\r\n\r\n割草是農村維持田區、道路與農地景觀不可缺少的工作，卻也是最耗體力、最容易因高溫而中斷的作業之一。近年日本各地開始把割草與觀光、運動、藝術及地方交流結合，希望在確保安全的前提下，讓更多非農業人口願意參與，也為農村持續缺乏割草人力的問題尋找新的解法。\r\n\r\n這些做法並不是把割草包裝成一次性活動，而是嘗試重新設計參與方式。有人協助媒合需求與志工，有人建立安全講習、保險與工時限制，也有地方透過競賽和創作，讓原本辛苦、重複的工作，轉化為社區共同完成的任務。\r\n\r\n【鹿兒島把割草與地方體驗結合】\r\n\r\n鹿兒島縣逐漸發展出「割草旅遊」。推動者是鹿兒島市喜入町的育兒支援團體KADAN。這項行動起於2017年，當時地方婦女為了整理休耕地、開闢農園，開始一起割草，後續再把經驗發展成媒合平台。目前已有個人與法人合計10個協力支部，2026年4月也成立關西支部。\r\n\r\nKADAN負責媒合有割草需求的地主與參加者。新手參加前需接受安全講習，並加入保險；每次作業控制在3小時內，也把熱傷害預防列為必要條件。割草完成後，地主或地方居民會安排戲水、交流或簡單款待，讓參加者不只是完成勞動，也能認識場域與社區。\r\n\r\n目前活動已在30多處辦理，約有140人持續表達參加意願。參與者多透過社群媒體與口耳相傳加入，也顯示即使是割草，只要設計出明確、安全且有交流感的參與方式，仍能吸引固定人力。\r\n\r\n【梯田邊坡也成為創作空間】\r\n\r\n新潟縣南魚沼市栃窪則把割草與藝術結合，舉辦「梯田割草藝術日本錦標賽」。參加者利用割草機或鐮刀，在梯田長而寬的田埂與邊坡上割出圖案或文字。\r\n\r\n這項活動吸引不少地區外人士參加，僅學生就超過30人。對地方居民而言，田埂割草仍是勞力密集的工作，但比賽讓作業過程增加了觀賞性與交流，也讓原本安靜的農村多了外來參與者。\r\n\r\n藝術化不會降低割草本身的難度，卻改變了人們看待這項工作的方式。參與者不只是來幫忙，也能留下可見的成果；地方則藉此增加曝光，讓農村景觀維護與活動體驗產生連結。\r\n\r\n【把割草變成競賽，也帶入技術與安全】\r\n\r\n千葉縣鴨川市與山口縣長門市的農村組織，則分別舉辦「割草高峰會」。活動在安全管理下，比較割草後的整齊度與美觀，由地方農民與外來參加者共同參與。\r\n\r\n這類競賽不只是比速度，也讓割草技術、機具操作與安全意識進入公共交流。對沒有農業經驗的人而言，割草看似簡單，實際上涉及坡度、石塊、飛散物、機具反彈與高溫作業等風險。透過活動前說明與現場規範，參與者才可能從一次體驗，逐步累積成可持續協力的人力。\r\n\r\n【「有趣」不能取代安全與合理分工】\r\n\r\n把割草轉化為旅遊、運動或藝術，確實有助於增加關注，但仍不能忽略這是一項高風險勞動。操作割草機需要訓練，坡地與田埂也容易滑倒；夏季作業更須面對熱傷害。\r\n\r\n鹿兒島案例設定講習、保險、3小時上限及熱傷害防範，正是這類活動能否持續的重要基礎。若只強調趣味，卻把困難與風險交給參加者承擔，便很難建立長期信任。\r\n\r\n此外，外來參與者能協助處理部分工作，但不一定能完全取代熟悉地形、農機與作物狀況的在地人力。較可行的方式，是把適合一般參與者的區域、作業與時段切分清楚，由有經驗者負責危險性較高的部分。\r\n\r\n【從單次活動走向持續人力，仍需要制度】\r\n\r\n這些案例真正值得注意的地方，是有些參加者在第一次體驗後願意持續加入。割草旅遊累積約140名固定意願者，顯示參與動機不一定只來自報酬，也可能包括地方交流、共同勞動、技能學習與完成任務的成就感。\r\n\r\n不過，要把這些人轉化為穩定人力，仍需要清楚的媒合機制、責任分工、保險、安全訓練與通知制度。農村也要持續盤點哪些地點需要割草、工作量多大、何時最需要人，以及是否能提供交通、餐食或其他支持。\r\n\r\n換句話說，活動是入口，制度才決定能否長久。\r\n\r\n【草割り娛樂化的核心，是重新設計參與方式】\r\n\r\n日本各地的做法並不是把辛苦工作浪漫化，而是承認割草確實是農村長期負擔，再試著改變外部人口參與的條件。\r\n\r\n觀光提供地方體驗，競賽增加目標感，藝術讓成果可見，交流則讓參與者與社區建立關係。這些元素加在一起，才有機會讓原本只有農民承擔的工作，轉化為更多人願意共同完成的農村任務。\r\n\r\n面對高溫加劇、雜草生長更快與農村人口減少，單靠一次活動當然無法解決所有割草需求。不過，當安全、媒合與地方回饋能妥善設計，這些嘗試至少提供了一個方向：割草人力不一定只能從既有農業人口中尋找，也可以透過新的參與方式，逐步擴大願意投入的人群。\r\n", "public_article_format": "text", "public_date": "2026-08-01", "published_date": "2026-07-27", "public_image_url": "https://i.ibb.co/1YdsYNj6/Chat-GPT-Image-2026-8-1-01-21-41.png", "topic": "G_農村產業創新與六級產業化", "country": "日本", "language": "日文", "source_org": "日本農業新聞", "title_original": "＜ＶＳ雑草＞草刈りエンタメ化　観光やスポーツ、アート&hellip;　継続的な人材確保も / 日本農業新聞公式ウェブサイト", "url": "https://www.agrinews.co.jp/news/index/396233"}, {"id": 160, "public_title": "菸草的尼古丁也會影響根圈微生物組成", "public_summary": "北海道大學、理化學研究所與京都大學合作研究發現，菸草製造的毒性生物鹼「尼古丁」，會被特定根圈細菌節桿菌分解利用，使其在根圈微生物群中取得競爭優勢；此發現有助理解植物代謝物如何形塑根圈微生物叢，未來可望應用於開發永續農業生產技術，成果發表於《Microbiome》期刊。", "public_article": "菸草的尼古丁，也會影響根圈微生物組成\r\n能分解尼古丁的細菌，因而在根圈取得競爭優勢\r\n\r\n植物根部周圍的根圈，聚集大量微生物。這些微生物可協助植物吸收養分，也可能減輕病害、乾旱等壓力，因此植物如何形成並調節根圈微生物相，近年受到高度關注。北海道大學、理化學研究所與京都大學研究團隊發現，菸草產生的毒性生物鹼「尼古丁」，不只具有防禦昆蟲的功能，也會影響根圈微生物的競爭關係。\r\n\r\n【能分解尼古丁的細菌取得優勢】\r\n\r\n研究顯示，特定 Arthrobacter 屬細菌能分解並利用尼古丁，因此在菸草根圈中取得競爭優勢。有趣的是，尼古丁雖然對昆蟲具有強烈毒性，卻沒有明顯抑制多數根圈微生物的生長。這表示同一種植物代謝物，在地上部與地下部可能發揮不同功能。\r\n\r\n【分解能力可能透過水平基因轉移取得】\r\n\r\n研究團隊比較不同環境中分離出的 Arthrobacter 屬細菌基因體後發現，尼古丁分解基因可能透過水平基因轉移在菌株間傳遞。這項結果顯示，植物代謝物會影響根圈微生物相，微生物也會透過基因重組取得適應植物環境的能力。\r\n\r\n未來若能進一步掌握植物代謝物與根圈微生物之間的關係，可能有助於利用微生物功能，發展更永續的農業生產技術。", "public_article_format": "text", "public_date": "2026-08-01", "published_date": "2026-07-27", "public_image_url": "https://i.ibb.co/gM6rhQzq/Chat-GPT-Image-2026-8-1-01-31-10.png", "topic": "C_IPM植物健康與農藥減量", "country": "日本", "language": "日文", "source_org": "www.kyoto-u.ac.jp", "title_original": "植物の毒が微生物のエサになる～タバコが作るニコチンの根圏微生物叢形成における機能を発見～", "url": "https://www.kyoto-u.ac.jp/ja/research-news/2026-07-27"}, {"id": 76, "public_title": "全國知名柑橘產地嘗試轉作國產酪梨，能否成為氣候變遷解方？", "public_summary": "面對持續高溫，果樹產地短期以遮蔭資材因應，中長期則有產地嘗試「樹種轉換」為耐熱作物，但轉作須承擔收益不穩定風險。", "public_article": "從柑橘補充作物到國產酪梨產地\r\n松山市近20年試種經驗顯示，樹種轉換既是氣候調適，也是一場長期產業選擇\r\n\r\n面對高溫加劇，果樹產區常以遮陰、灌溉或生物刺激素等方式降低短期傷害；若從更長時間尺度來看，當原有作物愈來愈難維持品質與產量，改種較適應未來氣候的樹種，也逐漸成為可能選項。不過，多年生果樹從定植到穩定生產需要數年，品種、低溫、土壤與市場條件只要有一項不合適，都可能使轉換成本難以回收。\r\n\r\n日本愛媛縣松山市約在2007年前後開始尋找柑橘以外的補充作物，並於2009年由市立農業指導中心生產酪梨苗木，提供市內農民栽植。這項工作最初並非以氣候變遷為出發點，而是回應伊予柑與溫州蜜柑價格低迷、農家收入來源過度集中的問題。近20年後，當西日本各地開始思考暖化下的樹種調整，松山市累積的經驗也成為觀察果樹轉換風險的重要案例。\r\n\r\n【起點不是暖化，而是柑橘收益下滑】\r\n\r\n松山市屬瀨戶內海式氣候，氣候溫暖、降雨較少，山區又分布排水良好的花崗岩風化土，因此長期以柑橘為主要產業。全市約有1,600個農業經營體以柑橘為主，占農業經營體約55%；2023年農業產值超過130億日圓，其中果樹占一半以上，「紅まどんな」、「せとか」與「甘平」等高級柑橘也已形成品牌。\r\n\r\n不過，約在2007年前後，伊予柑與溫州蜜柑同時面臨供給過剩與消費減少，部分農家只靠柑橘已難以維持收入。松山市當時並未立即要求農民全面更新果園，而是先尋找能補充所得的品項，陸續嘗試露天蔬菜、七草、萊姆與酪梨，最後持續發展的主要是萊姆與酪梨。\r\n\r\n酪梨之所以進入候選名單，是因為市內原本就有人零星栽植，而且結實情況不差。地方政府據此邀請農民共同試作，再由農業指導中心建立育苗與技術輔導機制。這種由既有地方經驗出發、先小規模測試的方式，也降低了直接引進陌生作物的風險。\r\n\r\n【市立農業指導中心成為技術累積的核心】\r\n\r\n松山市農業指導中心由市政府設立，兼具地方試驗與技術推廣功能。相較於服務範圍較大的縣級試驗場，市立單位能把研究焦點集中在當地土壤、氣候、品牌與後繼者培育等問題。\r\n\r\n農業指導中心自2009年起生產酪梨苗木，並以有償方式提供市內農民。這個做法看似只是供應種苗，實際上也建立了較一致的品種來源與技術追蹤基礎。當農民陸續遇到寒害、落果、病害與低產問題時，地方政府可以把個別經驗整理成共同課題，再與生產者一起調整修剪、施肥與開花期管理。\r\n\r\n多年生果樹的技術往往無法在單一季節內完成驗證。從苗木存活、樹冠形成、首次結果到進入穩定產期，每一階段都可能出現不同問題。松山市能持續近20年，關鍵不只在於選對作物，也在於有一個地方技術單位長期保存失敗與成功經驗。\r\n\r\n【氣候變暖，不代表熱帶果樹就能穩定生產】\r\n\r\n松山市目前酪梨栽培面積約15公頃，年產量約7至8公噸。雖然氣候相對溫暖，最大的生產風險仍然是低溫。酪梨屬亞熱帶至熱帶果樹，遇到持續低溫與寒風時，幼苗容易受害，嚴重時連栽植10年的大樹也可能枯死。松山市冬季部分年份仍會降至零下4至5°C，海岸地區受害較輕，內陸田區則可能因冷空氣滯留而出現較大損失。意即，年平均氣溫上升不能直接等同於所有熱帶作物都更適合栽培。暖化同時伴隨氣候波動，冬季短時間急遽降溫、寒風及極端事件仍可能發生。對多年生果樹而言，只要一次嚴重寒害造成樹體死亡，前幾年的投入便可能歸零。\r\n\r\n因此，評估樹種轉換時，不能只看夏季最高溫或年平均溫度，最低溫、低溫持續時間、冷空氣流動與坡向同樣重要。\r\n\r\n【比寒害更難處理的是產量不穩】\r\n\r\n松山市的酪梨生產目前仍未達到柑橘的單位面積產量。柑橘每10公畝有機會收穫3至4公噸，酪梨即使是較高產的生產者，現階段約為400公斤，部分年份甚至幾乎沒有收成。酪梨對開花期環境、樹體養分與水分狀態相當敏感。當著果量超過植株負荷，或溫度、授粉及營養條件不適合時，植株可能大量落果。這也使單看果實單價，容易高估實際收益。\r\n\r\n目前當地持續研究修剪時期與強度、肥料成分與施用時間，以及開花期的管理方式。這些工作代表酪梨產地化尚未進入完全成熟階段，而是仍在建立「如何穩定結果」的基本栽培體系。\r\n\r\n部分農民因寒害、病害或產量不足退出，也有人在苗木枯死後重新栽植。這些不同反應，往往與經營目標有關。原本只想把酪梨作為柑橘補充品項的農家，承擔風險的方式，和準備以酪梨作為主要收入來源的經營者並不相同。\r\n\r\n【高單價提供誘因，但產地不能只靠稀缺性】\r\n\r\n日本市場上的酪梨以進口品為主，國產酪梨具有新鮮、在地與稀少等優勢。若能穩定供應，較高單價確實可能彌補目前偏低的產量，也讓部分農民願意持續投入。松山市目前以「松山酪梨」推動品牌化，農業指導中心負責栽培技術，農林水產振興部門則處理銷售與宣傳。這種技術與市場同步推進的安排，有助於避免只擴大種植，卻沒有建立規格、通路與消費辨識。\r\n\r\n不過，國產稀缺性不會自動形成穩定產業。若產量過少、供貨年份不固定，通路難以建立長期採購；若不同農戶的成熟度、品質與品種差異過大，也不利於共同品牌經營。\r\n\r\n目前松山市栽培「Bacon」、「Fuerte」、「Pinkerton」與「Hass」等4個品種。多品種可分散低溫、開花與採收期風險，但也會增加栽培管理、成熟判斷與市場溝通的複雜度。後續產地能否擴大，除了提高總產量，也要逐步建立品種配置、採收標準與品質分級。\r\n\r\n【樹種轉換需要先回答場地是否適合】\r\n\r\n松山市的經驗顯示，酪梨產地化首先是一項立地評估問題。最低氣溫、土壤排水、日照、風勢與地形，都會影響苗木存活與後續結果。排水尤其重要。松山市部分山坡地分布顆粒較粗的真砂土，原本有利於柑橘生產，也能降低酪梨根部長期積水的風險。但即使同一行政區內，海岸、山坡與內陸低地的微氣候仍可能差異很大，不能以城市平均氣象資料直接判斷個別果園。\r\n\r\n品種選擇也需配合田區條件。有些品種耐寒性較佳，有些則具有較高市場辨識或不同成熟期。若只依市場最常見品種種植，卻未考量冬季低溫與授粉組合，可能在樹體長大後才發現環境不合。\r\n\r\n因此，樹種轉換較適合先從少量田區與多品種試種開始，連續觀察冬季存活、開花、結果、病害與品質，再決定是否擴大，而不是因暖化趨勢便一次替換整片果園。\r\n\r\n【多年空窗期是農家最現實的風險】\r\n\r\n果樹轉換和一年生作物不同。舊樹移除後，新樹要經過數年才能形成可觀產量，期間仍需投入苗木、整地、防風、防寒、修剪與肥培成本。若新作物最後無法穩定結果，農家承擔的不只是當年損失，而是多年收入空窗。松山市最初把酪梨定位為補充品項，而非全面取代柑橘，某種程度上也分散了這項風險。農民可以保留原有柑橘收入，在部分田區累積酪梨經驗，再依成效調整投入程度。\r\n\r\n這種漸進模式比直接宣告「轉作」更符合多年生果樹的實際條件。對地方政府而言，補助苗木只是起點，更重要的是協助農家度過未結果期、建立技術支援、處理寒害後重建，以及評估新作物能否形成市場。\r\n\r\n【氣候調適往往從既有經營問題開始】\r\n\r\n松山市的酪梨計畫並非因氣候變遷政策而啟動，而是從柑橘價格低迷與農家所得問題出發。只是隨著氣溫上升，原本的補充品項又具有新的氣候調適意義。顯示產業調適不一定從氣候模型開始，也可能從市場、勞力與農家收益等既有問題逐步發展。若新作物同時具備較高溫適應性與市場潛力，便可能成為未來產區調整的一部分。\r\n\r\n但這不表示酪梨就是柑橘產區的標準答案。松山市近20年的經驗仍顯示，寒害、落果、低產與技術未成熟等問題尚未完全解決。氣候變暖可能擴大部分作物的適生範圍，也會帶來新的極端事件與病蟲害風險。\r\n\r\n【產地化的目標不是種得出，而是農民能穩定獲利】\r\n\r\n松山市目前希望先將年產量由7至8公噸提高到10公噸以上，長期目標則是建立農民能穩定獲利的國產酪梨產地。這個目標比擴大種植面積更重要。果樹產地是否成立，不能只看苗木數量或參與農戶，而要看成園率、單位面積產量、年際穩定度、商品率、銷售價格與農家實際所得。\r\n\r\n松山市的案例說明，樹種轉換需要市場動機、地方技術單位與生產者長期合作，也要接受多年試錯。對其他正在尋找氣候調適作物的果樹產區而言，最值得參考的或許不是「改種酪梨」，而是先從場地調查、小規模試種與收入風險分散開始，再逐步判斷新樹種是否真正適合成為產業。", "public_article_format": "text", "public_date": "2026-07-25", "published_date": "2026-06-29", "public_image_url": "https://i.ibb.co/ycnwc5f2/Chat-GPT-Image-2026-7-25-02-32-43.png", "topic": "B_氣候韌性與農業風險管理", "country": "日本", "language": "日文", "source_org": "マイナビ農業", "title_original": "全国有数の柑橘産地が挑む、国産アボカドへの樹種転換。気候変動の処方箋となるか", "url": "https://agri.mynavi.jp/2026_06_29_534707/"}, {"id": 114, "public_title": "氣候智慧農業能否擴散，農民之間的信任是關鍵", "public_summary": "Bioversity International與國際熱帶農業中心研究團隊在《Agricultural Systems》發表研究指出，氣候智慧農業創新技術能否從農民間擴散普及，不只取決於技術本身特性，更取決於農民間的信任、互助關係與社會資本。", "public_article": "面對氣候變異加劇與極端事件增加，農業研究持續開發耐旱、節水、土壤管理與氣候風險調適等技術。然而，技術完成後，如何讓農民理解、調整並持續採用，仍是農業推廣的重要課題。生物多樣性國際聯盟與國際熱帶農業中心、哥本哈根大學及蓋茲基金會的研究團隊，分析瓜地馬拉與宏都拉斯514位小農的資料，探討信任、互助與知識分享如何影響氣候智慧農業的擴散。\r\n\r\n研究發現，創新能否進入農村社群，除了技術本身是否有效，也受到農民之間的信任、日常互動與互助關係影響。相較於直接觀察技術採用率，研究團隊更關注一個較早出現的現象：農民是否開始分享經驗、討論問題，並依自身條件調整新作法。\r\n\r\n【技術有效，不代表會自然擴散】\r\n\r\n農業創新的成效，通常在大量農民採用後才接受評估。但技術從示範場域走向更多農戶，中間還經過資訊傳遞、觀察、討論、試做與調整等階段。農民可能先從鄰近農戶得知一項新作法，再觀察對方的田間表現，詢問投入成本與管理細節，最後依自身土地、作物與資源條件調整。這些互動發生時，技術尚未形成大規模採用，卻已進入社群的學習與判斷過程。\r\n\r\n研究團隊因此提出，知識分享可視為創新負責任擴散的早期訊號。當農民開始交換經驗，代表新技術已從單向宣導，進入社群內部的理解、討論與調整。\r\n\r\n這項觀點也提醒，技術擴散不宜只以參訓人數、示範面積或採用戶數衡量。農民是否願意談論、分享及回應他人問題，同樣反映創新能否持續發展。\r\n\r\n【農民之間的信任，比對組織的信任更有影響】\r\n\r\n研究結果顯示，農民愈信任社區內其他農民，愈願意分享氣候智慧農業的知識與經驗。農民之間的關係愈緊密，資訊也較容易在社群內流動。這些關係降低嘗試新技術時的不確定性。農民可以從熟悉的人取得實際經驗，了解某項措施需要多少投入、遇到哪些問題，以及結果是否符合期待。\r\n\r\n相較之下，農民對組織的信任，對知識分享的影響較小。這不表示政府、研究機構或發展組織沒有作用，而是顯示正式推廣單位提供資訊後，農民是否願意採信與轉傳，仍高度依賴社群內部關係。對推廣計畫而言，找出社區中具影響力、願意分享且受到信任的農民，可能比單純增加宣導次數更有效。\r\n\r\n【信任不足時，互助能維持知識流動】\r\n\r\n研究也發現，在農民彼此信任程度較低的社區，互助關係格外重要。如農民願意提供操作指導、共同解決問題或交換田間經驗，即使社群原有信任不強，知識仍有機會持續流動。這類實際協助能降低採用門檻，也讓農民在嘗試新作法時不必獨自承擔所有風險。\r\n互助可能包含共同觀察示範田、借用設備、協助判斷病蟲害、比較不同處理結果，或在作物遭遇乾旱時共同調整管理方式。因此，推廣計畫若只傳遞技術內容，卻沒有建立後續協作與支持安排，農民可能知道一項技術，卻仍缺乏實際試用的條件。\r\n\r\n【知識分享不是單向傳遞】\r\n\r\n研究中的知識分享並非單純把技術手冊交給農民，也不限於講師向學員說明操作步驟。農民在交流過程中，會把技術與自身經驗相互比較，再依土地規模、勞力、資金、氣候及市場條件調整。不同農戶也可能針對相同技術，發展出不同使用方式。這顯示知識擴散是一個社會與在地調整的過程。技術內容在社群中流動時，會接受質疑、驗證與修正。這類互動有助於發現原始設計未考量的限制，也能避免推廣單位把單一作法直接套用到條件差異很大的農場。\r\n\r\n【採用與分享之間具有正向關聯】\r\n\r\n研究團隊也發現，採用氣候智慧農業作法的農民，較常分享相關知識。這顯示實際採用與知識交流彼此連動。農民親自使用一項技術後，較能說明成本、操作方式與成效，也較容易回應其他農民的疑問。當這些經驗進入社群討論，其他農戶便能據此判斷是否適合嘗試。不過，這項關聯並不能直接證明知識分享必然促成採用，也可能是採用後增加了分享意願。研究的重點在於，兩者關係密切，推廣計畫應同時觀察農民的實際行動與社群交流。\r\n\r\n【推廣工作應把社會關係納入設計】\r\n\r\n對政府、研究機構與發展組織而言，這項研究指出，創新擴散不能只靠技術訓練、示範場域或補助。計畫設計還需考量農民之間如何互動、誰是主要資訊來源，以及社區內是否存在互助網絡。具體作法可能包括培養農民講師、安排同儕交流、支持共同試驗，或建立小型學習群組。推廣人員也可觀察哪些農民經常接受他人詢問、哪些人願意公開失敗經驗，以及哪些社群成員能跨越不同群體分享資訊。這些角色未必是職務上的領導者，卻可能是實際影響技術擴散的關鍵節點。\r\n\r\n許多農業計畫習慣在期末統計採用戶數、面積與產量變化，但技術擴散通常需要較長時間。若只看最終採用，可能難以及早判斷推廣策略是否有效。研究團隊建議，可把知識分享納入前期評估，包括農民是否主動詢問、是否與鄰近農戶討論、是否分享試作結果，以及是否依自身條件調整技術。這些指標能協助計畫團隊了解，技術是否已進入社群學習過程。即使正式採用比例仍低，也能判斷哪些作法開始受到關注，哪些資訊仍未獲得信任。\r\n\r\n【負責任擴散需要保留調整空間】\r\n\r\n研究採用「負責任擴散」的觀點，強調創新擴大時需回應在地條件，也要留意可能產生的負面影響。一項技術在示範場表現良好，進入不同地區後，可能受到土地權屬、性別分工、勞力需求、資金與市場等因素限制。若推廣速度過快，弱勢農戶也可能因無力投入而遭到排除。農民之間的知識分享能提早揭露這些問題。當使用者公開討論操作困難、成本負擔與環境差異，計畫團隊便有機會在擴大前調整設計。因此，社群交流既是傳播管道，也是技術接受檢驗與修正的過程。\r\n\r\n這項研究分析瓜地馬拉與宏都拉斯參與氣候智慧村計畫的小農，結果反映特定社區與計畫環境，不能直接推論所有地區都具有相同關係。研究補充了農業創新推廣中容易忽略的一環，即技術完成研發後，還需要有人願意說明、示範、回應疑問，並協助他人調整。農民通常不會只依據單一研究報告決定採用新作法。他們也會參考鄰近農戶的結果、評估風險，並確認遇到問題時是否有人可以協助。因此，推動氣候智慧農業時，除了提升技術品質，也要建立讓知識能持續流動的社群條件。信任、互助與同儕學習若能納入推廣設計，創新才較有機會適應在地需求，並逐步擴大。\r\n\r\n", "public_article_format": "text", "public_date": "2026-07-25", "published_date": "2026-07-24", "public_image_url": "https://i.ibb.co/4ZbmLqn4/Chat-GPT-Image-2026-7-25-01-11-52.png", "topic": "B_氣候韌性與農業風險管理", "country": "國際", "language": "英文", "source_org": "Phys.org 農業", "title_original": "Trust among farmers is key to scaling climate-smart innovations", "url": "https://phys.org/news/2026-07-farmers-key-scaling-climate-smart.html"}, {"id": 115, "public_title": "科羅拉多州立大學研究：土壤有機碳可提升產量，但極端乾旱下幫助有限", "public_summary": "科羅拉多州立大學研究發表於《Global Change Biology》，發現土壤有機碳對作物產量的助益在「中等水分供應」條件下最明顯，極端乾旱時效果有限，修正了「土壤有機碳在乾旱時特別有幫助」的普遍認知。", "public_article": "土壤有機碳能提高產量，但無法抵銷極端乾旱\r\n美國研究顯示，增產效益在中等水分條件下最明顯，也有助穩定年際產量\r\n\r\n增加土壤有機碳，常被視為提升農地保水與氣候韌性的做法。許多推廣論述進一步主張，土壤有機碳在乾旱年份尤其重要，能協助作物維持產量。不過，美國科羅拉多州立大學研究團隊分析玉米、大豆與春小麥資料後發現，這項效益並不會隨乾旱加劇而持續增加。研究結果顯示，土壤有機碳確實能提高整體產量，也能降低不同年份間的產量波動，但其效益在水分供應適中的條件下最為明顯。當乾旱嚴重到土壤幾乎沒有可利用水分時，即使土壤具備較高保水能力，也無法為作物提供實際幫助。\r\n\r\n\r\n【土壤有機碳能保水，但前提是土壤裡要有水】\r\n\r\n土壤有機碳可改善土壤結構，增加孔隙與保水能力，也能提高養分保持與微生物活動。這些特性有助於作物在降雨不穩定或短期缺水時，取得較穩定的水分與養分。不過，保水能力並不等於可以在沒有水的情況下產生水分。當降雨過少、土壤含水量降至極低時，土壤即使能多保留一些水，實際可供根系吸收的水量仍可能不足。\r\n\r\nNathan Mueller指出，植物要從土壤有機碳增加中獲得效益，土壤裡必須先有一定水分。當水分供應極度受限時，土壤有機碳無法突破作物的基本水分需求。這也解釋為何研究沒有觀察到「愈乾旱，土壤有機碳愈有幫助」的線性關係。\r\n\r\n【最大效益出現在中等水分條件】\r\n\r\n研究團隊發現，土壤有機碳對作物產量的正面影響，在水分條件適中時最明顯。這類年份既不是完全理想，也不是極端乾旱，土壤仍保有足夠水分，但作物可能面臨間歇性缺水或較高蒸散需求。在這種情況下，較高的土壤有機碳能延緩土壤乾燥，使根系在降雨間隔期間仍可取得水分，也能降低短期水分波動對生長的影響。相較之下，水分非常充足時，土壤保水能力帶來的額外效益較小；極端乾旱時，則因水分總量不足，土壤有機碳的保水優勢難以轉化為產量。因此，土壤有機碳的價值並不只體現在災害年份，而是更常在一般偏乾或水分供應不穩定的年份累積。\r\n\r\n【不必等到極端乾旱，增產效益就會出現】\r\n\r\nAlison King指出，農業推廣中常說土壤有機碳「特別能幫助作物度過乾旱」，但這串推論過去較少接受完整檢驗。這次研究確認，土壤有機碳在乾旱條件下仍有正面作用，但最大效益並非出現在最嚴重的乾旱，而是在接近正常或中度缺水的生長條件。換言之，土壤有機碳管理的主要價值，可能不是在最糟年份「救回全部產量」，而是在多數年份提高生產效率並減少波動。\r\n\r\n【研究涵蓋玉米、大豆與春小麥】\r\n\r\n研究團隊選擇玉米、大豆與春小麥，這三類作物在美國主要依賴自然降雨生產，栽培範圍涵蓋多種土壤與氣候條件。研究人員整合美國農業部數十年的縣級產量紀錄，再搭配每日土壤水分與大氣水分需求資料，建立模型分析不同天候下的產量敏感度，以及土壤有機碳如何改變這些反應。大氣水分需求反映空氣從土壤與植物帶走水分的能力。當溫度高、空氣乾燥或風速較強時，作物蒸散壓力會提高，即使土壤仍有水分，植株也可能更快進入缺水狀態。透過同時分析土壤水分與大氣需求，研究團隊得以區分「土壤裡有多少水」與「作物失水速度有多快」兩種影響。\r\n\r\n【土壤有機碳也能降低年際產量波動】\r\n\r\n除了提高平均產量，研究也發現，土壤有機碳較高的地區，作物產量在不同年份之間相對穩定。\r\n\r\n農業生產面臨的風險不只來自平均產量偏低，也包括年度差異過大。即使多年平均產量相近，若某些年份大幅減產，仍會影響現金流、契作履約與農場經營安全。土壤有機碳提高保水與保肥能力後，可在降雨時間不均、短期乾旱或高蒸散條件下，提供一定緩衝。這些作用未必能防止極端災害，但有助於減少一般年份中的生長波動。研究團隊指出，這是首度在美國全國尺度量化土壤有機碳對作物產量韌性的潛在貢獻。\r\n\r\n\r\n【土壤有機碳的效益需要長期累積】\r\n\r\n提高土壤有機碳通常需要持續投入，包括作物殘體還田、覆蓋作物、減少土壤擾動、施用有機資材及增加根系生物量等。實際累積速度會受到氣候、土壤質地、耕作制度與有機質分解影響。這些措施的效益也不只表現在產量。土壤有機碳增加後，可能同時改善團粒結構、入滲、保肥力與微生物活動，並降低沖蝕風險。不過，不同田區的起始條件與管理成本差異很大。某些土壤較容易累積有機碳，另一些高溫、排水良好或長期密集耕作的田區，則可能需要更長時間才能觀察變化。\r\n\r\n對農民而言，較適合的評估方式不是期待短期內抵銷一次極端乾旱，而是觀察多年產量穩定性、土壤水分變化與投入效益是否逐步改善。\r\n\r\n", "public_article_format": "text", "public_date": "2026-07-25", "published_date": "2026-07-23", "public_image_url": "https://i.ibb.co/ZtXGn1M/Chat-GPT-Image-2026-7-25-01-56-38.png", "topic": "B_氣候韌性與農業風險管理", "country": "國際", "language": "英文", "source_org": "Phys.org 農業", "title_original": "Soil organic carbon increases crop yield but can't help with extreme drought", "url": "https://phys.org/news/2026-07-soil-carbon-crop-yield-extreme.html"}, {"id": 117, "public_title": "韓國全南大學開發AI系統，大幅提升果園地圖測繪與建模精準度", "public_summary": "韓國全南大學團隊針對商業果園規模大、樹木密集、結構複雜的挑戰，結合無人機空拍與地面機器人光達技術，開發新AI系統，改善精準農業所需的果園3D建模與地圖測繪精準度。", "public_article": "空拍與地面機器人如何共同建立果園數位模型\r\nAI整合無人機影像與LiDAR資料，降低林冠遮蔽及長距離定位誤差\r\n\r\n精準農業要進一步導入果實產量估算、局部噴藥、樹體表型調查與自動採收，首先需要一張能準確反映果園空間與樹體結構的數位地圖。問題在於，商業果園面積大、果樹排列密集，枝葉也會遮蔽樹幹及地面，使單一感測方式很難同時掌握全區位置與樹體細節。\r\n\r\n韓國全南大學研究團隊開發一套跨感測資料融合系統，將低空無人機拍攝的遙測影像，與地面機器人蒐集的光達及慣性量測資料整合。無人機先提供果園的整體地理位置，地面機器人再補充林冠下方與單株樹體的立體結構，人工智慧則負責辨認兩類資料中的相同樹列、林冠形狀與開放空間，將細部量測準確放回整座果園地圖。研究以蘋果園進行測試，地面機器人行駛約1.3公里後，定位誤差仍能控制在數公分尺度，並較傳統方法有效抑制長距離移動所累積的偏移。\r\n\r\n【空拍掌握全區位置，卻看不到林冠下方】\r\n\r\n無人機搭配全球導航衛星系統，可以快速拍攝大面積果園，並將多張影像拼接成具有地理座標的正射影像。從空中可辨識果園邊界、樹列配置與林冠覆蓋，也適合建立全區基礎地圖。不過，果樹枝葉密集時，空拍影像主要記錄林冠上方，樹幹、枝條、地面及樹列間通道容易受到遮蔽。若要量測樹高、冠層結構，或引導機器人在樹列間行駛，僅靠空中影像仍然不足。季節也會改變影像外觀。開花、著果、枝葉繁茂與落葉後的果園，在色彩與紋理上差異很大，使依賴外觀特徵的定位方法容易失準。\r\n\r\n【地面光達能看見樹體細節，長距離移動卻會逐漸偏移】\r\n\r\n搭載光達與慣性量測單元的地面機器人，可在行進過程中發射雷射並量測回波，建立樹幹、枝葉、地面及通道的三維點雲。相較於空拍影像，這類資料更適合呈現單株果樹結構與林冠下方環境。機器人通常會依據連續量測結果推估自身位置，稱為光達—慣性里程計。短距離內可保持相當高的精度，但每一次推算都可能產生些微誤差，行駛距離愈長，偏移便會逐步累積。果園林冠也會削弱衛星訊號，使地面機器人無法持續依賴全球導航衛星系統修正位置。當樹列外觀高度重複時，機器人還可能把相似位置互相混淆，導致整體地圖扭曲或錯位。\r\n\r\n【AI辨認不同感測資料中的相同結構】\r\n\r\n研究團隊的做法，是讓無人機地圖成為地理位置基準，再利用深度學習尋找空拍影像與地面光達資料之間的對應關係。團隊先由無人機依規劃航線拍攝蘋果園，製作高解析度正射影像，並將影像切分為不同區塊。地面機器人則在相同區域行駛，蒐集光達點雲與慣性資料。\r\n\r\n三維點雲接著轉換成由上往下觀看的二維鳥瞰圖，保留林冠高度、表面反射及局部結構密度等資訊。雖然空拍影像與光達鳥瞰圖的外觀不同，兩者仍會呈現相同的樹列方向、林冠分布及通道位置。AI模型透過雙分支架構，分別提取空拍影像與光達鳥瞰圖的特徵，再以跨注意力機制比較兩類資料，找出同一區域中的對應結構。後續再進行多尺度位置修正，逐步縮小兩張圖之間的偏差。\r\n\r\n找到對應位置後，系統會利用空拍地圖修正地面機器人的移動軌跡，再將校正結果納入位姿圖估計。這項方法不是只修正單一時間點，而是同時考量機器人移動前後的位置關係，使整段路徑保持一致。完成融合後，果園數位模型可同時包含兩種資訊：一是由無人機提供的全區地理位置與林冠分布，二是由地面光達取得的樹體高度、結構密度及樹列細節。\r\n\r\n這種分工能補足兩類感測方法的限制。空拍影像缺乏林冠下方資訊，但位置範圍完整；地面機器人能取得高解析度三維資料，卻容易在長距離移動後發生漂移。將兩者結合後，細部資料便能準確放回整體果園空間。\r\n\r\n【季節變化下仍能維持定位穩定】\r\n\r\n果園影像會隨季節改變，傳統影像配對方法若過度依賴顏色與紋理，容易因葉量、光線及地表狀態不同而失效。研究團隊的模型較重視樹列配置、林冠輪廓與空間結構，因此面對季節差異時仍能維持配對能力。測試結果顯示，系統在約1.3公里的行駛範圍內，定位精度可達數公分尺度，長距離偏移也明顯低於傳統方法。\r\n\r\n不過，研究結果來自特定蘋果園。不同果樹種類、整枝方式、坡度、樹列間距與林冠密度，都可能影響模型判讀。若果園缺乏規則樹列，或枝葉嚴重交錯，仍需進一步驗證。\r\n\r\n【數位果園模型可支援哪些作業】\r\n\r\n準確的果園地圖並非單純用於視覺呈現，而是農業機器人執行工作的空間基礎。機器人需要知道樹列、通道與障礙物的位置，才能規劃巡檢、割草、運輸、噴藥與採收路徑。若定位持續漂移，設備可能重複作業、遺漏區域，甚至接近樹幹或撞擊設施。融合後的數位模型也可用來量測樹高、冠層體積及結構差異，再搭配影像或其他感測資料，分析樹勢與健康狀態。若能持續更新，便可比較不同季節與年度的變化，作為修剪、施肥、病害監測與產量估算的參考。\r\n\r\n研究團隊將這種持續更新的架構稱為果園的「動態數位模型」。它不只是一次性的測繪成果，而是隨著植株生長、季節變化與田間作業持續修正的資料基礎。\r\n\r\n這套系統已考量在嵌入式設備上運行，意味未來可能直接部署於農業機器人，而不必將所有資料送回高效能電腦處理。若能即時修正定位，機器人便能在行進中持續對照全區地圖。不過，實際導入仍涉及無人機測繪、光達設備、資料處理與模型維護成本。果園也需要建立可重複使用的基礎地圖，並在植株與地形明顯改變後重新更新。\r\n\r\n此外，數公分定位精度不代表機器人已能自動完成所有農務。噴藥還需辨識目標位置與風場，採收需要判斷果實成熟度及遮蔽，運輸則要處理人員、機具與臨時障礙。地圖提供的是共同空間基礎，後續仍需結合不同作業模組。\r\n", "public_article_format": "text", "public_date": "2026-07-25", "published_date": "2026-07-22", "public_image_url": "https://i.ibb.co/6cNFrrhw/Chat-GPT-Image-2026-7-25-02-10-14.png", "topic": "A_智慧農業與資料治理", "country": "國際", "language": "英文", "source_org": "Phys.org 農業", "title_original": "Researchers develop new AI system for highly accurate mapping and modeling of orchards", "url": "https://phys.org/news/2026-07-ai-highly-accurate-orchards.html"}, {"id": 122, "public_title": "英國基因編輯新創Phytoform攜手主要種子公司，以AI設計玉米株型", "public_summary": "英國基因編輯新創Phytoform與美國Beck's Hybrids、國際育種公司RAGT合作，運用AI平台CRE.AI.TIVE改善玉米整體株型結構以提升產量。研究顯示全球均溫每升高1°C，玉米產量約減少7.4%。", "public_article": "AI結合基因編輯，調整玉米整株架構\r\nPhytoform與兩家種子公司合作，從既有優良種原中微調基因表現\r\n\r\n玉米產量不只取決於單一性狀，也受到株高、葉片角度、穗位、根系、莖稈強度與養分分配等整株架構影響。當氣候升溫、病害壓力增加，生產成本也持續上升，如何讓植株更有效利用光照、氮肥與生長空間，已成為育種的重要課題。英國基因編輯新創公司Phytoform近期與美國家族型種子公司Beck’s Hybrids及國際育種公司RAGT合作，運用AI與基因編輯技術改善玉米整株架構。合作內容尚未公開具體性狀，但目標是調整植株在結構層面的生長方式，提高可收穫產量與生產效率。\r\n\r\n這項合作並非另行建立全新品種，而是從種子公司既有的優良種原出發，找出可微調的DNA序列，再將編輯材料導回原有育種體系。AI負責縮小候選範圍，真正的效果仍需透過生物試驗與田間驗證確認。\r\n\r\n【整株架構會影響作物如何利用環境資源】\r\n\r\n玉米植株的外觀與結構，會直接影響田間生產表現。葉片角度決定不同株層能取得多少光線，穗位與株高影響倒伏及機械收穫，根系與莖稈則關係到水分、養分吸收與植株支撐能力。當種植密度提高時，植株彼此競爭光照、水分與氮素。若葉片過度水平展開，上層可能截留大部分光線，使下層葉片利用效率下降；若株型更緊湊，則可能提高單位面積的種植密度與冠層受光效率。\r\n氣候逆境也會放大架構差異。高溫與乾旱可能改變生長速度、授粉及籽粒充實，強風與暴雨則增加倒伏風險。整株架構育種的目的，是讓不同器官之間形成較合適的配置，而不是只追求單一部位變大或生長更快。\r\n\r\n【Phytoform利用AI尋找可微調的DNA序列】\r\n\r\nPhytoform開發的CRE.AI.TIVE平台，以機器學習分析植物DNA序列，尋找少量改變後可能產生有利性狀的位置。這種方法不是把外來基因導入植物，也不以完全刪除基因為主要方向，而是調整植物原有基因的活性。公司會設計短小的DNA序列變化，使目標基因的表現時間、位置或強度更符合育種需求。以玉米整株架構為例，平台可能先找出與葉片角度、莖稈生長、穗位或養分分配相關的基因，再分析哪些調控序列適合微調。這些候選位置進入基因編輯與植株試驗後，才能確認是否真的改變架構，以及是否伴隨其他生育影響。\r\n\r\nAI的功能主要是協助排序與預測，減少需要逐一測試的候選序列數量。它不能直接跳過育種與田間試驗。\r\n\r\n【技術用來加速育種，不取代育種公司】\r\n\r\n這項合作結合三方不同能力。Phytoform提供AI與基因編輯平台，Beck’s與RAGT則提供玉米育種經驗、專有種原、商業市場資訊及部分開發資源。兩家種子公司原本就擁有育種材料與品系，也熟悉不同區域的生產需求。Phytoform的角色，是協助針對特定問題設計DNA微調方案，再由育種公司將驗證後的材料導入既有品種。\r\n\r\n\r\n【AI預測必須回到真實植株驗證】\r\n\r\nPhytoform共同創辦人William Pelton指出，農業領域經常把AI描述成可以快速找到答案的工具，但目前仍無法把模型輸出直接移到田間，便期待第一次就成功。DNA序列的作用會受到遺傳背景影響。同一項編輯放入不同玉米品系後，可能出現不同程度的表現，甚至產生未預期的生長變化。溫室中的株型改善，也不代表在高溫、密植、缺氮或病害壓力下仍能維持優勢。\r\n\r\n合作計畫因此會把重點放在真實材料驗證。候選編輯完成後，需要觀察植株架構、產量構成、倒伏、成熟期與環境適應性，再判斷是否適合導入商業育種。驗證完成後，Phytoform會把編輯材料交給Beck’s與RAGT，讓兩家公司放入各自的育種種原中，進一步測試與推向市場。\r\n\r\n【從既有優良種原微調，可降低育種轉換成本】\r\n\r\n傳統導入新性狀時，育種人員常需將目標基因從供體材料轉入商業品系，再經過多代回交，盡量保留原有優良特性。若供體材料與商業品系差異較大，過程可能耗時多年。Phytoform的做法是直接在既有優良種原中調整原生基因表現，理論上可減少重新整合大段外來遺傳材料的需求。\r\n\r\n這對種子公司具有實際吸引力。已在市場上表現良好的品種，通常累積了產量、成熟期、品質與區域適應性等多項優勢。若能只修改少數DNA序列，加入所需架構性狀，便可能保留大部分原有特徵。不過，所謂「小幅修改」不代表影響一定很小。植物基因彼此連動，任何性狀都可能涉及多重生理途徑，仍需完整檢查農藝與品質表現。\r\n\r\n\r\n【合作將優先面向主要玉米市場】\r\n\r\n這項合作預計先鎖定美國、南美洲，並可能延伸至歐洲。Beck’s主要服務美國中西部玉米帶，RAGT則在約50個國家經營育種與種子業務。不同市場對玉米架構的需求並不相同。美國大面積機械化生產重視密植、倒伏、成熟一致性與機收效率；南美洲部分地區則需面對高溫、病害與不同播種季節；歐洲市場又有不同氣候、法規與品種需求。同一項編輯性狀是否能跨區使用，需視環境與種原背景而定。合作方可能需要在不同育種材料中重新驗證，才能確認其適用範圍。\r\n\r\nPhytoform將CRE.AI.TIVE定位為不受特定作物限制的平台。公司除玉米外，也曾投入番茄性狀開發，並與Corteva合作研究玉米病害抗性。從技術原理來看，只要具備基因體資料與可操作的編輯系統，平台便可能延伸至其他作物。然而，不同植物的基因調控、再生難度與育種週期差異很大。\r\n\r\n玉米、番茄與多年生果樹，即使使用相同的AI分析概念，實際驗證速度與商業化路徑仍會不同。部分作物容易完成組織培養與再生，另一些作物則可能在基因編輯後花費多年才能進入產量評估。因此，「跨作物」較準確的意義，是分析方法具有延伸可能，而不是同一套候選序列可以直接套用到所有植物。\r\n\r\n", "public_article_format": "text", "public_date": "2026-07-25", "published_date": "2026-07-20", "public_image_url": "https://i.ibb.co/27WvjDFP/Chat-GPT-Image-2026-7-25-02-24-30.png", "topic": "A_智慧農業與資料治理", "country": "國際", "language": "英文", "source_org": "AgFunder News", "title_original": "Phytoform partners with major seed breeders to bring AI-powered plant design to corn crops", "url": "https://agfundernews.com/phytoform-partners-with-major-seed-breeders-to-bring-ai-powered-plant-design-to-corn-crops"}, {"id": 127, "public_title": "番茄見好就收，茄子撐到底：日本農家夏季蔬菜的抗暑管理術", "public_summary": "農家專欄作者分享番茄與茄子因應日本酷暑的不同管理策略：番茄原生南美高地、不耐高溫多濕，30°C以上易授粉不良，以遮光網與有機覆蓋降溫為主；茄子原生印度熱帶、較耐濕熱，靠充分灌溉與覆蓋維持生長。", "public_article": "遮陰、覆蓋、灌溉與分批更新，協助夏季蔬菜度過高溫與乾旱\r\n\r\n（本文翻譯自日本網頁，作物皆為日本產期）\r\n\r\n盛夏氣溫快速升高，戶外農作時間也隨之縮短。清晨日出前後較適合巡田、採收與澆水，上午8時以後，日照與熱負荷明顯增加，長時間作業容易造成身體負擔。夏季管理除了照顧作物，也要先調整工作時段，避免在高溫時段作業。\r\n\r\n7月是番茄、茄子、小黃瓜等夏季蔬菜的採收高峰，秋葵與埃及國王菜（相似麻芛）則逐漸進入旺盛生長期。不過，不同作物對高溫與乾旱的反應差異很大。有些作物需要遮陰、覆蓋與補水，有些適合提早結束採收，另行安排下一批作物。夏季管理的重點，在於判斷作物是否還具有恢復與持續生產的能力，再決定維持、更新或轉作。\r\n\r\n【番茄以遮陰與有機覆蓋降低高溫傷害】\r\n\r\n番茄原生於南美洲安地斯山區，適合生長的溫度約為15至25°C。當氣溫長時間超過30°C，花粉活性下降，容易出現授粉不良與著果率降低。此時即使植株已經結果，後續果實發育仍有賴葉片與根系維持正常功能。\r\n\r\n露天番茄可利用遮光網減弱強光，株基部則鋪設稻草、稻殼或割草，降低地溫並減少土壤水分散失。若設置避雨設施，宜保留側面通風，避免熱氣累積；遮光網可鋪設於棚頂外側，兼顧避雨與降溫。\r\n\r\n乾旱期間也要留意水分供應。土壤過乾時，根系吸收養分的能力下降，果實容易因鈣吸收不足出現尻腐病。這類生理障礙常見於高溫季節，管理上不能只補充肥料，也要維持穩定土壤水分。\r\n\r\n若遮陰、覆蓋與灌溉後，植株仍因高溫持續衰弱，便可評估提前結束栽培。與其勉強延長採收，不如整理田區，準備下一期作物。希望延長番茄收穫期時，也可依春季氣溫提早定植，使主要採收期避開8月最炎熱時段。\r\n\r\n【茄子耐熱性較高，但水分不足會快速衰弱】\r\n\r\n茄子的原生地位於印度東部熱帶地區，對高溫與濕潤環境的適應能力高於番茄。不過，近年夏季高溫仍可能使茄子開花與著果受阻。茄子需水量較高，生產者常以「茄子靠水長大」形容其生育特性，水分與肥力不足都會影響果實生長。\r\n\r\n株基部鋪設厚層稻草或割草，可降低地溫、維持土壤濕度，也有抑制雜草的作用。連續數日未降雨時，澆水不宜只濕潤表土，每株可視土壤與植株大小補充約2至5公升水，使水分進入根系主要分布區。部分因乾旱而衰弱的植株，在充分灌溉後仍能恢復生長。\r\n\r\n茄子生長期間也容易因側芽增加而使枝葉過密。修剪時不必拘泥單一整枝形式，可優先移除交錯、重疊與阻礙通風的枝條，讓樹冠內部保持適度採光與空氣流動。\r\n\r\n只要植株根系與主要枝條仍健康，即使盛夏一度停止著果，入秋後仍可能重新開花結果。另一種做法是在6月下旬至7月下旬另行定植一批茄苗，讓較年輕的植株承接秋季生產，避免長期維持已衰弱的老株。\r\n\r\n【小黃瓜與南瓜類適合分批更新】\r\n\r\n小黃瓜、櫛瓜與南瓜等瓜類作物多屬短期集中生產。植株連續結果約一個月後，容易因養分消耗、枝葉老化與病害累積而衰弱，白粉病等問題也會增加。\r\n\r\n小黃瓜若管理良好，採收期可能延續2至3個月，但若7月下旬前仍能播種，通常另行建立新株，比勉強延長老株壽命更容易維持果實品質。早春定植的植株進入7月後逐漸衰弱，新一批植株則可承接秋季採收。\r\n\r\n南瓜若在7月下旬前完成定植，約可於10月前後採收。這類延後栽培的南瓜耐貯藏，常成為秋冬市場供應來源。透過分批播種與定植，可以把夏季採收延伸至秋季，也能降低單一批次遭受高溫、病害或颱風影響的風險。\r\n\r\n【秋葵與埃及國王菜在高溫下生長旺盛】\r\n\r\n相較於番茄、茄子與小黃瓜，秋葵和埃及國王菜較能適應高溫。兩者均源自非洲地區，氣溫超過30°C後，通常會加速生長。\r\n\r\n秋葵開花後約4至5日即可採收。若栽培株數較多，盛產期幾乎需要每日採收。果莢採下後，可剪除其下方老葉，減少枝葉擁擠並改善通風。管理良好時，植株高度可能接近2公尺，採收期可延續至10月前後。\r\n\r\n埃及國王菜則以摘取枝梢的方式採收。摘心後，側芽會持續萌發，進一步增加收量。夏季管理以採收與水分補充為主；若葉片縮小或捲曲，通常代表土壤水分不足。秋葵若出現彎曲果或表面瘤狀突起，也可能與水分或肥力不足有關。\r\n\r\n【耐旱與需水作物應分開管理】\r\n\r\n玉米、毛豆與西瓜進入盛夏後，多數已接近採收尾聲，管理工作相對減少。甘藷耐高溫與乾旱，夏季通常能維持旺盛生長，短期內不需頻繁澆水。\r\n\r\n里芋與薑則相反。兩者對乾旱較敏感，土壤缺水會直接影響根莖膨大與最終產量。管理上應鋪設稻草或割草，並在降雨不足時持續灌溉。\r\n\r\n即使都屬於夏季作物，水分需求仍有明顯差異。若以同一套灌溉方式管理整片菜園，容易造成耐旱作物過濕，需水作物又得不到足夠水分。因此，夏季灌溉宜依作物種類、土壤質地與植株生育階段分區調整。\r\n\r\n【有機覆蓋是多數夏季作物的基礎措施】\r\n\r\n高溫期間，多數蔬菜都能從有機覆蓋中受益。稻草、稻殼與割草能遮蔽土壤表面，降低地溫與蒸發，也能讓雨水與灌溉水逐步滲入土壤。相較於塑膠布，有機覆蓋的透氣與透水性較佳，夏季較不容易造成土壤熱量累積。\r\n\r\n覆蓋材料應鋪設足夠厚度，過薄時容易迅速乾燥或遭風吹散。使用割草時，也要避免混入已結籽的雜草，減少後續雜草問題。\r\n\r\n有機覆蓋不能完全取代灌溉，但能延長土壤保水時間，使澆水效果維持更久。當植株剛出現高溫與乾旱壓力時，覆蓋配合充分補水，通常比單純增加施肥更有效。\r\n\r\n【夏季管理也要同步準備秋作】\r\n\r\n夏季蔬菜進入衰退期後，是否繼續投入管理，需要衡量植株健康、後續著果能力與工作成本。若植株已嚴重老化、病害增加或高溫下難以恢復，及早清園可避免持續占用土地與勞力。\r\n\r\n8月起可陸續準備甘藍、青花菜等秋季蔬菜育苗。此時白天氣溫仍高，育苗場所需要遮陰、通風與穩定水分，也要避免幼苗徒長或遭受高溫傷害。\r\n\r\n夏季菜園管理的目標，並非讓每一株蔬菜無限延長採收期，而是讓作物在適合的季節發揮生產力，再透過分批栽培與更新維持供應。當高溫超過作物承受範圍，適時結束、更新或轉換作物，往往比持續搶救更符合生產效益。\r\n\r\n最後仍要回到人員安全。清晨完成採收、澆水與必要管理，中午前減少戶外作業，並補充水分與休息。作物可以重新播種，農務工作也能調整時程，高溫下不應以延長工作時間換取有限的管理效果。\r\n", "public_article_format": "text", "public_date": "2026-07-25", "published_date": "2026-07-24", "public_image_url": "https://i.ibb.co/VYqtZv3g/Chat-GPT-Image-2026-7-25-01-21-37.png", "topic": "C_IPM植物健康與農藥減量", "country": "日本", "language": "日文", "source_org": "マイナビ農業", "title_original": "トマトは見切り、ナスは粘る。猛暑を乗り切る夏野菜の管理術【DIY的半農生活Vol.54】", "url": "https://agri.mynavi.jp/2026_07_25_552413/"}, {"id": 129, "public_title": "愛知製鋼推出提升鐵營養吸收的生物刺激素產品，因應氣候變遷嚴苛環境", "public_summary": "愛知製鋼推出「鐵力あぐり」「鐵力あくあ」等生物刺激素產品，宣稱可提升作物對鐵營養的吸收效率，作為因應氣候變遷下嚴苛栽培環境的對策（本文擷取不完整，僅能依標題與局部內容整理，細節待回查原文）。", "public_article": "從特殊鋼到田間管理：鋼鐵業如何跨入植物鐵營養研究\r\n土壤裡有鐵，不代表作物吸得到；環境逆境也會改變根系取得鐵的能力\r\n\r\n鋼鐵業與農業看似距離很遠，兩者卻因「鐵」產生交集。日本愛知製鋼原本從事特殊鋼與熱處理技術研究，約在2000年前後，研發人員將特殊製程產生的二價鐵材料施入土壤，意外觀察到植物生長改善。這項發現促使公司進一步研究不同形態的鐵如何影響植物吸收，並逐步跨入農業資材與植物營養領域。\r\n\r\n這個案例有趣之處，不只在於鋼鐵企業跨界投入農業，也重新說明了鐵與田間管理的關係。土壤通常不缺鐵，但鐵的化學形態、土壤酸鹼值、根系活性及溫度、日照等環境條件，都會影響植物能否使用。缺鐵不一定代表施肥量不足，也可能是根部在逆境下失去正常吸收能力。\r\n\r\n【農業應用來自一項原本缺乏用途的鋼鐵材料】\r\n\r\n愛知製鋼是豐田集團旗下的特殊鋼製造商。公司研究特殊熱處理技術時，產生了一種以氧化亞鐵為主的材料。這項材料起初未被視為具有明確的產業用途，但研發人員嘗試施入土壤後，發現部分植物的生長狀況有所改善。後續研究方向也由材料本身，逐漸轉向植物如何取得鐵。公司於2003年開始將相關材料商品化，2007年進一步投入農業領域，並發展固體與液體型的鐵資材。\r\n\r\n這段歷程反映跨領域創新的常見路徑。鋼鐵業原有的材料製程與氧化還原知識，轉換到農業後，研究問題不再是如何製造鋼材，而是不同鐵形態進入土壤後，能否提高植物的利用效率。\r\n\r\n【土壤含鐵豐富，植物仍可能缺鐵】\r\n\r\n鐵是植物生長所需的微量元素，參與葉綠素形成、光合作用、呼吸與多種酵素反應。需求量雖然不如氮、磷、鉀，但供應不足時，仍會影響葉片生長與能量代謝。多數旱地土壤中並不缺乏鐵，問題在於鐵經氧化後，多以較難溶解的三價鐵存在。多數非禾本科作物需要利用根部的鐵還原酵素，先將三價鐵還原為二價鐵，才能經由根系吸收。\r\n\r\n因此，土壤檢測顯示總鐵含量充足，不代表作物一定不會缺鐵。當土壤pH值偏高、根系活性下降或水分與通氣狀況不佳時，鐵可能留在土壤中，卻無法有效進入植株。愛知製鋼的相關研究即以這個問題為基礎：一方面提供植物較容易吸收的二價鐵或有機酸鐵錯合物，另一方面觀察這些材料是否能協助根部維持鐵還原與吸收功能。\r\n\r\n【低溫、低日照與著果負擔，都可能降低鐵吸收】\r\n\r\n公司投入農業市場後，曾從各地生產者回饋中發現，相關鐵資材在梅雨、低溫及日照不足期間，較容易觀察到生育差異。這些現象使研究團隊開始把鐵營養與環境逆境連結起來。後續分析指出，低溫與低日照可能降低根部鐵還原酵素活性。此時即使土壤有鐵，植物也未必能順利轉換及吸收，形成由環境壓力引起的鐵營養不足。\r\n\r\n果菜類大量開花結果時，也可能面臨相似問題。著果後，果實成為主要養分需求端，植株需要維持較高的光合作用與代謝能力。若根系吸收跟不上需求，葉片外觀可能仍維持綠色，植株內部卻已出現「潛在性缺鐵」，進而表現為生長趨緩、著果疲乏或產量下降。這也說明鐵管理不能只在葉片黃化後才開始。作物生育階段、根系狀況與環境條件，同樣是判斷鐵營養的重要依據。\r\n\r\n【鐵資材的效果仍要回到田間條件判斷】\r\n\r\n鐵進入土壤後，會受到酸鹼值、水分、氧化還原狀態、有機質及其他元素影響。不同土壤與栽培方式下，同一種鐵材料的效果可能差異很大。酸性土壤中的鐵通常較容易溶解，但濃度過高也可能產生毒害；石灰質或鹼性土壤則容易讓鐵形成難溶化合物，造成植株缺鐵。土壤長期積水時，鐵的還原狀態也會改變，排水恢復後又可能重新氧化。\r\n\r\n根系健康同樣重要。若土壤壓實、缺氧、鹽分過高，或根部已受病害影響，即使補充可利用的鐵，植株仍可能無法正常吸收。因此，鐵資材不能脫離灌溉、排水、土壤pH值、根圈環境與肥培管理單獨判斷。\r\n\r\n田間若出現新葉黃化、生長停滯或著果後快速衰弱，也不能直接認定是缺鐵。氮、鎂、錳等元素不足、根系受損、病害與積水，都可能出現類似症狀。較適合的做法，是搭配土壤與植體分析，確認缺鐵原因，再決定是否調整鐵源或其他栽培條件。\r\n\r\n【高溫下的缺鐵，成為新的研究方向】\r\n\r\n鐵吸收問題過去多與低溫、低日照或鹼性土壤連結，近年則開始關注高溫造成的鐵營養失衡。部分作物在高溫下會出現葉片白化，顯示鐵的吸收、運輸或植體內部調控可能受到影響。\r\n\r\n愛知製鋼與日本理化學研究所合作，研究禾本科植物用來取得鐵的「麥根酸」及其在高溫環境下的生理作用。相
